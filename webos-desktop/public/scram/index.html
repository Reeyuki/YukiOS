<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser</title>
    <link rel="icon" href="/s/dogfavi.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
      import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
      window.BareMux = BareMux;
    </script>
    <style>
      :root {
        --bg: #080808;
        --surface: #101010;
        --surface-hover: #161616;
        --surface-active: #1e1e1e;
        --surface-glass: rgba(16, 16, 16, 0.85);
        --border: #1c1c1c;
        --border-light: #272727;
        --border-glow: rgba(255, 255, 255, 0.06);

        --text: #ececec;
        --text-muted: #5a5a5a;
        --text-dim: #3a3a3a;

        --accent: #e8e8e8;
        --accent-dim: rgba(232, 232, 232, 0.7);
        --accent-glow: rgba(255, 255, 255, 0.08);

        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --info: #3b82f6;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.7);

        --radius-sm: 5px;
        --radius-md: 9px;
        --radius-lg: 13px;
        --radius-full: 9999px;

        --transition-fast: 0.1s ease;
        --transition-normal: 0.18s ease;
        --transition-slow: 0.3s ease;

        --font-sans: "Geist", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", monospace;

        --nav-height: 52px;
        --tabs-height: 40px;
        --chrome-height: calc(var(--nav-height) + var(--tabs-height) + 2px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html,
      #app {
        font-family: var(--font-sans);
        width: 100vw;
        height: 100vh;
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .browser-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      /* ── TABS ── */
      .tabs {
        display: flex;
        align-items: flex-end;
        padding: 8px 10px 0;
        gap: 3px;
        background: var(--bg);
        overflow-x: auto;
        flex-shrink: 0;
        height: var(--tabs-height);
      }

      .tabs::-webkit-scrollbar {
        height: 0;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 11px;
        min-width: 160px;
        max-width: 210px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        cursor: pointer;
        transition:
          background var(--transition-fast),
          border-color var(--transition-fast);
        position: relative;
      }

      .tab::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--surface);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }

      .tab.active::after {
        opacity: 1;
      }

      .tab:hover {
        background: var(--surface-hover);
      }

      .tab.active {
        background: var(--surface-hover);
        border-color: var(--border-light);
      }

      .tab-favicon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex-shrink: 0;
        opacity: 0.9;
      }

      .tab-title {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .tab-close {
        font-size: 14px;
        color: var(--text-muted);
        cursor: pointer;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all var(--transition-fast);
        flex-shrink: 0;
        opacity: 0;
      }

      .tab:hover .tab-close {
        opacity: 1;
      }

      .tab-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .new-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: 12px;
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .new-tab:hover {
        background: var(--surface);
        color: var(--text-muted);
      }

      /* ── NAV BAR ── */
      .nav {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        flex-shrink: 0;
      }

      .nav-btn-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 3px;
      }

      .nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: 13px;
      }

      .nav button:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .address-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }

      .address-icon {
        position: absolute;
        left: 12px;
        color: var(--text-dim);
        font-size: 11px;
        pointer-events: none;
        z-index: 1;
      }

      input.bar {
        width: 100%;
        height: 38px;
        padding: 0 40px 0 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        color: var(--text);
        font-size: 12.5px;
        font-family: var(--font-sans);
        outline: none;
        transition: all var(--transition-normal);
        letter-spacing: -0.01em;
      }

      input.bar:focus {
        border-color: var(--border-light);
        background: var(--surface-hover);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      input.bar::placeholder {
        color: var(--text-muted);
      }

      #star-btn {
        position: absolute;
        right: 38px;
        width: 28px;
        height: 28px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      #star-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      #home-btn-nav {
        position: absolute;
        right: 5px;
        width: 28px;
        height: 28px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: all var(--transition-fast);
      }

      #home-btn-nav:hover {
        color: var(--text);
        background: var(--surface-active);
      }

      .nav-action-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 3px;
      }

      /* ── LOADING BAR ── */
      .loading-bar-container {
        height: 2px;
        background: transparent;
        flex-shrink: 0;
      }

      .loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, transparent, var(--text), transparent);
        background-size: 200% 100%;
        transition:
          width 0.25s ease,
          opacity 0.15s;
      }

      /* ── IFRAME ── */
      .iframe-container {
        flex: 1;
        position: relative;
        background: var(--bg);
        overflow: hidden;
      }

      .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        position: absolute;
        top: 0;
        left: 0;
      }

      .iframe-container iframe.hidden {
        display: none;
      }

      .iframe-container iframe.loading {
        filter: blur(12px) brightness(0.7);
        transition: filter 0.4s ease;
      }

      .message-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        color: var(--text);
        text-align: center;
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(8, 8, 8, 0.75);
        backdrop-filter: blur(20px) saturate(0.5);
        -webkit-backdrop-filter: blur(20px) saturate(0.5);
        z-index: 10;
      }

      .message-content {
        max-width: 360px;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
      }

      .message-content h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .message-content p {
        color: var(--text-muted);
        font-size: 12px;
        word-break: break-all;
        font-family: var(--font-mono);
        line-height: 1.6;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 20px;
      }

      #skip-btn {
        margin-top: 20px;
        padding: 7px 18px;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-full);
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font-sans);
        transition: all var(--transition-normal);
        display: none;
        letter-spacing: -0.01em;
      }

      #skip-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
        background: var(--surface-hover);
      }

      /* ── TAB SPINNER ── */
      .tab-spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── SETTINGS MODAL ── */
      .wisp-settings-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.15s ease;
      }

      .wisp-settings-modal.hidden {
        display: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .settings-card {
        background: var(--surface);
        width: 420px;
        max-width: 90vw;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-xl);
        overflow: hidden;
        animation: slideUp 0.18s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .settings-header h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 9px;
        letter-spacing: -0.02em;
      }

      .settings-header h2 i {
        font-size: 12px;
        color: var(--text-muted);
      }

      .close-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 15px;
        cursor: pointer;
        padding: 5px;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
        display: flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      .settings-content {
        padding: 18px 20px;
        max-height: 52vh;
        overflow-y: auto;
      }

      .settings-content::-webkit-scrollbar {
        width: 4px;
      }

      .settings-content::-webkit-scrollbar-track {
        background: transparent;
      }

      .settings-content::-webkit-scrollbar-thumb {
        background: var(--border-light);
        border-radius: 2px;
      }

      .section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        margin-bottom: 10px;
        font-weight: 600;
        font-family: var(--font-mono);
      }

      .server-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 22px;
      }

      .wisp-option {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 11px 13px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .wisp-option:hover {
        border-color: var(--border-light);
      }

      .wisp-option.active {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.03);
      }

      .wisp-option-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .wisp-option-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
        letter-spacing: -0.01em;
      }

      .wisp-option-name i {
        font-size: 9px;
        color: var(--success);
      }

      .wisp-option-url {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-muted);
        margin-top: 1px;
      }

      .server-status {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ping-text {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
      }

      .status-indicator {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--text-dim);
        transition: background var(--transition-normal);
      }

      .status-indicator.status-success {
        background: var(--success);
        box-shadow: 0 0 4px var(--success);
      }
      .status-indicator.status-error {
        background: var(--error);
      }

      .custom-input-group {
        display: flex;
        gap: 7px;
      }

      .custom-input-group input {
        flex: 1;
        height: 36px;
        padding: 0 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 11.5px;
        outline: none;
        transition: all var(--transition-fast);
        letter-spacing: -0.01em;
      }

      .custom-input-group input:focus {
        border-color: var(--border-light);
      }
      .custom-input-group input::placeholder {
        color: var(--text-dim);
      }

      .custom-input-group button {
        height: 36px;
        width: 36px;
        background: var(--surface-hover);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
      }

      .custom-input-group button:hover {
        background: var(--surface-active);
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .settings-footer {
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 11px;
        font-family: var(--font-mono);
        letter-spacing: -0.01em;
      }

      .delete-wisp-btn {
        background: transparent;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        padding: 3px;
        transition: color var(--transition-fast);
        font-size: 11px;
        display: flex;
        align-items: center;
      }

      .delete-wisp-btn:hover {
        color: var(--error);
      }

      .flex {
        display: flex;
      }

      /* Panel styles */
      .panel-empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
      }

      .panel-section-label {
        padding: 12px 0 8px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
      }

      .panel-section-items {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .panel-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background var(--transition-fast);
      }

      .panel-item:hover {
        background: var(--surface-hover);
      }

      .panel-item-favicon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel-item-favicon img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }

      .panel-item-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }

      .panel-item-content {
        flex: 1;
        min-width: 0;
      }

      .panel-item-title {
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .panel-item-sub {
        color: var(--text-muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .panel-item-action {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      .panel-item-action:hover {
        color: var(--text);
        background: var(--surface-active);
      }

      /* ── WINDOW CONTROLS ── */
      .window-controls {
        display: flex;
        gap: 6px;
        padding: 4px;
      }

      .window-controls button {
        width: 46px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 6px;
        background-color: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .window-controls button svg {
        width: 10px;
        height: 10px;
        fill: var(--text-muted);
        transition: fill 0.2s ease;
      }

      .window-controls .minimize-btn:hover,
      .window-controls .maximize-btn:hover {
        background: var(--surface-hover);
        transform: scale(1.1);
      }

      .window-controls .close-btn:hover {
        background: var(--error);
        transform: scale(1.1);
      }

      .window-controls .close-btn:hover svg {
        fill: var(--text);
      }
    </style>
    <script defer>
      const DEFAULT_WISP = "wss://anura.pro/";
      const WISP_SERVERS = [
        { name: "Reeyuki Wisp", url: "wss://hurt-agata-liventcord-api-7072e9a6.koyeb.app/" },
        { name: "Reeyuki Wisp 2", url: "wss://reeyukiwisp.onrender.com/" },
        { name: "Anura's Wisp", url: "wss://anura.pro/" }
      ];

      const urlParams = new URLSearchParams(window.location.search);
      const wispParam = urlParams.get("wisp");
      const wispUrl = wispParam || DEFAULT_WISP;

      if (!localStorage.getItem("proxServer")) {
        localStorage.setItem("proxServer", wispUrl);
      } else if (wispParam) {
        localStorage.setItem("proxServer", wispUrl);
      }

      if (typeof BareMux === "undefined") {
        BareMux = {
          BareMuxConnection: class {
            constructor() {}
            setTransport() {}
          }
        };
      }

      let scramjet;
      let tabs = [];
      let activeTabId = null;
      let nextTabId = 1;

      let bookmarks = [];
      let history = [];
      let downloads = [];
      let closedTabs = [];
      let zoomLevel = 1.0;
      let darkModeEnabled = false;
      let darkModeExclusions = {};
      let isIncognito = false;

      const STORAGE_KEYS = {
        BOOKMARKS: "scramjet_bookmarks",
        HISTORY: "scramjet_history",
        DOWNLOADS: "scramjet_downloads",
        ZOOM: "scramjet_zoom",
        DARKMODE: "scramjet_darkmode",
        DARK_EXCLUSIONS: "scramjet_darkexclusions"
      };

      function loadPrefs() {
        isIncognito = new URLSearchParams(window.location.search).get("incognito") === "true";

        if (!isIncognito) {
          try {
            bookmarks = JSON.parse(localStorage.getItem(STORAGE_KEYS.BOOKMARKS) || "[]");
            history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || "[]");
            downloads = JSON.parse(localStorage.getItem(STORAGE_KEYS.DOWNLOADS) || "[]");
            zoomLevel = parseFloat(localStorage.getItem(STORAGE_KEYS.ZOOM)) || 1.0;
            darkModeEnabled = localStorage.getItem(STORAGE_KEYS.DARKMODE) === "true";
            darkModeExclusions = JSON.parse(localStorage.getItem(STORAGE_KEYS.DARK_EXCLUSIONS) || "{}");
          } catch (e) {
            console.error("Failed to load prefs:", e);
          }
        }
      }

      function saveBookmarks() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.BOOKMARKS, JSON.stringify(bookmarks));
        } catch (e) {}
      }

      function saveHistory() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history.slice(-500)));
        } catch (e) {}
      }

      function saveDownloads() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.DOWNLOADS, JSON.stringify(downloads));
        } catch (e) {}
      }

      function savePrefs() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.ZOOM, String(zoomLevel));
          localStorage.setItem(STORAGE_KEYS.DARKMODE, String(darkModeEnabled));
          localStorage.setItem(STORAGE_KEYS.DARK_EXCLUSIONS, JSON.stringify(darkModeExclusions));
        } catch (e) {}
      }

      function addToHistory(url, title) {
        if (isIncognito) return;
        history.push({ url, title: title || url, time: Date.now() });
        saveHistory();
      }

      document.addEventListener("DOMContentLoaded", async function () {
        let basePath = location.pathname.replace(/[^/]*$/, "");
        if (!basePath.endsWith("/")) basePath += "/";
        const { ScramjetController } = $scramjetLoadController();

        scramjet = new ScramjetController({
          prefix: basePath + "scramjet/",
          files: {
            wasm: "https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm",
            all: "https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js",
            sync: "https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js"
          }
        });

        await scramjet.init();

        if ("serviceWorker" in navigator) {
          const reg = await navigator.serviceWorker.register(basePath + "sw.js", { scope: basePath });
          await navigator.serviceWorker.ready;

          const wispUrl = localStorage.getItem("proxServer") || DEFAULT_WISP;
          const sw = reg.active || navigator.serviceWorker.controller;

          if (sw) sw.postMessage({ type: "config", wispurl: wispUrl });

          if (navigator.serviceWorker.controller && navigator.serviceWorker.controller !== sw) {
            navigator.serviceWorker.controller.postMessage({
              type: "config",
              wispurl: wispUrl
            });
          }

          reg.update();

          const connection = new BareMux.BareMuxConnection(basePath + "bareworker.js");
          await connection.setTransport(
            "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs",
            [{ wisp: wispUrl }]
          );
        }

        initializeBrowser();
        if (new URLSearchParams(window.location.search).get("embed") === "1") {
          const observer = new MutationObserver(() => {
            const els = document.querySelectorAll(".flex.tabs, .flex.nav, .loading-bar-container");
            if (els.length) {
              els.forEach((el) => el.remove());
              observer.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      });

      async function initializeBrowser() {
        loadPrefs();

        const root = document.getElementById("app");
        root.innerHTML = `
        <div class="browser-container">
          <div class="flex tabs" id="tabs-container" style="display:flex;align-items:center;">
            <div id="tab-strip" style="display:flex;flex:1;overflow:auto;align-items:center;min-width:0;"></div>
            <div id="controls-slot" style="display:flex;align-items:center;flex-shrink:0;"></div>
          </div>
          <div class="flex nav">
            <div class="nav-btn-group">
              <button id="back-btn" title="Back"><i class="fa-solid fa-chevron-left"></i></button>
              <button id="fwd-btn" title="Forward"><i class="fa-solid fa-chevron-right"></i></button>
              <button id="reload-btn" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="address-wrapper">
              <i class="fa-solid fa-lock address-icon"></i>
              <input class="bar" id="address-bar" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" />
              <button id="star-btn" title="Bookmark this page"><i class="fa-solid fa-star"></i></button>
              <button id="home-btn-nav" title="Home"><i class="fa-solid fa-house"></i></button>
            </div>
            <div class="nav-action-group">
              <button id="zoom-out-btn" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
              <span id="zoom-label" style="margin-top: 10px; font-size:11px;color:var(--text-muted);min-width:35px;text-align:center;">100%</span>
              <button id="zoom-in-btn" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
              <button id="darkmode-btn" title="Dark Mode"><i class="fa-solid fa-moon"></i></button>
              <button id="save-page-btn" title="Save Page"><i class="fa-solid fa-bookmark"></i></button>
              <button id="bookmarks-btn" title="Bookmarks"><i class="fa-solid fa-star"></i></button>
              <button id="history-btn" title="History"><i class="fa-solid fa-clock-rotate-left"></i></button>
              <button id="downloads-btn" title="Downloads"><i class="fa-solid fa-download"></i></button>
              <button id="devtools-btn" title="DevTools"><i class="fa-solid fa-code"></i></button>
              <button id="wisp-settings-btn" title="Proxy Settings"><i class="fa-solid fa-gear"></i></button>
            </div>
          </div>
          <div class="loading-bar-container"><div class="loading-bar" id="loading-bar"></div></div>
          <div class="iframe-container" id="iframe-container">
            <div id="loading" class="message-container" style="display: none;">
              <div class="message-content">
                <div class="spinner"></div>
                <h1 id="loading-title">Connecting</h1>
                <p id="loading-url">Initializing proxy...</p>
                <button id="skip-btn">Skip</button>
              </div>
            </div>
            <div id="error" class="message-container" style="display: none;">
              <div class="message-content">
                <h1>Connection Error</h1>
                <p id="error-message">An error occurred.</p>
              </div>
            </div>
          </div>
        </div>`;

        document.getElementById("back-btn").onclick = () => getActiveTab()?.frame.back();
        document.getElementById("fwd-btn").onclick = () => getActiveTab()?.frame.forward();
        document.getElementById("reload-btn").onclick = () => getActiveTab()?.frame.reload();
        document.getElementById("home-btn-nav").onclick = () => getActiveTab()?.frame.reload();
        document.getElementById("star-btn").onclick = toggleBookmark;
        document.getElementById("devtools-btn").onclick = toggleDevTools;
        document.getElementById("wisp-settings-btn").onclick = openSettings;

        document.getElementById("zoom-in-btn").onclick = () => {
          zoomLevel = Math.min(3.0, parseFloat((zoomLevel + 0.1).toFixed(1)));
          applyZoom();
          savePrefs();
        };
        document.getElementById("zoom-out-btn").onclick = () => {
          zoomLevel = Math.max(0.3, parseFloat((zoomLevel - 0.1).toFixed(1)));
          applyZoom();
          savePrefs();
        };
        document.getElementById("darkmode-btn").onclick = toggleDarkMode;
        document.getElementById("save-page-btn").onclick = savePage;
        document.getElementById("bookmarks-btn").onclick = openBookmarksPanel;
        document.getElementById("history-btn").onclick = openHistoryPanel;
        document.getElementById("downloads-btn").onclick = openDownloadsPanel;

        updateZoomLabel();

        const skipBtn = document.getElementById("skip-btn");
        if (skipBtn) {
          skipBtn.onclick = () => {
            const tab = getActiveTab();
            if (tab) {
              tab.loading = false;
              showIframeLoading(false);
            }
          };
        }

        const addrBar = document.getElementById("address-bar");
        addrBar.onkeyup = (e) => {
          if (e.key === "Enter") handleSubmit();
        };
        addrBar.onfocus = () => addrBar.select();

        window.addEventListener("message", (e) => {
          if (e.data?.type === "navigate") handleSubmit(e.data.url);
          if (e.data?.type === "hide-chrome") {
            document.querySelectorAll(".flex.tabs, .flex.nav, .loading-bar-container").forEach((el) => el.remove());
          }
          if (e.data?.type === "browser-audio-playing") {
            const tab = getActiveTab();
            if (tab) {
              tab.isPlayingAudio = e.data.playing;
              updateTabsUI();
            }
          }
        });

        createTab(true);
        checkHashParameters();
      }

      function createTab(makeActive = true) {
        const frame = scramjet.createFrame();
        const tab = {
          id: nextTabId++,
          title: "New Tab",
          url: "NT.html",
          frame: frame,
          loading: false,
          favicon: null,
          skipTimeout: null,
          isPlayingAudio: false
        };

        frame.frame.src = "NT.html";

        frame.addEventListener("urlchange", (e) => {
          tab.url = e.url;
          tab.loading = true;

          if (tab.id === activeTabId) showIframeLoading(true, tab.url);

          try {
            const urlObj = new URL(e.url);
            tab.title = urlObj.hostname;
            tab.favicon = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
            addToHistory(e.url, tab.title);
          } catch {
            tab.title = "Browsing";
            tab.favicon = null;
          }

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 10);

          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          tab.skipTimeout = setTimeout(() => {
            if (tab.loading && tab.id === activeTabId) {
              const skipBtn = document.getElementById("skip-btn");
              if (skipBtn) skipBtn.style.display = "inline-block";
            }
          }, 1000);
        });

        frame.frame.addEventListener("load", () => {
          tab.loading = false;
          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          if (tab.id === activeTabId) showIframeLoading(false);

          injectAudioDetector(frame.frame);

          if (darkModeEnabled) applyDarkModeToTab(tab);

          applyZoomToTab(tab);

          try {
            const title = frame.frame.contentWindow.document.title;
            if (title) tab.title = title;
          } catch {}

          if (frame.frame.contentWindow.location.href.includes("NT.html")) {
            tab.title = "New Tab";
            tab.url = "";
            tab.favicon = null;
          }

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 100);
        });

        tabs.push(tab);
        document.getElementById("iframe-container").appendChild(frame.frame);
        if (makeActive) switchTab(tab.id);
        return tab;
      }

      function showIframeLoading(show, url = "") {
        const loader = document.getElementById("loading");
        const title = document.getElementById("loading-title");
        const urlText = document.getElementById("loading-url");
        const skipBtn = document.getElementById("skip-btn");

        if (loader) {
          loader.style.display = show ? "flex" : "none";
          const tab = getActiveTab();
          if (tab) tab.frame.frame.classList.toggle("loading", show);
          if (show) {
            title.textContent = "Connecting";
            urlText.textContent = url || "Loading content...";
            skipBtn.style.display = "none";
          }
        }
      }

      function switchTab(tabId) {
        activeTabId = tabId;
        const tab = getActiveTab();
        tabs.forEach((t) => t.frame.frame.classList.toggle("hidden", t.id !== tabId));
        if (tab) showIframeLoading(tab.loading, tab.url);
        updateTabsUI();
        updateAddressBar();
      }

      function closeTab(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        if (tabs[idx].skipTimeout) clearTimeout(tabs[idx].skipTimeout);
        tabs[idx].frame.frame.remove();
        tabs.splice(idx, 1);
        if (activeTabId === tabId) {
          if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
          else createTab(true);
        } else {
          updateTabsUI();
        }
      }

      function updateTabsUI() {
        const container = document.getElementById("tab-strip");
        container.innerHTML = "";

        tabs.forEach((tab) => {
          const el = document.createElement("div");
          el.className = `tab ${tab.id === activeTabId ? "active" : ""}`;

          let iconHtml = "";
          if (tab.loading) {
            iconHtml = `<div class="tab-spinner"></div>`;
          } else if (tab.favicon) {
            iconHtml = `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">`;
          }

          const audioIcon = tab.isPlayingAudio
            ? `<span class="tab-audio-icon" style="font-size:10px;margin-left:4px;">🔊</span>`
            : "";

          el.innerHTML = `
            ${iconHtml}
            <span class="tab-title">${tab.title}</span>
            ${audioIcon}
            <span class="tab-close">&times;</span>
          `;

          el.onclick = () => switchTab(tab.id);
          el.querySelector(".tab-close").onclick = (e) => {
            e.stopPropagation();
            closeTab(tab.id);
          };
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            openTabContextMenu(tab, e);
          });
          container.appendChild(el);
        });

        const newBtn = document.createElement("button");
        newBtn.className = "new-tab";
        newBtn.innerHTML = "<i class='fa-solid fa-plus'></i>";
        newBtn.onclick = () => createTab(true);
        container.appendChild(newBtn);
      }

      function updateAddressBar() {
        const bar = document.getElementById("address-bar");
        const tab = getActiveTab();
        if (bar && tab) {
          bar.value = tab.url && !tab.url.includes("NT.html") ? tab.url : "";
        }
      }

      function getActiveTab() {
        return tabs.find((t) => t.id === activeTabId);
      }

      function handleSubmit(url) {
        const tab = getActiveTab();
        let input = url || document.getElementById("address-bar").value.trim();
        if (!input) return;
        if (!input.startsWith("http")) {
          if (input.includes(".") && !input.includes(" ")) input = "https://" + input;
          else input = "https://search.brave.com/search?q=" + encodeURIComponent(input);
        }
        tab.frame.go(input);
      }

      function updateLoadingBar(tab, percent) {
        if (tab.id !== activeTabId) return;
        const bar = document.getElementById("loading-bar");
        bar.style.width = percent + "%";
        bar.style.opacity = percent === 100 ? "0" : "1";
        if (percent === 100)
          setTimeout(() => {
            bar.style.width = "0%";
          }, 200);
      }

      function openSettings() {
        const modal = document.getElementById("wisp-settings-modal");
        modal.classList.remove("hidden");
        document.getElementById("close-wisp-modal").onclick = () => modal.classList.add("hidden");
        document.getElementById("save-custom-wisp").onclick = saveCustomWisp;
        modal.onclick = (e) => {
          if (e.target === modal) modal.classList.add("hidden");
        };
        renderServerList();
      }

      function getStoredWisps() {
        try {
          return JSON.parse(localStorage.getItem("customWisps") || "[]");
        } catch {
          return [];
        }
      }

      function renderServerList() {
        const list = document.getElementById("server-list");
        list.innerHTML = "";
        const currentUrl = localStorage.getItem("proxServer") || DEFAULT_WISP;
        const allWisps = [...WISP_SERVERS, ...getStoredWisps()];

        allWisps.forEach((server, index) => {
          const isActive = server.url === currentUrl;
          const isCustom = index >= WISP_SERVERS.length;
          const item = document.createElement("div");
          item.className = `wisp-option ${isActive ? "active" : ""}`;

          const deleteBtn = isCustom
            ? `<button class="delete-wisp-btn" onclick="event.stopPropagation(); deleteCustomWisp('${server.url}')"><i class="fa-solid fa-trash-can"></i></button>`
            : "";

          item.innerHTML = `
            <div class="wisp-option-header">
              <div class="wisp-option-name">
                ${server.name}
                ${isActive ? '<i class="fa-solid fa-check"></i>' : ""}
              </div>
              <div class="server-status">
                <span class="ping-text">-</span>
                <div class="status-indicator"></div>
                ${deleteBtn}
              </div>
            </div>
            <div class="wisp-option-url">${server.url}</div>
          `;

          item.onclick = () => setWisp(server.url);
          list.appendChild(item);
          checkServerHealth(server.url, item);
        });
      }

      function saveCustomWisp() {
        const input = document.getElementById("custom-wisp-input");
        const url = input.value.trim();
        if (!url) return;
        if (!url.startsWith("ws://") && !url.startsWith("wss://")) {
          alert("URL must start with wss:// or ws://");
          return;
        }

        const customWisps = getStoredWisps();
        if (customWisps.some((w) => w.url === url) || WISP_SERVERS.some((w) => w.url === url)) {
          alert("This server is already in the list.");
          return;
        }

        customWisps.push({ name: `Custom ${customWisps.length + 1}`, url });
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        input.value = "";
        renderServerList();
      }

      window.deleteCustomWisp = function (urlToDelete) {
        if (!confirm("Remove this server?")) return;
        let customWisps = getStoredWisps().filter((w) => w.url !== urlToDelete);
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        if (localStorage.getItem("proxServer") === urlToDelete) setWisp(DEFAULT_WISP);
        else renderServerList();
      };

      async function checkServerHealth(url, element) {
        const dot = element.querySelector(".status-indicator");
        const text = element.querySelector(".ping-text");
        const start = Date.now();

        try {
          const socket = new WebSocket(url);
          const timeout = setTimeout(() => {
            if (socket.readyState !== WebSocket.OPEN) {
              socket.close();
              markOffline();
            }
          }, 3000);

          socket.onopen = () => {
            clearTimeout(timeout);
            const latency = Date.now() - start;
            socket.close();
            dot.classList.add("status-success");
            text.textContent = `${latency}ms`;
          };

          socket.onerror = () => {
            clearTimeout(timeout);
            markOffline();
          };
        } catch {
          markOffline();
        }

        function markOffline() {
          dot.classList.add("status-error");
          text.textContent = "offline";
          const currentWisp = localStorage.getItem("proxServer") || DEFAULT_WISP;
          if (url === currentWisp && typeof Notify !== "undefined") {
            Notify.error("Connection Failed", "Current proxy server is offline. Try switching servers.");
          }
        }
      }

      function setWisp(url) {
        const oldUrl = localStorage.getItem("proxServer");
        localStorage.setItem("proxServer", url);

        if (typeof Notify !== "undefined" && oldUrl !== url) {
          const serverName = [...WISP_SERVERS, ...getStoredWisps()].find((s) => s.url === url)?.name || "Custom Server";
          Notify.success("Proxy Changed", `Switching to ${serverName}...`);
        }

        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: "config",
            wispurl: url
          });
        }

        setTimeout(() => location.reload(), 600);
      }

      function toggleDevTools() {
        const win = getActiveTab()?.frame.frame.contentWindow;
        if (!win) return;
        if (win.eruda) {
          win.eruda.show();
          return;
        }
        const script = win.document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/eruda";
        script.onload = () => {
          win.eruda.init();
          win.eruda.show();
        };
        win.document.body.appendChild(script);
      }

      async function checkHashParameters() {
        if (window.location.hash) {
          const hash = decodeURIComponent(window.location.hash.substring(1));
          if (hash) handleSubmit(hash);
          history.replaceState(null, null, location.pathname);
        }
      }

      function updateZoomLabel() {
        const label = document.getElementById("zoom-label");
        if (label) label.textContent = Math.round(zoomLevel * 100) + "%";
      }

      function applyZoom() {
        updateZoomLabel();
        const tab = getActiveTab();
        if (tab) applyZoomToTab(tab);
      }

      function applyZoomToTab(tab) {
        if (!tab || !tab.frame.frame) return;
        const transform = `scale(${zoomLevel})`;
        tab.frame.frame.style.transform = transform;
        tab.frame.frame.style.transformOrigin = "top left";
        const inverseScale = 1 / zoomLevel;
        tab.frame.frame.style.width = `${100 * inverseScale}%`;
        tab.frame.frame.style.height = `${100 * inverseScale}%`;
      }

      function injectAudioDetector(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const script = doc.createElement("script");
          script.textContent = `(function(){
            function check() {
              var playing = Array.from(document.querySelectorAll('audio,video')).some(function(m){
                return !m.paused && !m.muted && m.volume > 0;
              });
              window.parent.postMessage({type:'browser-audio-playing',playing:playing},'*');
            }
            setInterval(check, 1500);
          })();`;
          (doc.head || doc.documentElement).appendChild(script);
        } catch (e) {}
      }

      function applyDarkModeToTab(tab) {
        if (!tab || !tab.frame.frame || !tab.frame.frame.contentDocument) return;
        const styleId = "scramjet-darkmode-style";
        let styleEl = tab.frame.frame.contentDocument.getElementById(styleId);

        if (!darkModeEnabled) {
          if (styleEl) styleEl.remove();
          return;
        }

        let currentHost = "";
        try {
          currentHost = new URL(tab.frame.frame.contentWindow.location.href).hostname;
        } catch (e) {}

        if (darkModeExclusions[currentHost]) {
          if (styleEl) styleEl.remove();
          return;
        }

        if (!styleEl) {
          styleEl = tab.frame.frame.contentDocument.createElement("style");
          styleEl.id = styleId;
          tab.frame.frame.contentDocument.head.appendChild(styleEl);
        }

        styleEl.textContent = `
          html {
            filter: invert(90%) hue-rotate(180deg);
          }
          html img, html video, html canvas, html svg {
            filter: invert(100%) hue-rotate(180deg);
          }
        `;
      }

      function toggleDarkMode() {
        darkModeEnabled = !darkModeEnabled;
        savePrefs();
        const tab = getActiveTab();
        if (tab) applyDarkModeToTab(tab);
      }

      function savePage() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html" || tab.url === "") return;

        const existingIndex = bookmarks.findIndex((b) => b.url === tab.url);
        if (existingIndex === -1) {
          bookmarks.push({ name: tab.title || tab.url, url: tab.url });
          saveBookmarks();
          updateStarButton();
        }

        downloads.push({
          filename: tab.title || "Saved Page",
          url: tab.url,
          status: "done",
          time: Date.now()
        });
        saveDownloads();
      }

      function openBookmarksPanel() {
        closePanel();
        const panel = createPanel("Bookmarks", (filter) => renderBookmarksBody(filter), true);
      }

      function renderBookmarksBody(filter) {
        let items = bookmarks;
        if (filter) {
          const q = filter.toLowerCase();
          items = items.filter((b) => b.name.toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
        }
        if (items.length === 0)
          return `<div class="panel-empty">No bookmarks${filter ? " matching search" : ""}.</div>`;
        return items
          .map(
            (b, i) => `
          <div class="panel-item" data-url="${b.url}">
            <span class="panel-item-icon">★</span>
            <div class="panel-item-content">
              <div class="panel-item-title">${b.name}</div>
              <div class="panel-item-sub">${b.url}</div>
            </div>
            <button class="panel-item-action" data-remove="${i}">✕</button>
          </div>
        `
          )
          .join("");
      }

      function openHistoryPanel() {
        closePanel();
        const panel = createPanel("History", (filter) => renderHistoryBody(filter), true);
      }

      function renderHistoryBody(filter) {
        let items = [...history].reverse();
        if (filter) {
          const q = filter.toLowerCase();
          items = items.filter((h) => h.url.toLowerCase().includes(q) || (h.title || "").toLowerCase().includes(q));
        }
        if (items.length === 0) return `<div class="panel-empty">No history${filter ? " matching search" : ""}.</div>`;
        const groups = {};
        items.forEach((h) => {
          const d = new Date(h.time);
          const today = new Date();
          const isToday = d.toDateString() === today.toDateString();
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);
          const isYesterday = d.toDateString() === yesterday.toDateString();

          let key;
          if (isToday) key = "Today";
          else if (isYesterday) key = "Yesterday";
          else key = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

          if (!groups[key]) groups[key] = [];
          groups[key].push(h);
        });
        return Object.entries(groups)
          .map(
            ([date, entries]) => `
          <div class="panel-section-label">${date}</div>
          <div class="panel-section-items">
            ${entries
              .map((h) => {
                const d = new Date(h.time);
                const timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
                return `
            <div class="panel-item" data-url="${h.url}">
              <div class="panel-item-favicon">
                <img src="https://www.google.com/s2/favicons?domain=${new URL(h.url).hostname}&sz=32" onerror="this.style.display='none'" />
              </div>
              <div class="panel-item-content">
                <div class="panel-item-title">${h.title || h.url}</div>
                <div class="panel-item-sub">${new URL(h.url).hostname} • ${timeStr}</div>
              </div>
              <button class="panel-item-action" data-url="${h.url}" title="Open">↗</button>
            </div>
          `;
              })
              .join("")}
          </div>
        `
          )
          .join("");
      }

      function openDownloadsPanel() {
        closePanel();
        const panel = createPanel("Downloads", () => renderDownloadsBody());
      }

      function renderDownloadsBody() {
        if (downloads.length === 0) return `<div class="panel-empty">No downloads yet</div>`;
        return [...downloads]
          .reverse()
          .map(
            (d) => `
          <div class="panel-item">
            <span class="panel-item-icon">${d.status === "done" ? "📄" : d.status === "failed" ? "⚠️" : "⬇"}</span>
            <div class="panel-item-content">
              <div class="panel-item-title">${d.filename || "Unknown"}</div>
              <div class="panel-item-sub">${d.url || ""}</div>
            </div>
            <span class="panel-item-action" title="Open URL" data-url="${d.url}">↗</span>
          </div>
        `
          )
          .join("");
      }

      function createPanel(title, bodyRenderer, hasSearch = false) {
        const root = document.getElementById("app");
        const panel = document.createElement("div");
        panel.className = "browser-panel";
        panel.style.cssText =
          "position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;";
        panel.innerHTML = `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:500px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
            <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:14px;font-weight:600;color:var(--text);">${title}</span>
              <button class="panel-close" style="background:transparent;border:none;color:var(--text-muted);font-size:15px;cursor:pointer;padding:5px;border-radius:var(--radius-sm);">✕</button>
            </div>
            ${hasSearch ? `<input class="panel-search" placeholder="Search ${title.toLowerCase()}..." style="margin:16px 20px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-size:12px;outline:none;width:calc(100% - 40px);box-sizing:border-box;" />` : ""}
            <div class="panel-body" style="flex:1;overflow-y:auto;padding:0 20px 20px;"></div>
          </div>
        `;

        const body = panel.querySelector(".panel-body");
        const renderBody = (filter) => {
          body.innerHTML = bodyRenderer(filter);
          body.querySelectorAll("[data-url]").forEach((el) => {
            el.addEventListener("click", (e) => {
              if (e.target.dataset.remove !== undefined) return;
              const url = e.target.dataset.url || el.dataset.url;
              if (url) {
                handleSubmit(url);
                closePanel();
              }
            });
          });
          body.querySelectorAll("[data-remove]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const idx = parseInt(btn.dataset.remove);
              if (title === "Bookmarks") {
                bookmarks.splice(idx, 1);
                saveBookmarks();
                const searchInput = panel.querySelector(".panel-search");
                renderBody(searchInput ? searchInput.value : "");
              }
            });
          });
        };

        renderBody("");

        if (hasSearch) {
          const searchInput = panel.querySelector(".panel-search");
          searchInput.addEventListener("input", () => renderBody(searchInput.value));
        }

        panel.querySelector(".panel-close").addEventListener("click", closePanel);
        panel.addEventListener("click", (e) => {
          if (e.target === panel) closePanel();
        });

        root.appendChild(panel);
        return panel;
      }

      function closePanel() {
        const panel = document.querySelector(".browser-panel");
        if (panel) panel.remove();
      }

      function setupKeyboardShortcuts() {
        const listener = (e) => {
          const activeElement = document.activeElement;
          const inInput =
            activeElement &&
            (activeElement.tagName === "INPUT" ||
              activeElement.tagName === "TEXTAREA" ||
              activeElement.isContentEditable);
          if (inInput) return;

          if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && /^[1-9]$/.test(e.key)) {
            e.preventDefault();
            const index = parseInt(e.key, 10) - 1;
            const tab = tabs[index];
            if (tab) switchTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.key === "l") {
            e.preventDefault();
            document.getElementById("address-bar").focus();
            document.getElementById("address-bar").select();
            return;
          }

          if (e.ctrlKey && e.key === "t") {
            e.preventDefault();
            createTab(true);
            return;
          }

          if (e.ctrlKey && e.key === "w") {
            e.preventDefault();
            const tab = getActiveTab();
            if (tab) closeTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.shiftKey && e.key === "T") {
            e.preventDefault();
            reopenLastClosedTab();
            return;
          }
        };

        document.addEventListener("keydown", listener);
      }

      function reopenLastClosedTab() {
        if (closedTabs.length === 0) return;
        const closed = closedTabs.pop();
        createTab(true);
        const tab = getActiveTab();
        if (tab) handleSubmit(closed.url);
      }

      function openTabContextMenu(tab, e) {
        e.preventDefault();
        closePanel();
        const menu = document.createElement("div");
        menu.className = "ctx-menu";
        menu.style.cssText =
          "position:fixed;top:" +
          e.clientY +
          "px;left:" +
          e.clientX +
          "px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 0;min-width:180px;z-index:10000;box-shadow:var(--shadow-lg);";
        menu.innerHTML = `
          <div class="ctx-menu-item" data-action="new-tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-plus" style="width:16px;opacity:0.6;"></i> New Tab</div>
          <div class="ctx-menu-item" data-action="reload" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-sync-alt" style="width:16px;opacity:0.6;"></i> Reload</div>
          <div class="ctx-menu-item" data-action="duplicate" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-copy" style="width:16px;opacity:0.6;"></i> Duplicate Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          <div class="ctx-menu-item" data-action="close-tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-times-circle" style="width:16px;opacity:0.6;"></i> Close Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          <div class="ctx-menu-item" data-action="reopen-closed" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-undo" style="width:16px;opacity:0.6;"></i> Reopen Closed Tab${closedTabs.length ? ` (${closedTabs.length})` : ""}</div>
        `;

        menu.querySelectorAll(".ctx-menu-item").forEach((item) => {
          item.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const action = item.dataset.action;
            if (action === "new-tab") createTab(true);
            else if (action === "reload") tab.frame.reload();
            else if (action === "duplicate") {
              createTab(true);
              const newTab = getActiveTab();
              if (newTab && tab.url) handleSubmit(tab.url);
            } else if (action === "close-tab") closeTab(tab.id);
            else if (action === "reopen-closed") reopenLastClosedTab();
            closePanel();
          });
          item.addEventListener("mouseenter", () => (item.style.background = "var(--surface-hover)"));
          item.addEventListener("mouseleave", () => (item.style.background = ""));
        });

        document.body.appendChild(menu);

        const close = (ev) => {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener("click", close);
          }
        };
        setTimeout(() => document.addEventListener("click", close), 0);
      }

      const originalCloseTab = closeTab;
      closeTab = function (tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        const tab = tabs[idx];
        closedTabs.push({ url: tab.url, title: tab.title });
        if (closedTabs.length > 20) closedTabs.shift();
        originalCloseTab(tabId);
      };

      setupKeyboardShortcuts();

      function toggleBookmark() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html" || tab.url === "") return;

        const existingIndex = bookmarks.findIndex((b) => b.url === tab.url);
        if (existingIndex !== -1) {
          bookmarks.splice(existingIndex, 1);
        } else {
          bookmarks.push({ name: tab.title || tab.url, url: tab.url });
        }
        saveBookmarks();
        updateStarButton();
      }

      function updateStarButton() {
        const starBtn = document.getElementById("star-btn");
        if (!starBtn) return;
        const tab = getActiveTab();
        if (!tab || !tab.url) {
          starBtn.style.color = "var(--text-muted)";
          return;
        }
        const isBookmarked = bookmarks.some((b) => b.url === tab.url);
        starBtn.style.color = isBookmarked ? "var(--accent)" : "var(--text-muted)";
      }

      const originalSwitchTab = switchTab;
      switchTab = function (tabId) {
        originalSwitchTab(tabId);
        updateStarButton();
      };
    </script>
    <link rel="canonical" href="https://tickles.store/reactive" />
  </head>

  <body>
    <script>
      (function () {
        window.CLOAKS = {
          google: { title: "Google", icon: "/s/assets/google.ico" },
          classroom: {
            title: "Google Classroom",
            icon: "/s/assets/classroom.ico"
          },
          drive: {
            title: "My Drive - Google Drive",
            icon: "/s/assets/drive.png"
          },
          gmail: { title: "Gmail", icon: "/s/assets/gmail.ico" },
          ixl: { title: "IXL | Dashboard", icon: "/s/assets/ixl.png" },
          meet: { title: "Google Meet", icon: "/s/assets/meet.png" },
          docs: { title: "Document - Google Docs", icon: "/s/assets/docs.ico" },
          sheets: {
            title: "Spreadsheet - Google Sheets",
            icon: "/s/assets/sheets.ico"
          },
          slides: {
            title: "Presentation - Google Slides",
            icon: "/s/assets/slides.ico"
          }
        };

        window.DEFAULT_CLOAK = {
          title: "Markos's Classroom",
          icon: "/s/dogfavi.png"
        };

        function applyTabCloak() {
          try {
            var saved = localStorage.getItem("tabCloak");
            if (!saved) return;
            var data = JSON.parse(saved);
            if (!data || !data.title || !data.icon) return;
            document.title = data.title;
            var favicon = document.querySelector("link[rel='icon']");
            if (!favicon) {
              favicon = document.createElement("link");
              favicon.rel = "icon";
              document.head.appendChild(favicon);
            }
            favicon.href = data.icon;
          } catch (e) {}
        }

        applyTabCloak();

        window.applyCloakSelection = function (key) {
          var preset = window.CLOAKS[key] || window.DEFAULT_CLOAK;
          document.title = preset.title;
          var favicon = document.querySelector("link[rel='icon']");
          if (!favicon) {
            favicon = document.createElement("link");
            favicon.rel = "icon";
            document.head.appendChild(favicon);
          }
          favicon.href = preset.icon;
          localStorage.setItem(
            "tabCloak",
            JSON.stringify({
              key: key,
              title: preset.title,
              icon: preset.icon
            })
          );
          var status = document.getElementById("cloakStatus");
          if (status) status.textContent = "Current: " + preset.title;
        };
      })();
    </script>
