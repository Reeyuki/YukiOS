<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser</title>
    <link rel="icon" href="/s/dogfavi.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="adblock.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module">
      import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
      window.BareMux = BareMux;
    </script>
    <style>
      :root {
        --bg: #080808;
        --surface: #101010;
        --surface-hover: #161616;
        --surface-active: #1e1e1e;
        --surface-glass: rgba(16, 16, 16, 0.85);
        --border: #1c1c1c;
        --border-light: #272727;
        --border-glow: rgba(255, 255, 255, 0.06);

        --text: #ececec;
        --text-muted: #5a5a5a;
        --text-dim: #3a3a3a;

        --accent: #e8e8e8;
        --accent-dim: rgba(232, 232, 232, 0.7);
        --accent-glow: rgba(255, 255, 255, 0.08);

        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --info: #3b82f6;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.7);

        --radius-sm: 5px;
        --radius-md: 9px;
        --radius-lg: 13px;
        --radius-full: 9999px;

        --transition-fast: 0.1s ease;
        --transition-normal: 0.18s ease;
        --transition-slow: 0.3s ease;

        --font-sans: "Geist", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", monospace;

        --nav-height: 58px;
        --tabs-height: 48px;
        --chrome-height: calc(var(--nav-height) + var(--tabs-height) + 2px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }

      body,
      html,
      #app {
        font-family: var(--font-sans);
        width: 100vw;
        height: 100vh;
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .browser-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        padding: 10px 12px 0;
        gap: 4px;
        background: var(--bg);
        overflow: hidden;
        flex-shrink: 0;
        height: var(--tabs-height);
      }

      #tab-strip::-webkit-scrollbar {
        height: 6px;
      }
      #tab-strip::-webkit-scrollbar-track {
        background: transparent;
      }
      #tab-strip::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }
      #tab-strip::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        width: 200px;
        flex-shrink: 0;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        cursor: pointer;
        transition:
          background var(--transition-fast),
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
        position: relative;
      }

      .tab.tab-new {
        animation: tabPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tab.removing {
        animation: tabPopOut 0.2s ease forwards;
        pointer-events: none;
      }

      .tab:hover {
        background: var(--surface-hover);
      }

      .tab.active {
        background: var(--surface-hover);
        border-color: var(--border-light);
        box-shadow: inset 0 -3px 0 #3b82f6;
      }

      .tab.dragging {
        opacity: 0.5;
        border-style: dashed;
      }

      .tab.drag-over {
        border-left: 2px solid var(--brand, #888);
        margin-left: -1px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        flex-shrink: 0;
        opacity: 0.9;
      }

      .tab-title {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .tab-close {
        font-size: 15px;
        color: var(--text-muted);
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all var(--transition-fast);
        flex-shrink: 0;
        opacity: 0;
      }

      .tab:hover .tab-close {
        opacity: 1;
      }

      .tab-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        transform: scale(1.25) rotate(90deg);
      }

      .tab-close:active {
        transform: scale(0.85) rotate(90deg);
      }

      .new-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: 14px;
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .new-tab:hover {
        background: var(--surface);
        color: var(--text-muted);
        transform: rotate(90deg);
      }

      .new-tab:active {
        transform: rotate(90deg) scale(0.85);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        flex-shrink: 0;
      }

      .nav-btn-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 4px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-btn-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 14px;
      }

      .nav button:hover {
        background: var(--surface-hover);
        color: var(--text);
        transform: scale(1.06);
      }

      .nav button:active {
        animation: btnBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .nav button#adblock-btn.active {
        color: var(--success);
        text-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
      }
      .nav button#adblock-btn.active:hover {
        color: var(--success);
      }
      .nav button#adblock-btn.inactive {
        color: var(--text-muted);
        opacity: 0.5;
      }

      .address-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }

      .address-icon {
        position: absolute;
        left: 12px;
        color: var(--text-dim);
        font-size: 11px;
        pointer-events: none;
        z-index: 1;
      }

      input.bar {
        width: 100%;
        height: 42px;
        padding: 0 44px 0 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        color: var(--text);
        font-size: 13px;
        font-family: var(--font-sans);
        outline: none;
        transition: all var(--transition-normal);
        letter-spacing: -0.01em;
      }

      input.bar:focus {
        border-color: var(--border-light);
        background: var(--surface-hover);
        box-shadow: 0 0 0 3px var(--accent-glow);
        animation: pulseGlow 1.5s ease-in-out infinite;
      }

      input.bar::placeholder {
        color: var(--text-muted);
      }

      #star-btn {
        position: absolute;
        right: 42px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      #star-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      #home-btn-nav {
        position: absolute;
        right: 5px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: all var(--transition-fast);
      }

      #home-btn-nav:hover {
        color: var(--text);
        background: var(--surface-active);
      }

      .omnibox-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        max-height: 320px;
        overflow-y: auto;
        margin-top: 2px;
        animation: slideDownBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .omnibox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        cursor: pointer;
        transition:
          background 0.1s,
          transform 0.12s;
      }

      .omnibox-item:active {
        transform: scale(0.97);
      }

      .omnibox-item:hover,
      .omnibox-item.selected {
        background: var(--surface-hover);
      }

      .omnibox-item-icon {
        width: 18px;
        text-align: center;
        flex-shrink: 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .omnibox-item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .omnibox-item-url {
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        flex-shrink: 1;
        margin-left: auto;
      }

      .nav-action-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 3px;
        position: relative;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-action-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .main-menu-wrapper {
        position: relative;
        display: flex;
      }

      .main-menu-wrapper .browser-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        min-width: 220px;
        z-index: 1000;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        margin-top: 4px;
        overflow: hidden;
        animation: menuDropIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes menuDropIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }

      .main-menu-wrapper .browser-dropdown.open {
        display: block;
      }

      .adblock-popup {
        display: none;
        position: absolute;
        top: 100%;
        right: 36px;
        background: var(--surface);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        min-width: 250px;
        z-index: 1000;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        margin-top: 6px;
        overflow: hidden;
        animation: menuDropIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .adblock-popup.open { display: block; }

      .adblock-popup-body {
        padding: 20px 20px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .adblock-page-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .adblock-page-label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .adblock-page-num {
        font-size: 32px;
        font-weight: 700;
        font-family: var(--font-mono);
        color: var(--text);
        line-height: 1.2;
      }

      .adblock-total-row {
        display: flex;
        align-items: baseline;
        gap: 5px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .adblock-total-num {
        font-weight: 600;
        color: var(--text);
      }
      .adblock-total-pct {
        font-size: 11px;
        color: var(--text-dim);
      }

      .adblock-popup-actions {
        display: flex;
        gap: 6px;
        width: 100%;
        padding-top: 4px;
      }
      .adblock-action-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        font-size: 12px;
        cursor: pointer;
        padding: 8px 0;
        transition: all 0.15s;
      }
      .adblock-action-btn:hover {
        background: var(--surface-active);
        color: var(--text);
        border-color: var(--border-light);
      }

      .adblock-popup-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        background: var(--surface-hover);
        border-top: 1px solid var(--border);
      }
      .adblock-footer-text {
        font-size: 10px;
        color: var(--text-dim);
      }

      .adblock-log-container {
        padding: 12px;
      }
      .adblock-log-stats {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }
      .adblock-log-stat {
        flex: 1;
        background: var(--surface-hover);
        border-radius: var(--radius-sm);
        padding: 10px;
        text-align: center;
      }
      .adblock-log-stat-num {
        display: block;
        font-size: 20px;
        font-weight: 700;
        font-family: var(--font-mono);
        color: var(--text);
      }
      .adblock-log-stat-label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }
      .adblock-log-entries {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      .adblock-log-entry {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
      }
      .adblock-log-entry:last-child {
        border-bottom: none;
      }
      .adblock-log-entry-domain {
        font-weight: 600;
        color: var(--text);
      }
      .adblock-log-entry-url {
        color: var(--text-muted);
        word-break: break-all;
        font-family: var(--font-mono);
        font-size: 10px;
      }
      .adblock-log-entry-time {
        color: var(--text-dim);
        font-size: 10px;
      }

      .yuki-page-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: var(--bg);
        overflow-y: auto;
        z-index: 10;
      }
      .yuki-page-container .yuki-page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .yuki-page-container .yuki-back-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 16px;
        padding: 6px 8px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: all 0.15s;
        margin-right: 4px;
      }
      .yuki-page-container .yuki-back-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .yuki-page-container .yuki-page-header i {
        font-size: 18px;
        color: var(--text-muted);
        width: 24px;
        text-align: center;
      }
      .yuki-page-container .yuki-page-header h1 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        flex: 1;
      }
      .yuki-page-container .yuki-page-body {
        padding: 12px 16px;
      }
      .yuki-page-container .yuki-page-empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-dim);
        font-size: 14px;
      }
      .yuki-page-container .history-date {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        padding: 12px 8px 6px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .yuki-page-container .panel-item,
      .yuki-page-container .history-entry {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.1s;
      }
      .yuki-page-container .panel-item:hover,
      .yuki-page-container .history-entry:hover {
        background: var(--surface-hover);
      }
      .yuki-page-container .panel-item-icon {
        font-size: 16px;
        width: 24px;
        text-align: center;
        flex-shrink: 0;
      }
      .yuki-page-container .panel-item-content {
        flex: 1;
        min-width: 0;
      }
      .yuki-page-container .panel-item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .panel-item-sub {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .panel-item-action {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 14px;
        padding: 4px 6px;
        border-radius: 4px;
      }
      .yuki-page-container .panel-item-action:hover {
        background: var(--surface-active);
        color: var(--error);
      }
      .yuki-page-container .he-favicon {
        width: 18px;
        height: 18px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .yuki-page-container .he-body { flex: 1; min-width: 0; }
      .yuki-page-container .he-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .he-meta {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .he-time {
        font-size: 11px;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .yuki-page-container .yuki-search-bar {
        width: 100%;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 13px;
        margin-bottom: 8px;
        outline: none;
      }
      .yuki-page-container .yuki-search-bar:focus {
        border-color: var(--border-light);
      }

      .yuki-dialog-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.55);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .yuki-dialog-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
        min-width: 340px;
        max-width: 440px;

      .iframe-container {
        flex: 1;
        position: relative;
        background: var(--bg);
        overflow: hidden;
      }

      .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        position: absolute;
        top: 0;
        left: 0;
      }

      .iframe-container iframe.hidden {
        display: none;
      }

      .iframe-container iframe.loading {
        filter: blur(12px) brightness(0.7);
        transition: filter 0.4s ease;
      }

      .message-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        color: var(--text);
        text-align: center;
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(8, 8, 8, 0.75);
        backdrop-filter: blur(20px) saturate(0.5);
        -webkit-backdrop-filter: blur(20px) saturate(0.5);
        z-index: 10;
        animation: fadeIn 0.25s ease;
      }

      .message-content {
        max-width: 360px;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
      }

      .message-content h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .message-content p {
        color: var(--text-muted);
        font-size: 12px;
        word-break: break-all;
        font-family: var(--font-mono);
        line-height: 1.6;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 20px;
      }

      #skip-btn {
        margin-top: 20px;
        padding: 7px 18px;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-full);
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font-sans);
        transition: all var(--transition-normal);
        display: none;
        letter-spacing: -0.01em;
      }

      #skip-btn.show {
        display: inline-block;
        animation: bounceIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #skip-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
        background: var(--surface-hover);
      }

      .tab-spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bounceIn {
        0% {
          transform: scale(0.92);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes tabPopIn {
        0% {
          transform: scale(0.95) translateX(-8px);
          opacity: 0;
        }
        100% {
          transform: scale(1) translateX(0);
          opacity: 1;
        }
      }

      @keyframes tabPopOut {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.85) translateX(16px);
          opacity: 0;
        }
      }

      @keyframes slideInRight {
        0% {
          transform: translateX(28px);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fadeSlideUp {
        0% {
          transform: translateY(12px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes ripple {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.15);
        }
        100% {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--accent-glow);
        }
        50% {
          box-shadow: 0 0 0 6px var(--accent-glow);
        }
      }

      @keyframes bookmarkDrop {
        0% {
          transform: translateY(-100%);
          opacity: 0;
          max-height: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
          max-height: 40px;
        }
      }

      @keyframes btnBounce {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.92);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes slideDownBounce {
        0% {
          transform: translateY(-8px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      function sendToParent(msg) {
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage(msg, "*");
          } catch (e) {}
        }
      }

      function applyTheme(vars) {
        if (!vars) return;
        const root = document.documentElement;
        const m = {
          "--brand": "--accent",
          "--text-primary": "--text",
          "--text-secondary": "--text-muted",
          "--text-muted": "--text-dim",
          "--bg-primary": "--bg",
          "--bg-secondary": "--bg",
          "--surface-1": "--surface",
          "--surface-hover": "--surface-hover",
          "--surface-2": "--surface-active",
          "--glass-border": "--border",
          "--error": "--error",
          "--success": "--success",
          "--warning": "--warning",
          "--font-ui": "--font-sans",
          "--font-mono": "--font-mono"
        };
        Object.entries(m).forEach(([src, dst]) => {
          if (vars[src]) root.style.setProperty(dst, vars[src]);
        });
        if (vars["--bg-primary"]) {
          root.style.setProperty("--border-light", vars["--bg-primary"]);
          root.style.setProperty("--accent-dim", adjustAlpha(vars["--text-primary"] || "#ececec", 0.7));
          root.style.setProperty("--accent-glow", adjustAlpha(vars["--brand"] || "#e8e8e8", 0.08));
        }
      }

      function adjustAlpha(color, alpha) {
        if (color.startsWith("rgba")) return color.replace(/[\d.]+\)$/, alpha + ")");
        if (color.startsWith("rgb")) return color.replace("rgb", "rgba").replace(")", "," + alpha + ")");
        return color;
      }

      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || !data.type) return;
        if (data.type === "scram:init") {
          isEmbedded = true;
          if (data.vars) applyTheme(data.vars);
          if (isIncognito) return;
          if (Array.isArray(data.bookmarks)) {
            bookmarks = data.bookmarks;
            saveBookmarks();
            renderBookmarkBar();
            updateStarButton();
          }
          if (Array.isArray(data.history)) {
            history = data.history;
          }
        }
        if (data.type === "scram:torMode") {
          torEnabled = data.active;
          const toggle = document.getElementById("set-tor-enabled");
          if (toggle) toggle.checked = torEnabled;
        }
        if (data.type === "browser-audio-playing") {
          const tab = getActiveTab();
          if (tab) {
            tab.isPlayingAudio = data.playing;
            updateTabsUI();
          }
        }
      });

      function loadPrefs() {
        isIncognito = new URLSearchParams(window.location.search).get("incognito") === "true";
        isEmbedded = window.parent && window.parent !== window;

        if (!isIncognito && !isEmbedded) {
          try {
            bookmarks = JSON.parse(localStorage.getItem(STORAGE_KEYS.BOOKMARKS) || "[]");
            history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || "[]");
            downloads = JSON.parse(localStorage.getItem(STORAGE_KEYS.DOWNLOADS) || "[]");
            zoomLevel = parseFloat(localStorage.getItem(STORAGE_KEYS.ZOOM)) || 1.0;

            darkModeExclusions = JSON.parse(localStorage.getItem(STORAGE_KEYS.DARK_EXCLUSIONS) || "{}");

            homepageUrl = localStorage.getItem(STORAGE_KEYS.HOMEPAGE) || "NT.html";
            restoreTabs = localStorage.getItem(STORAGE_KEYS.RESTORE_TABS) === "true";
            bookmarkBarVisible = localStorage.getItem(STORAGE_KEYS.BOOKMARKBAR_VISIBLE) !== "false";
            confirmCloseTabs = localStorage.getItem(STORAGE_KEYS.CONFIRM_CLOSE_TABS) === "true";
            searchSuggestionsEnabled = localStorage.getItem(STORAGE_KEYS.SEARCH_SUGGESTIONS) !== "false";

          } catch (e) {

      function restoreTabState() {

            return true;

        } catch (e) {}
        return false;

          const wispUrl = localStorage.getItem("proxServer") || DEFAULT_WISP;

          e.stopPropagation();
          const dd = document.getElementById("browser-dropdown");
          dd.classList.toggle("open");
        };
        function closeBrowserDropdown() {
          document.getElementById("browser-dropdown").classList.remove("open");
        }
        document.querySelectorAll("#browser-dropdown .browser-dropdown-item").forEach((item) => {
          item.addEventListener("click", (ev) => {
            ev.stopPropagation();
            closeBrowserDropdown();
            const action = item.dataset.action;
            if (action === "new-tab") createTab(true);
            else if (action === "new-window") {
              if (isEmbedded) {
                sendToParent({ type: "browser-new-window", incognito: false });
              } else {
                window.open(window.location.origin + "/scram/index.html", "_blank");
              }
            } else if (action === "new-private-window") {
              if (isEmbedded) {
                sendToParent({ type: "browser-new-window", incognito: true });
              } else {
                window.open(window.location.origin + "/scram/index.html?incognito=true", "_blank");
              }
            } else if (action === "downloads") openDownloadsPanel();
            else if (action === "history") openHistoryPanel();
            else if (action === "bookmarks") openBookmarksPanel();
            else if (action === "toggle-bookmarkbar") toggleBookmarkBar();
            else if (action === "reopen-tab") reopenLastClosedTab();
            else if (action === "save-page") savePage();
            else if (action === "screenshot") takeScreenshot();
            else if (action === "devtools") toggleDevTools();
            else if (action === "clear-data") clearBrowsingData();
          });
        });
        document.addEventListener("click", (ev) => {
          const wrapper = document.querySelector(".main-menu-wrapper");
          if (wrapper && !wrapper.contains(ev.target))
            document.getElementById("browser-dropdown")?.classList.remove("open");
        });

        updateZoomLabel();
        updateMenuBadges();
        const bmCheck = document.getElementById("menu-bm-check");
        if (bmCheck) bmCheck.className = bookmarkBarVisible ? "fa-solid fa-check di-icon" : "fa-solid fa-minus di-icon";

        function toggleBookmarkBar() {
          bookmarkBarVisible = !bookmarkBarVisible;
          const check = document.getElementById("menu-bm-check");
          if (check) check.className = bookmarkBarVisible ? "fa-solid fa-check di-icon" : "fa-solid fa-minus di-icon";
          localStorage.setItem(STORAGE_KEYS.BOOKMARKBAR_VISIBLE, String(bookmarkBarVisible));
          renderBookmarkBar();
        }

        function clearBrowsingData() {
          if (!confirm("Clear history, downloads, and bookmarks?")) return;
          history = [];
          downloads = [];
          bookmarks = [];
          localStorage.removeItem(STORAGE_KEYS.HISTORY);
          localStorage.removeItem(STORAGE_KEYS.DOWNLOADS);
          localStorage.removeItem(STORAGE_KEYS.BOOKMARKS);
          renderBookmarkBar();
          updateMenuBadges();
        }

        updateAdblockButton();

        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener("message", function (e) {
            if (e.data && e.data.type === "adblock:ready") {
              adblockEngineReady = true;
              updateAdblockButton();
            }
            if (e.data && e.data.type === "adblock:stats") {
              adblockBlockedCount = e.data.blockedCount || 0;
              adblockPageCount = e.data.pageBlockedCount || 0;
              adblockTotalRequests = e.data.totalRequests || 0;
              adblockEngineReady = e.data.ready || adblockEngineReady;
              updateAdblockButton();
            }
            if (e.data && e.data.type === "adblock:log") {
              renderAdblockLogEntries(e.data.entries || []);
            }
          });
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: "adblock:init",
              enabled: adblockEnabled
            });
          }
        }

        const skipBtn = document.getElementById("skip-btn");
        if (skipBtn) {
          skipBtn.onclick = () => {
            const tab = getActiveTab();
            if (tab) {
              tab.loading = false;
              showIframeLoading(false);
            }
          };
        }

        const addrBar = document.getElementById("address-bar");
        addrBar.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            hideOmnibox();
            handleSubmit();
          } else if (e.key === "Escape") {
            hideOmnibox();
            addrBar.blur();
          } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            navigateOmnibox(e.key === "ArrowDown" ? 1 : -1);
          }
        });
        addrBar.addEventListener("input", () => {
          updateOmnibox(addrBar.value);
        });
        addrBar.addEventListener("focus", () => {
          addrBar.select();
          updateOmnibox(addrBar.value);
        });
        addrBar.addEventListener("blur", () => {
          setTimeout(hideOmnibox, 150);
        });

        window.addEventListener("message", (e) => {
          if (e.data?.type === "navigate") handleSubmit(e.data.url);
          if (e.data?.type === "hide-chrome") {
            document.querySelectorAll(".flex.tabs, .flex.nav, .loading-bar-container, .bookmark-bar, .message-container, #tooltip").forEach((el) => el.remove());
          }
          if (e.data?.type === "browser-audio-playing") {
            const tab = getActiveTab();
            if (tab) {
              tab.isPlayingAudio = e.data.playing;
              updateTabsUI();
            }
          }
        });

        if (restoreTabs && restoreTabState()) {
        } else {
          createTab(true);
        }
        checkHashParameters();
        renderBookmarkBar();
        setupTooltips();
      }

      function createTab(makeActive = true) {
        const frame = scramjet.createFrame();
        const requiredPerms = [
          "allow-scripts",
          "allow-same-origin",
          "allow-forms",
          "allow-popups",
          "allow-top-navigation-by-user-activation",
          "allow-modals",
          "allow-fullscreen"
        ];
        const existing = (frame.frame.getAttribute("sandbox") || "").split(/\s+/).filter(Boolean);
        const combined = [...new Set([...existing, ...requiredPerms])].join(" ");
        frame.frame.setAttribute("sandbox", combined);
        const tab = {
          id: nextTabId++,
          title: "Home",
          url: "yuki://home",
          frame: frame,
          loading: false,
          favicon: null,
          skipTimeout: null,
          isPlayingAudio: false,
          isPinned: false,
          isMuted: false
        };
        _newTabId = tab.id;

        if (isIncognito) frame.frame.src = "NT.html?incognito=true";
        else frame.frame.src = "NT.html";

        frame.addEventListener("urlchange", (e) => {
          if (!e.url.includes("NT.html")) {
            tab.url = e.url;
            tab.title = "Browsing";
          }
          tab.loading = true;

          if (tab.id === activeTabId) showIframeLoading(true, tab.url);

          if (tab.id === activeTabId && e.url && !e.url.includes("NT.html")) {
            adblockPageCount = 0;
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({ type: "adblock:pagechange" });
            }
          }

          try {
            const urlObj = new URL(e.url);
            tab.title = urlObj.hostname;
            tab.favicon = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
            addToHistory(e.url, tab.title);
          } catch {
            tab.title = "Browsing";
            tab.favicon = null;
          }

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 10);

          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          tab.skipTimeout = setTimeout(() => {
            if (tab.loading && tab.id === activeTabId) {
              const skipBtn = document.getElementById("skip-btn");
              if (skipBtn) skipBtn.classList.add("show");
            }
          }, 1000);
        });

        frame.frame.addEventListener("load", () => {
          tab.loading = false;
          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          if (tab.id === activeTabId) showIframeLoading(false);

          injectAudioDetector(frame.frame);

          if (autoplayBlock) injectAutoplayBlocker(frame.frame);

          if (darkModeEnabled) applyDarkModeToTab(tab);

          applyZoomToTab(tab);

          try {
            const title = frame.frame.contentWindow.document.title;
            if (title) tab.title = title;
          } catch {}

          try {
            if (frame.frame.contentWindow.location.href.includes("NT.html")) {
              tab.title = "Home";
              tab.url = "yuki://home";
              tab.favicon = null;
            }
          } catch {} // cross-origin iframe access blocked

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 100);
        });

        if (tabBehaviorNext && makeActive && activeTabId) {
          const activeIdx = tabs.findIndex((t) => t.id === activeTabId);
          if (activeIdx >= 0) tabs.splice(activeIdx + 1, 0, tab);
          else tabs.push(tab);
        } else {
          tabs.push(tab);
        }
        document.getElementById("iframe-container").appendChild(frame.frame);
        if (defaultZoom !== 1.0) applyZoomToTab(tab);
        if (makeActive) switchTab(tab.id);
        saveTabState();
        return tab;
      }

      function showIframeLoading(show, url = "") {
        const loader = document.getElementById("loading");
        const title = document.getElementById("loading-title");
        const urlText = document.getElementById("loading-url");
        const skipBtn = document.getElementById("skip-btn");

        if (loader) {
          loader.style.display = show ? "flex" : "none";
          const tab = getActiveTab();
          if (tab) tab.frame.frame.classList.toggle("loading", show);
          if (show) {
            title.textContent = "Connecting";
            urlText.textContent = url || "Loading content...";
            skipBtn.classList.remove("show");
          }
        }
      }

      function switchTab(tabId) {
        if (_yukiActive) closeYukiPage();
        activeTabId = tabId;
        const tab = getActiveTab();
        tabs.forEach((t) => t.frame.frame.classList.toggle("hidden", t.id !== tabId));
        if (tab) showIframeLoading(tab.loading, tab.url);
        updateTabsUI();
        updateAddressBar();
      }

      function closeTab(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        if (confirmCloseTabs && tabs.length > 1) {
          if (!confirm(`Close "${tabs[idx].title}"?`)) return;
        }
        const closed = tabs[idx];
        if (closed.url && closed.url !== "NT.html") {
          closedTabs.push({ url: closed.url, title: closed.title });
          if (closedTabs.length > 20) closedTabs.shift();
        }
        if (closed.skipTimeout) clearTimeout(closed.skipTimeout);

        const tabEl = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tabEl) {
          tabEl.classList.add("removing");
          setTimeout(() => {
            closed.frame.frame.remove();
            tabs.splice(idx, 1);
            if (activeTabId === tabId) {
              if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
              else createTab(true);
            } else {
              updateTabsUI();
            }
            saveTabState();
            updateMenuBadges();
          }, 200);
        } else {
          closed.frame.frame.remove();
          tabs.splice(idx, 1);
          if (activeTabId === tabId) {
            if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
            else createTab(true);
          } else {
            updateTabsUI();
          }
          saveTabState();
          updateMenuBadges();
        }
      }

      function updateTabsUI() {
        const container = document.getElementById("tab-strip");
        container.innerHTML = "";
        let dragSrcIdx = -1;

        tabs.forEach((tab, idx) => {
          const el = document.createElement("div");
          el.className = `tab ${tab.id === activeTabId ? "active" : ""}`;
          el.draggable = true;
          el.dataset.tooltip = tab.title;
          el.dataset.tabId = tab.id;

          let iconHtml = "";
          if (tab.isPinned) {
            iconHtml = tab.favicon ? `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">` : `<i class="fa-solid fa-thumbtack" style="font-size:12px;opacity:0.6;"></i>`;
          } else if (tab.loading) {
            iconHtml = `<div class="tab-spinner"></div>`;
          } else if (tab.favicon) {
            iconHtml = `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">`;
          }

          const audioIcon = tab.isPlayingAudio
            ? `<span class="tab-audio-icon" data-tab-id="${tab.id}" data-action="toggle-mute" style="font-size:10px;margin-left:4px;cursor:pointer;">${tab.isMuted ? "🔇" : "🔊"}</span>`
            : "";

          var innerHtml = tab.isPinned ? iconHtml : (
            iconHtml +
            '<span class="tab-title">' + tab.title + '</span>' +
            audioIcon +
            '<span class="tab-close">&times;</span>'
          );
          el.innerHTML = innerHtml;

          el.onclick = () => switchTab(tab.id);
          if (!tab.isPinned) {
            el.querySelector(".tab-close").onclick = (e) => {
              e.stopPropagation();
              if (!tab.isPinned) closeTab(tab.id);
            };
          }
          var ai = el.querySelector(".tab-audio-icon");
          if (ai) ai.addEventListener("click", function (e) {
            e.stopPropagation();
            toggleTabMute(tab);
          });
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            openTabContextMenu(tab, e);
          });

          el.addEventListener("dragstart", (e) => {
            dragSrcIdx = idx;
            e.dataTransfer.effectAllowed = "move";
            el.classList.add("dragging");
          });
          el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
          });
          el.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
            el.classList.add("drag-over");
          });
          el.addEventListener("dragleave", () => {
            el.classList.remove("drag-over");
          });
          el.addEventListener("drop", (e) => {
            e.preventDefault();
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
            if (dragSrcIdx === -1 || dragSrcIdx === idx) return;
            const [movedTab] = tabs.splice(dragSrcIdx, 1);
            tabs.splice(idx, 0, movedTab);
            if (activeTabId === movedTab.id) {
              updateTabsUI();
            } else {
              const containerEls = container.querySelectorAll(".tab");
              if (containerEls[dragSrcIdx]) containerEls[dragSrcIdx].classList.remove("dragging");
              updateTabsUI();
              switchTab(movedTab.id);
            }
            saveTabState();
            dragSrcIdx = -1;
          });

          el.addEventListener("mousedown", (e) => {
            if (e.button === 1) {
              e.preventDefault();
              e.stopPropagation();
              closeTab(tab.id);
            }
          });

          container.appendChild(el);
        });

        if (_newTabId !== null) {
          const newEl = container.querySelector(`.tab[data-tab-id="${_newTabId}"]`);
          if (newEl) {
            newEl.classList.add("tab-new");
            newEl.addEventListener("animationend", () => newEl.classList.remove("tab-new"), { once: true });
          }
          _newTabId = null;
        }

        const newBtn = document.createElement("button");
        newBtn.className = "new-tab";
        newBtn.dataset.tooltip = "Open a new blank tab";
        newBtn.innerHTML = "<i class='fa-solid fa-plus'></i>";
        newBtn.onclick = () => createTab(true);
        container.appendChild(newBtn);
      }

      function updateAddressBar() {
        const bar = document.getElementById("address-bar");
        const tab = getActiveTab();
        if (bar && tab) {
          var displayUrl = tab.url;
          if (displayUrl === "NT.html") displayUrl = "yuki://home";
          bar.value = displayUrl && displayUrl !== "NT.html" ? displayUrl : "";
        }
      }

      function getActiveTab() {
        return tabs.find((t) => t.id === activeTabId);
      }

      function resolveSearchEngine(key) {
        if (SEARCH_ENGINES[key]) return SEARCH_ENGINES[key];
        const custom = getCustomSearchEngines();
        const idx = key.startsWith("custom_") ? parseInt(key.slice(7)) : -1;
        if (idx >= 0 && custom[idx]) return custom[idx];
        return SEARCH_ENGINES.brave;
      }

      function handleSubmit(url) {
        closeInContentPanel();
        const tab = getActiveTab();
        let input = url || document.getElementById("address-bar").value.trim();
        if (!input) return;
        if (input.startsWith("yuki://")) {
          var page = input.replace("yuki://", "");
          navigateToYukiPage(page);
          return;
        }
        if (!input.startsWith("http")) {
          if (input.includes(".") && !input.includes(" ")) input = "https://" + input;
          else {
            let engine = resolveSearchEngine(searchEngineKey);
            let engineUrl = engine.url;
            if (searchRegion && engine.regionParam) {
              const sep = engineUrl.includes("?") ? "&" : "?";
              engineUrl += sep + engine.regionParam + "=" + encodeURIComponent(searchRegion);
            }
            input = engineUrl + encodeURIComponent(input);
          }
        }
        if (_yukiActive) closeYukiPage();
        if (torEnabled && isEmbedded) {
          sendToParent({ type: "scram:navigate", url: input });
          saveTabState();
          return;
        }

        if (/\.pdf($|\?)/i.test(input)) {
          tab.url = input;
          tab.title = "PDF Document";
          updateTabsUI();
          updateAddressBar();
          openPdfViewer(input);
          return;
        }

        tab.frame.go(input);
        saveTabState();
      }

      function updateLoadingBar(tab, percent) {
        if (tab.id !== activeTabId) return;
        const bar = document.getElementById("loading-bar");
        bar.style.width = percent + "%";
        bar.style.opacity = percent === 100 ? "0" : "1";
        if (percent === 100)
          setTimeout(() => {
            bar.style.width = "0%";
          }, 200);
      }

      function getCustomSearchEngines() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES) || "[]");
        } catch {
          return [];
        }
      }
      function saveCustomSearchEngines(arr) {
        localStorage.setItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES, JSON.stringify(arr));
      }
      function getAllSearchEngines() {
        return { ...SEARCH_ENGINES, ...Object.fromEntries(getCustomSearchEngines().map((e, i) => ["custom_" + i, e])) };
      }
      function renderCustomSearchEngines() {
        const list = document.getElementById("custom-engine-list");
        if (!list) return;
        const engines = getCustomSearchEngines();
        if (engines.length === 0) {
          list.innerHTML =
            '<div style="color:var(--text-dim);font-size:13px;">No custom search engines added yet.</div>';
          return;
        }
        list.innerHTML = engines
          .map(
            (e, i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);">${e.name}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this custom search engine" onclick="removeCustomSearchEngine(${i})" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCustomSearchEngine() {
        const name = prompt("Search engine name:");
        if (!name) return;
        let url = prompt(
          "Search URL (use {search} as placeholder for query, e.g. https://example.com/search?q={search}):"
        );
        if (!url) return;
        if (!url.includes("{search}")) {
          alert("URL must contain {search} placeholder.");
          return;
        }
        const engines = getCustomSearchEngines();
        engines.push({ name, url: url.replace("{search}", "") });
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function removeCustomSearchEngine(idx) {
        const engines = getCustomSearchEngines();
        engines.splice(idx, 1);
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function renderDarkExclusions() {
        const list = document.getElementById("dark-exclusion-list");
        if (!list) return;
        const hosts = Object.keys(darkModeExclusions);
        if (hosts.length === 0) {
          list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">No sites excluded from dark mode.</div>';
          return;
        }
        list.innerHTML = hosts
          .map(
            (h) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);"><i class="fa-solid fa-globe" style="width:14px;color:var(--text-muted);"></i> ${h}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this site from dark mode exclusions" onclick="removeDarkExclusion('${h}')" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCurrentToDarkExclusion() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html") {
          alert("No active page to exclude.");
          return;
        }
        try {
          const host = new URL(tab.url).hostname;
          darkModeExclusions[host] = true;
          savePrefs();
          renderDarkExclusions();
          applyDarkModeToTab(tab);
        } catch {
          alert("Invalid URL.");
        }
      }
      function removeDarkExclusion(host) {
        delete darkModeExclusions[host];
        savePrefs();
        renderDarkExclusions();
        const tab = getActiveTab();
        if (tab) applyDarkModeToTab(tab);
      }

      function toggleAdblock(enabled) {
        adblockEnabled = enabled !== undefined ? enabled : !adblockEnabled;
        localStorage.setItem(STORAGE_KEYS.ADBLOCK_ENABLED, String(adblockEnabled));
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: "adblock:toggle",
            enabled: adblockEnabled
          });
        }
        updateAdblockButton();
      }

      function formatBlockCount(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(3).replace(/\.?0+$/, "") + "M";
        if (n >= 1000) return n.toLocaleString();
        return String(n);
      }

      function requestAdblockStats() {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: "adblock:stats" });
        }
      }

      function requestAdblockLog() {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: "adblock:log" });
        }
      }

      function showAdblockPopup() {
        var existing = document.getElementById("adblock-popup");
        if (existing) { existing.remove(); return; }

        requestAdblockStats();

        var popup = document.createElement("div");
        popup.id = "adblock-popup";
        popup.className = "adblock-popup";
        popup.innerHTML =
          '<div class="adblock-popup-body">' +
            '<button class="adblock-power-btn" id="adblock-power-btn" style="width:120px;height:120px;font-size:54px;background:none;border:3px solid rgba(34,197,94,0.3);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--success);background:rgba(34,197,94,0.1);transition:all 0.2s;">' +
              '<i class="fa-solid fa-power-off"></i>' +
            '</button>' +
            '<div class="adblock-page-row">' +
              '<span class="adblock-page-label">Blocked on this page</span>' +
              '<span class="adblock-page-num" id="adblock-page-count">0</span>' +
            '</div>' +
            '<div class="adblock-total-row">' +
              '<span class="adblock-total-label">Blocked since install</span>' +
              '<span class="adblock-total-num" id="adblock-total-count">0</span>' +
              '<span class="adblock-total-pct" id="adblock-total-pct">(0%)</span>' +
            '</div>' +
            '<div class="adblock-popup-actions">' +
              '<button class="adblock-action-btn" id="adblock-open-log"><i class="fa-solid fa-list"></i> Log</button>' +
              '<button class="adblock-action-btn" id="adblock-open-settings"><i class="fa-solid fa-sliders"></i> Settings</button>' +
            '</div>' +
          '</div>' +
          '<div class="adblock-popup-footer">' +
            '<span class="adblock-footer-text">EasyList &amp; uAssets</span>' +
          '</div>';

        var btn = document.getElementById("adblock-btn");
        btn.parentNode.appendChild(popup);

        refreshPopupStats();

        var powerEl = popup.querySelector("#adblock-power-btn");
        powerEl.addEventListener("click", function () {
          toggleAdblock(!adblockEnabled);
          refreshPopupStats();
        });
        powerEl.addEventListener("mouseenter", function () {
          if (!adblockEnabled) {
            powerEl.style.background = "var(--surface-active)";
            powerEl.style.borderColor = "var(--text-muted)";
          } else {
            powerEl.style.background = "rgba(34,197,94,0.18)";
            powerEl.style.borderColor = "var(--success)";
            powerEl.style.transform = "scale(1.06)";
          }
        });
        powerEl.addEventListener("mouseleave", function () {
          powerEl.style.transform = "";
          if (!adblockEnabled) {
            powerEl.style.background = "var(--surface-hover)";
            powerEl.style.borderColor = "var(--border-light)";
          } else {
            powerEl.style.background = "rgba(34,197,94,0.1)";
            powerEl.style.borderColor = "rgba(34,197,94,0.3)";
          }
        });

        var logBtn = popup.querySelector("#adblock-open-log");
        if (logBtn) {
          logBtn.addEventListener("click", function () {
            popup.remove();
            navigateToYukiPage("blocking-log");
          });
        }

        popup.querySelector("#adblock-open-settings").addEventListener("click", function () {
          popup.remove();
          openSettings();
        });

        setTimeout(function () {
          popup.classList.add("open");
        }, 10);

        function closePopup(e) {
          if (!popup.contains(e.target) && e.target.id !== "adblock-btn") {
            popup.remove();
            document.removeEventListener("mousedown", closePopup);
          }
        }
        setTimeout(function () { document.addEventListener("mousedown", closePopup); }, 0);
      }

      function refreshPopupStats() {
        var powerBtn = document.getElementById("adblock-power-btn");
        if (powerBtn) {
          if (!adblockEnabled) {
            powerBtn.style.color = "var(--text-muted)";
            powerBtn.style.background = "var(--surface-hover)";
            powerBtn.style.borderColor = "var(--border-light)";
          } else {
            powerBtn.style.color = "var(--success)";
            powerBtn.style.background = "rgba(34,197,94,0.1)";
            powerBtn.style.borderColor = "rgba(34,197,94,0.3)";
          }
        }
        var pageNum = document.getElementById("adblock-page-count");
        if (pageNum) pageNum.textContent = formatBlockCount(adblockPageCount);
        var totalNum = document.getElementById("adblock-total-count");
        if (totalNum && adblockTotalRequests > 0) {
          totalNum.textContent = formatBlockCount(adblockBlockedCount);
        }
        var totalPct = document.getElementById("adblock-total-pct");
        if (totalPct && adblockTotalRequests > 0) {
          var pct = ((adblockBlockedCount / adblockTotalRequests) * 100);
          totalPct.textContent = "(" + pct.toFixed(1) + "%)";
        }
      }

      function updateAdblockButton() {
        var btn = document.getElementById("adblock-btn");
        if (!btn) return;
        if (adblockEnabled && adblockEngineReady) {
          btn.classList.add("active");
          btn.classList.remove("inactive");
          btn.setAttribute("data-tooltip", "Ad blocking is active . Blocked: " + adblockBlockedCount);
        } else if (!adblockEnabled) {
          btn.classList.remove("active");
          btn.classList.add("inactive");
          btn.setAttribute("data-tooltip", "Ad blocking is off");
        } else {
          btn.classList.remove("active");
          btn.classList.remove("inactive");
          btn.setAttribute("data-tooltip", "Ad blocking is loading...");
        }
        refreshPopupStats();
      }

      function renderAdblockLogEntries(entries) {
        var container = document.getElementById("adblock-log-entries");
        if (!container) return;

        var pageNum = document.getElementById("log-page-count");
        if (pageNum) pageNum.textContent = adblockPageCount;
        var totalNum = document.getElementById("log-total-count");
        if (totalNum) totalNum.textContent = formatBlockCount(adblockBlockedCount);
        var rateEl = document.getElementById("log-block-rate");
        if (rateEl && adblockTotalRequests > 0) {
          rateEl.textContent = ((adblockBlockedCount / adblockTotalRequests) * 100).toFixed(1) + "%";
        }

        if (!entries || entries.length === 0) {
          container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">No blocked requests yet.</div>';
          return;
        }

        var html = "";
        var len = entries.length;
        for (var i = len - 1; i >= 0; i--) {
          var entry = entries[i];
          var url = entry.url || "";
          var time = entry.time || 0;
          var displayUrl = url.length > 80 ? url.slice(0, 80) + "..." : url;
          var domain = "";
          try { domain = new URL(url).hostname; } catch (e) {}
          var timeStr = "";
          if (time) {
            var d = new Date(time);
            timeStr = d.toLocaleTimeString();
          }
          html +=
            '<div class="adblock-log-entry">' +
              '<div class="adblock-log-entry-domain">' + (domain || "unknown") + '</div>' +
              '<div class="adblock-log-entry-url" title="' + url.replace(/"/g, "&quot;") + '">' + displayUrl + '</div>' +
              '<div class="adblock-log-entry-time">' + timeStr + '</div>' +
            '</div>';
        }
        container.innerHTML = html;
      }

      var _yukiActive = false;

      function navigateToYukiPage(page, tabOverride) {
        var tab = tabOverride || getActiveTab();
        if (!tab) return;
        var url = "yuki://" + page;
        tab._prevUrl = tab.url;
        tab._prevTitle = tab.title;
        tab.url = url;
        tab.title = page.charAt(0).toUpperCase() + page.slice(1).replace(/-/g, " ");
        tab.loading = false;
        _yukiActive = true;
        tabs.forEach(function (t) { t.frame.frame.classList.add("hidden"); });
        var loadingEl = document.getElementById("loading");
        var errorEl = document.getElementById("error");
        if (loadingEl) loadingEl.style.display = "none";
        if (errorEl) errorEl.style.display = "none";
        var cont = document.getElementById("yuki-page-container");
        cont.style.display = "block";
        renderYukiPage(page);
        updateAddressBar();
        updateTabsUI();
        showIframeLoading(false);
        saveTabState();
      }

      function closeYukiPage() {
        _yukiActive = false;
        var cont = document.getElementById("yuki-page-container");
        if (cont) { cont.style.display = "none"; cont.innerHTML = ""; }
        var tab = getActiveTab();
        if (tab) {
          if (tab._prevUrl) {
            tab.url = tab._prevUrl;
            tab.title = tab._prevTitle || tab._prevUrl;
            delete tab._prevUrl;
            delete tab._prevTitle;
          }
          tab.frame.frame.classList.remove("hidden");
          tab.loading = false;
          showIframeLoading(false);
          updateAddressBar();
          updateTabsUI();
        }
      }

              '</div>' +
            '</div>';

      function initYukiSelect(root) {
        root.addEventListener("click", function (e) {
          var trigger = e.target.closest(".yuki-select-trigger");
          if (!trigger) return;
          var sel = trigger.closest(".yuki-select");
          if (!sel) return;
          e.stopPropagation();
          document.querySelectorAll(".yuki-select.open").forEach(function (s) { if (s !== sel) s.classList.remove("open"); });
          sel.classList.toggle("open");
        });
        root.addEventListener("click", function (e) {
          var opt = e.target.closest(".yuki-select-option");
          if (!opt) return;
          var sel = opt.closest(".yuki-select");
          if (!sel) return;
          var val = opt.dataset.value;
          sel.dataset.value = val;
          var label = sel.querySelector(".yuki-select-label");
          if (label) label.textContent = opt.textContent;
          sel.querySelectorAll(".yuki-select-option").forEach(function (o) { o.classList.toggle("selected", o.dataset.value === val); });
          sel.classList.remove("open");
          sel.dispatchEvent(new CustomEvent("change", { bubbles: true }));
        });
      }

      function renderYukiRange(id, min, max, value) {
        var pct = ((value - min) / (max - min)) * 100;
        return '<div class="yuki-range" id="' + id + '" data-min="' + min + '" data-max="' + max + '" data-value="' + value + '">' +
          '<div class="yuki-range-track">' +
            '<div class="yuki-range-fill" style="width:' + pct + '%"></div>' +
            '<div class="yuki-range-thumb" style="left:' + pct + '%"></div>' +
          '</div>' +
        '</div>';
      }

      function initYukiRange(id, onChange) {
        var el = document.getElementById(id);
        if (!el) return;
        var thumb = el.querySelector(".yuki-range-thumb");
        var track = el.querySelector(".yuki-range-track");
        var fill = el.querySelector(".yuki-range-fill");
        if (!thumb || !track) return;
        var dragging = false;
        function update(clientX) {
          var rect = track.getBoundingClientRect();
          var min = Number(el.dataset.min);
          var max = Number(el.dataset.max);
          var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          var val = Math.round(min + pct * (max - min));
          var newPct = ((val - min) / (max - min)) * 100;
          el.dataset.value = val;
          if (fill) fill.style.width = newPct + "%";
          thumb.style.left = newPct + "%";
          return val;
        }
        track.addEventListener("mousedown", function (e) {
          dragging = true;
          onChange(update(e.clientX));
        });
        document.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          update(e.clientX);
        });
        document.addEventListener("mouseup", function () {
          if (!dragging) return;
          dragging = false;
          onChange(Number(el.dataset.value));
        });
      }

      function renderYukiBookmarks() {

              '<span class="panel-item-icon">★</span>' +

          '<button class="settings-action-btn" onclick="exportBookmarksHtml()" data-tooltip="Export bookmarks as an HTML file">Export</button>' +
          '<button class="settings-action-btn" onclick="importBookmarksHtml()" data-tooltip="Import bookmarks from an HTML file">Import</button>' +
        '</div>' + items;

      function renderYukiHistory() {
        if (history.length === 0) return '<div class="yuki-page-empty">No history yet.</div>';
        var items = [].concat(history).reverse();
        var groups = {};
        items.forEach(function (h) {
          var d = new Date(h.time);
          var today = new Date();
          var isToday = d.toDateString() === today.toDateString();
          var yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
          var isYesterday = d.toDateString() === yesterday.toDateString();
          var key = isToday ? "Today" : isYesterday ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
          if (!groups[key]) groups[key] = [];
          groups[key].push(h);
        });
        var html = "";
        Object.keys(groups).forEach(function (date) {
          html += '<div class="history-date">' + date + '</div>';
          groups[date].forEach(function (h) {
            var d = new Date(h.time);
            var timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
            var domain = "";
            try { domain = new URL(h.url).hostname; } catch (e) { domain = h.url; }
            html += '<div class="history-entry" data-url="' + h.url.replace(/"/g, "&quot;") + '" data-tooltip="' + (h.title || h.url) + '">' +
              '<img class="he-favicon" src="https://www.google.com/s2/favicons?domain=' + domain + '&sz=32" onerror="this.style.display=\'none\'" />' +
              '<div class="he-body"><div class="he-title">' + (h.title || h.url) + '</div><div class="he-meta">' + domain + " • " + h.url + '</div></div>' +
              '<span class="he-time">' + timeStr + '</span>' +
            '</div>';
          });
        });
        return html;
      }

      function renderYukiDownloads() {
        if (downloads.length === 0) return '<div class="yuki-page-empty">No downloads yet.</div>';
        return [].concat(downloads).reverse().map(function (d) {
          return '<div class="panel-item" data-url="' + (d.url || "").replace(/"/g, "&quot;") + '">' +
            '<span class="panel-item-icon">' + (d.status === "done" ? "📄" : d.status === "failed" ? "⚠️" : "⬇") + '</span>' +
            '<div class="panel-item-content">' +
              '<div class="panel-item-title">' + (d.filename || "Unknown") + '</div>' +
              '<div class="panel-item-sub">' + (d.url || "") + '</div>' +
            '</div>' +
          '</div>';
        }).join("");
      }

      function renderYukiBlockingLog() {
        return '<div class="adblock-log-container" style="padding:0;">' +
          '<div class="adblock-log-stats">' +
            '<div class="adblock-log-stat"><span class="adblock-log-stat-num" id="log-page-count">' + adblockPageCount + '</span><span class="adblock-log-stat-label">this page</span></div>' +
            '<div class="adblock-log-stat"><span class="adblock-log-stat-num" id="log-total-count">' + formatBlockCount(adblockBlockedCount) + '</span><span class="adblock-log-stat-label">total blocked</span></div>' +
            '<div class="adblock-log-stat"><span class="adblock-log-stat-num" id="log-block-rate">' + (adblockTotalRequests > 0 ? ((adblockBlockedCount / adblockTotalRequests) * 100).toFixed(1) + "%" : "0%") + '</span><span class="adblock-log-stat-label">block rate</span></div>' +
          '</div>' +
          '<div class="adblock-log-entries" id="adblock-log-entries">' +
            '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">Loading blocked requests...</div>' +
          '</div>' +
