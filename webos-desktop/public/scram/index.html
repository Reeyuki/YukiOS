<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser</title>
    <link rel="icon" href="/s/dogfavi.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
      import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
      window.BareMux = BareMux;
    </script>
    <style>
      :root {
        --bg: #080808;
        --surface: #101010;
        --surface-hover: #161616;
        --surface-active: #1e1e1e;
        --surface-glass: rgba(16, 16, 16, 0.85);
        --border: #1c1c1c;
        --border-light: #272727;
        --border-glow: rgba(255, 255, 255, 0.06);

        --text: #ececec;
        --text-muted: #5a5a5a;
        --text-dim: #3a3a3a;

        --accent: #e8e8e8;
        --accent-dim: rgba(232, 232, 232, 0.7);
        --accent-glow: rgba(255, 255, 255, 0.08);

        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --info: #3b82f6;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.7);

        --radius-sm: 5px;
        --radius-md: 9px;
        --radius-lg: 13px;
        --radius-full: 9999px;

        --transition-fast: 0.1s ease;
        --transition-normal: 0.18s ease;
        --transition-slow: 0.3s ease;

        --font-sans: "Geist", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", monospace;

        --nav-height: 58px;
        --tabs-height: 48px;
        --chrome-height: calc(var(--nav-height) + var(--tabs-height) + 2px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }

      body,
      html,
      #app {
        font-family: var(--font-sans);
        width: 100vw;
        height: 100vh;
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .browser-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        padding: 10px 12px 0;
        gap: 4px;
        background: var(--bg);
        overflow: hidden;
        flex-shrink: 0;
        height: var(--tabs-height);
      }

      #tab-strip::-webkit-scrollbar {
        height: 6px;
      }
      #tab-strip::-webkit-scrollbar-track {
        background: transparent;
      }
      #tab-strip::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }
      #tab-strip::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        width: 200px;
        flex-shrink: 0;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        cursor: pointer;
        transition:
          background var(--transition-fast),
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
        position: relative;
      }

      .tab.tab-new {
        animation: tabPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tab.removing {
        animation: tabPopOut 0.2s ease forwards;
        pointer-events: none;
      }

      .tab:hover {
        background: var(--surface-hover);
      }

      .tab.active {
        background: var(--surface-hover);
        border-color: var(--border-light);
        box-shadow: inset 0 -3px 0 #3b82f6;
      }

      .tab.dragging {
        opacity: 0.5;
        border-style: dashed;
      }

      .tab.drag-over {
        border-left: 2px solid var(--brand, #888);
        margin-left: -1px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        flex-shrink: 0;
        opacity: 0.9;
      }

      .tab-title {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .tab-close {
        font-size: 15px;
        color: var(--text-muted);
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all var(--transition-fast);
        flex-shrink: 0;
        opacity: 0;
      }

      .tab:hover .tab-close {
        opacity: 1;
      }

      .tab-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        transform: scale(1.25) rotate(90deg);
      }

      .tab-close:active {
        transform: scale(0.85) rotate(90deg);
      }

      .new-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: 14px;
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .new-tab:hover {
        background: var(--surface);
        color: var(--text-muted);
        transform: rotate(90deg);
      }

      .new-tab:active {
        transform: rotate(90deg) scale(0.85);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        flex-shrink: 0;
      }

      .nav-btn-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 4px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-btn-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 14px;
      }

      .nav button:hover {
        background: var(--surface-hover);
        color: var(--text);
        transform: scale(1.06);
      }

      .nav button:active {
        animation: btnBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .address-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }

      .address-icon {
        position: absolute;
        left: 12px;
        color: var(--text-dim);
        font-size: 11px;
        pointer-events: none;
        z-index: 1;
      }

      input.bar {
        width: 100%;
        height: 42px;
        padding: 0 44px 0 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        color: var(--text);
        font-size: 13px;
        font-family: var(--font-sans);
        outline: none;
        transition: all var(--transition-normal);
        letter-spacing: -0.01em;
      }

      input.bar:focus {
        border-color: var(--border-light);
        background: var(--surface-hover);
        box-shadow: 0 0 0 3px var(--accent-glow);
        animation: pulseGlow 1.5s ease-in-out infinite;
      }

      input.bar::placeholder {
        color: var(--text-muted);
      }

      #star-btn {
        position: absolute;
        right: 42px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      #star-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      #home-btn-nav {
        position: absolute;
        right: 5px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: all var(--transition-fast);
      }

      #home-btn-nav:hover {
        color: var(--text);
        background: var(--surface-active);
      }

      .omnibox-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        max-height: 320px;
        overflow-y: auto;
        margin-top: 2px;
        animation: slideDownBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .omnibox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        cursor: pointer;
        transition:
          background 0.1s,
          transform 0.12s;
      }

      .omnibox-item:active {
        transform: scale(0.97);
      }

      .omnibox-item:hover,
      .omnibox-item.selected {
        background: var(--surface-hover);
      }

      .omnibox-item-icon {
        width: 18px;
        text-align: center;
        flex-shrink: 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .omnibox-item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .omnibox-item-url {
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        flex-shrink: 1;
        margin-left: auto;
      }

      .nav-action-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 3px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-action-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .main-menu-wrapper {
        position: relative;
        display: flex;
      }

      .main-menu-wrapper .browser-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        min-width: 220px;
        z-index: 1000;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        margin-top: 4px;
        overflow: hidden;
        animation: menuDropIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes menuDropIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }

      .main-menu-wrapper .browser-dropdown.open {
        display: block;
      }

      .main-menu-wrapper .browser-dropdown-section {
        padding: 6px 0;
        border-bottom: 1px solid var(--glass-border);
      }

      .main-menu-wrapper .browser-dropdown-section:last-child {
        border-bottom: none;
      }

      .main-menu-wrapper .browser-dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        font-size: 14px;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        white-space: nowrap;
      }

      .main-menu-wrapper .browser-dropdown-item:hover {
        background: var(--surface-hover);
      }

      .main-menu-wrapper .browser-dropdown-item:active {
        transform: scale(0.97);
      }

      .main-menu-wrapper .browser-dropdown-item .di-icon {
        font-size: 17px;
        width: 22px;
        text-align: center;
      }

      .main-menu-wrapper .browser-dropdown-item .di-label {
        flex: 1;
      }

      .main-menu-wrapper .browser-dropdown-item .di-badge {
        font-size: 10px;
        background: var(--brand);
        color: #fff;
        border-radius: 8px;
        padding: 1px 6px;
        min-width: 18px;
        text-align: center;
      }

      .loading-bar-container {
        height: 2px;
        background: transparent;
        flex-shrink: 0;
      }

      .loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, transparent, var(--text), transparent);
        background-size: 200% 100%;
        transition:
          width 0.25s ease,
          opacity 0.15s;
        animation: shimmer 1.2s linear infinite;
      }

      .iframe-container {
        flex: 1;
        position: relative;
        background: var(--bg);
        overflow: hidden;
      }

      .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        position: absolute;
        top: 0;
        left: 0;
      }

      .iframe-container iframe.hidden {
        display: none;
      }

      .iframe-container iframe.loading {
        filter: blur(12px) brightness(0.7);
        transition: filter 0.4s ease;
      }

      .message-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        color: var(--text);
        text-align: center;
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(8, 8, 8, 0.75);
        backdrop-filter: blur(20px) saturate(0.5);
        -webkit-backdrop-filter: blur(20px) saturate(0.5);
        z-index: 10;
        animation: fadeIn 0.25s ease;
      }

      .message-content {
        max-width: 360px;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
      }

      .message-content h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .message-content p {
        color: var(--text-muted);
        font-size: 12px;
        word-break: break-all;
        font-family: var(--font-mono);
        line-height: 1.6;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 20px;
      }

      #skip-btn {
        margin-top: 20px;
        padding: 7px 18px;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-full);
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font-sans);
        transition: all var(--transition-normal);
        display: none;
        letter-spacing: -0.01em;
      }

      #skip-btn.show {
        display: inline-block;
        animation: bounceIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #skip-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
        background: var(--surface-hover);
      }

      .tab-spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bounceIn {
        0% {
          transform: scale(0.92);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes tabPopIn {
        0% {
          transform: scale(0.95) translateX(-8px);
          opacity: 0;
        }
        100% {
          transform: scale(1) translateX(0);
          opacity: 1;
        }
      }

      @keyframes tabPopOut {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.85) translateX(16px);
          opacity: 0;
        }
      }

      @keyframes slideInRight {
        0% {
          transform: translateX(28px);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fadeSlideUp {
        0% {
          transform: translateY(12px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes ripple {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.15);
        }
        100% {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--accent-glow);
        }
        50% {
          box-shadow: 0 0 0 6px var(--accent-glow);
        }
      }

      @keyframes bookmarkDrop {
        0% {
          transform: translateY(-100%);
          opacity: 0;
          max-height: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
          max-height: 40px;
        }
      }

      @keyframes btnBounce {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.92);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes slideDownBounce {
        0% {
          transform: translateY(-8px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .wisp-settings-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.15s ease;
      }

      .wisp-settings-modal.hidden {
        display: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .settings-card {
        background: var(--surface);
        width: 420px;
        max-width: 90vw;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-xl);
        overflow: hidden;
        animation: bounceIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes slideUpOld {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .settings-header h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 9px;
        letter-spacing: -0.02em;
      }

      .settings-header h2 i {
        font-size: 12px;
        color: var(--text-muted);
      }

      .close-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 15px;
        cursor: pointer;
        padding: 5px;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
        display: flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      .section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        margin-bottom: 10px;
        font-weight: 600;
        font-family: var(--font-mono);
      }

      .server-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }

      .wisp-option {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);

          e.stopPropagation();
          const dd = document.getElementById("browser-dropdown");
          dd.classList.toggle("open");
        };
        function closeBrowserDropdown() {
          document.getElementById("browser-dropdown").classList.remove("open");
        }
        document.querySelectorAll("#browser-dropdown .browser-dropdown-item").forEach((item) => {
          item.addEventListener("click", (ev) => {
            ev.stopPropagation();
            closeBrowserDropdown();
            const action = item.dataset.action;
            if (action === "new-tab") createTab(true);
            else if (action === "new-window") {
              if (isEmbedded) {
                sendToParent({ type: "browser-new-window", incognito: false });
              } else {
                window.open(window.location.origin + "/scram/index.html", "_blank");
              }
            } else if (action === "new-private-window") {
              if (isEmbedded) {
                sendToParent({ type: "browser-new-window", incognito: true });
              } else {
                window.open(window.location.origin + "/scram/index.html?incognito=true", "_blank");
              }
            } else if (action === "downloads") openDownloadsPanel();
            else if (action === "history") openHistoryPanel();
            else if (action === "bookmarks") openBookmarksPanel();
            else if (action === "toggle-bookmarkbar") toggleBookmarkBar();
            else if (action === "reopen-tab") reopenLastClosedTab();
            else if (action === "save-page") savePage();
            else if (action === "screenshot") takeScreenshot();
            else if (action === "devtools") toggleDevTools();
            else if (action === "clear-data") clearBrowsingData();
          });
        });
        document.addEventListener("click", (ev) => {
          const wrapper = document.querySelector(".main-menu-wrapper");
          if (wrapper && !wrapper.contains(ev.target))
            document.getElementById("browser-dropdown")?.classList.remove("open");
        });

        updateZoomLabel();
        updateMenuBadges();
        const bmCheck = document.getElementById("menu-bm-check");
        if (bmCheck) bmCheck.className = bookmarkBarVisible ? "fa-solid fa-check di-icon" : "fa-solid fa-minus di-icon";

        function toggleBookmarkBar() {
          bookmarkBarVisible = !bookmarkBarVisible;
          const check = document.getElementById("menu-bm-check");
          if (check) check.className = bookmarkBarVisible ? "fa-solid fa-check di-icon" : "fa-solid fa-minus di-icon";
          localStorage.setItem(STORAGE_KEYS.BOOKMARKBAR_VISIBLE, String(bookmarkBarVisible));
          renderBookmarkBar();
        }

        function clearBrowsingData() {
          if (!confirm("Clear history, downloads, and bookmarks?")) return;
          history = [];
          downloads = [];
          bookmarks = [];
          localStorage.removeItem(STORAGE_KEYS.HISTORY);
          localStorage.removeItem(STORAGE_KEYS.DOWNLOADS);
          localStorage.removeItem(STORAGE_KEYS.BOOKMARKS);
          renderBookmarkBar();
          updateMenuBadges();
        }

        const skipBtn = document.getElementById("skip-btn");
        if (skipBtn) {
          skipBtn.onclick = () => {
            const tab = getActiveTab();
            if (tab) {
              tab.loading = false;
              showIframeLoading(false);
            }
          };
        }

        const addrBar = document.getElementById("address-bar");
        addrBar.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            hideOmnibox();
            handleSubmit();
          } else if (e.key === "Escape") {
            hideOmnibox();
            addrBar.blur();
          } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            navigateOmnibox(e.key === "ArrowDown" ? 1 : -1);
          }
        });
        addrBar.addEventListener("input", () => {
          updateOmnibox(addrBar.value);
        });
        addrBar.addEventListener("focus", () => {
          addrBar.select();
          updateOmnibox(addrBar.value);
        });
        addrBar.addEventListener("blur", () => {
          setTimeout(hideOmnibox, 150);
        });

        window.addEventListener("message", (e) => {
          if (e.data?.type === "navigate") handleSubmit(e.data.url);
          if (e.data?.type === "hide-chrome") {
            document.querySelectorAll(".flex.tabs, .flex.nav, .loading-bar-container").forEach((el) => el.remove());
          }
          if (e.data?.type === "browser-audio-playing") {
            const tab = getActiveTab();
            if (tab) {
              tab.isPlayingAudio = e.data.playing;
              updateTabsUI();
            }
          }
        });

        if (restoreTabs && restoreTabState()) {
        } else {
          createTab(true);
        }
        checkHashParameters();
        renderBookmarkBar();
        setupTooltips();
      }

      function createTab(makeActive = true) {
        const frame = scramjet.createFrame();
        const requiredPerms = [
          "allow-scripts",
          "allow-same-origin",
          "allow-forms",
          "allow-popups",
          "allow-top-navigation-by-user-activation",
          "allow-modals"
        ];
        const existing = (frame.frame.getAttribute("sandbox") || "").split(/\s+/).filter(Boolean);
        const combined = [...new Set([...existing, ...requiredPerms])].join(" ");
        frame.frame.setAttribute("sandbox", combined);
        const tab = {
          id: nextTabId++,
          title: "New Tab",
          url: "NT.html",
          frame: frame,
          loading: false,
          favicon: null,
          skipTimeout: null,
          isPlayingAudio: false
        };
        _newTabId = tab.id;

        if (isIncognito) frame.frame.src = "NT.html?incognito=true";
        else frame.frame.src = "NT.html";

        frame.addEventListener("urlchange", (e) => {
          tab.url = e.url;
          tab.loading = true;

          if (tab.id === activeTabId) showIframeLoading(true, tab.url);

          try {
            const urlObj = new URL(e.url);
            tab.title = urlObj.hostname;
            tab.favicon = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
            addToHistory(e.url, tab.title);
          } catch {
            tab.title = "Browsing";
            tab.favicon = null;
          }

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 10);

          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          tab.skipTimeout = setTimeout(() => {
            if (tab.loading && tab.id === activeTabId) {
              const skipBtn = document.getElementById("skip-btn");
              if (skipBtn) skipBtn.classList.add("show");
            }
          }, 1000);
        });

        frame.frame.addEventListener("load", () => {
          tab.loading = false;
          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          if (tab.id === activeTabId) showIframeLoading(false);

          injectAudioDetector(frame.frame);

          if (autoplayBlock) injectAutoplayBlocker(frame.frame);

          if (darkModeEnabled) applyDarkModeToTab(tab);

          applyZoomToTab(tab);

          try {
            const title = frame.frame.contentWindow.document.title;
            if (title) tab.title = title;
          } catch {}

          try {
            if (frame.frame.contentWindow.location.href.includes("NT.html")) {
              tab.title = "New Tab";
              tab.url = "";
              tab.favicon = null;
            }
          } catch {} // cross-origin iframe access blocked

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 100);
        });

        if (tabBehaviorNext && makeActive && activeTabId) {
          const activeIdx = tabs.findIndex((t) => t.id === activeTabId);
          if (activeIdx >= 0) tabs.splice(activeIdx + 1, 0, tab);
          else tabs.push(tab);
        } else {
          tabs.push(tab);
        }
        document.getElementById("iframe-container").appendChild(frame.frame);
        if (defaultZoom !== 1.0) applyZoomToTab(tab);
        if (makeActive) switchTab(tab.id);
        saveTabState();
        return tab;
      }

      function showIframeLoading(show, url = "") {
        const loader = document.getElementById("loading");
        const title = document.getElementById("loading-title");
        const urlText = document.getElementById("loading-url");
        const skipBtn = document.getElementById("skip-btn");

        if (loader) {
          loader.style.display = show ? "flex" : "none";
          const tab = getActiveTab();
          if (tab) tab.frame.frame.classList.toggle("loading", show);
          if (show) {
            title.textContent = "Connecting";
            urlText.textContent = url || "Loading content...";
            skipBtn.classList.remove("show");
          }
        }
      }

      function switchTab(tabId) {
        activeTabId = tabId;
        const tab = getActiveTab();
        tabs.forEach((t) => t.frame.frame.classList.toggle("hidden", t.id !== tabId));
        if (tab) showIframeLoading(tab.loading, tab.url);
        updateTabsUI();
        updateAddressBar();
      }

      function closeTab(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        if (confirmCloseTabs && tabs.length > 1) {
          if (!confirm(`Close "${tabs[idx].title}"?`)) return;
        }
        const closed = tabs[idx];
        if (closed.url && closed.url !== "NT.html") {
          closedTabs.push({ url: closed.url, title: closed.title });
          if (closedTabs.length > 20) closedTabs.shift();
        }
        if (closed.skipTimeout) clearTimeout(closed.skipTimeout);

        const tabEl = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tabEl) {
          tabEl.classList.add("removing");
          setTimeout(() => {
            closed.frame.frame.remove();
            tabs.splice(idx, 1);
            if (activeTabId === tabId) {
              if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
              else createTab(true);
            } else {
              updateTabsUI();
            }
            saveTabState();
            updateMenuBadges();
          }, 200);
        } else {
          closed.frame.frame.remove();
          tabs.splice(idx, 1);
          if (activeTabId === tabId) {
            if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
            else createTab(true);
          } else {
            updateTabsUI();
          }
          saveTabState();
          updateMenuBadges();
        }
      }

      function updateTabsUI() {
        const container = document.getElementById("tab-strip");
        container.innerHTML = "";
        let dragSrcIdx = -1;

        tabs.forEach((tab, idx) => {
          const el = document.createElement("div");
          el.className = `tab ${tab.id === activeTabId ? "active" : ""}`;
          el.draggable = true;
          el.dataset.tooltip = tab.title;
          el.dataset.tabId = tab.id;

          let iconHtml = "";
          if (tab.loading) {
            iconHtml = `<div class="tab-spinner"></div>`;
          } else if (tab.favicon) {
            iconHtml = `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">`;
          }

          const audioIcon = tab.isPlayingAudio
            ? `<span class="tab-audio-icon" style="font-size:10px;margin-left:4px;">🔊</span>`
            : "";

          el.innerHTML = `
            ${iconHtml}
            <span class="tab-title">${tab.title}</span>
            ${audioIcon}
            <span class="tab-close">&times;</span>
          `;

          el.onclick = () => switchTab(tab.id);
          el.querySelector(".tab-close").onclick = (e) => {
            e.stopPropagation();
            closeTab(tab.id);
          };
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            openTabContextMenu(tab, e);
          });

          el.addEventListener("dragstart", (e) => {
            dragSrcIdx = idx;
            e.dataTransfer.effectAllowed = "move";
            el.classList.add("dragging");
          });
          el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
          });
          el.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
            el.classList.add("drag-over");
          });
          el.addEventListener("dragleave", () => {
            el.classList.remove("drag-over");
          });
          el.addEventListener("drop", (e) => {
            e.preventDefault();
            container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
            if (dragSrcIdx === -1 || dragSrcIdx === idx) return;
            const [movedTab] = tabs.splice(dragSrcIdx, 1);
            tabs.splice(idx, 0, movedTab);
            if (activeTabId === movedTab.id) {
              updateTabsUI();
            } else {
              const containerEls = container.querySelectorAll(".tab");
              if (containerEls[dragSrcIdx]) containerEls[dragSrcIdx].classList.remove("dragging");
              updateTabsUI();
              switchTab(movedTab.id);
            }
            saveTabState();
            dragSrcIdx = -1;
          });

          el.addEventListener("mousedown", (e) => {
            if (e.button === 1) {
              e.preventDefault();
              e.stopPropagation();
              closeTab(tab.id);
            }
          });

          container.appendChild(el);
        });

        if (_newTabId !== null) {
          const newEl = container.querySelector(`.tab[data-tab-id="${_newTabId}"]`);
          if (newEl) {
            newEl.classList.add("tab-new");
            newEl.addEventListener("animationend", () => newEl.classList.remove("tab-new"), { once: true });
          }
          _newTabId = null;
        }

        const newBtn = document.createElement("button");
        newBtn.className = "new-tab";
        newBtn.dataset.tooltip = "Open a new blank tab";
        newBtn.innerHTML = "<i class='fa-solid fa-plus'></i>";
        newBtn.onclick = () => createTab(true);
        container.appendChild(newBtn);
      }

      function updateAddressBar() {
        const bar = document.getElementById("address-bar");
        const tab = getActiveTab();
        if (bar && tab) {
          bar.value = tab.url && !tab.url.includes("NT.html") ? tab.url : "";
        }
      }

      function getActiveTab() {
        return tabs.find((t) => t.id === activeTabId);
      }

      function resolveSearchEngine(key) {
        if (SEARCH_ENGINES[key]) return SEARCH_ENGINES[key];
        const custom = getCustomSearchEngines();
        const idx = key.startsWith("custom_") ? parseInt(key.slice(7)) : -1;
        if (idx >= 0 && custom[idx]) return custom[idx];
        return SEARCH_ENGINES.brave;
      }

      function handleSubmit(url) {
        closeInContentPanel();
        const tab = getActiveTab();
        let input = url || document.getElementById("address-bar").value.trim();
        if (!input) return;
        if (!input.startsWith("http")) {
          if (input.includes(".") && !input.includes(" ")) input = "https://" + input;
          else {
            let engine = resolveSearchEngine(searchEngineKey);
            let engineUrl = engine.url;
            if (searchRegion && engine.regionParam) {
              const sep = engineUrl.includes("?") ? "&" : "?";
              engineUrl += sep + engine.regionParam + "=" + encodeURIComponent(searchRegion);
            }
            input = engineUrl + encodeURIComponent(input);
          }
        }
        tab.frame.go(input);
        saveTabState();
      }

      function updateLoadingBar(tab, percent) {
        if (tab.id !== activeTabId) return;
        const bar = document.getElementById("loading-bar");
        bar.style.width = percent + "%";
        bar.style.opacity = percent === 100 ? "0" : "1";
        if (percent === 100)
          setTimeout(() => {
            bar.style.width = "0%";
          }, 200);
      }

      function getCustomSearchEngines() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES) || "[]");
        } catch {
          return [];
        }
      }
      function saveCustomSearchEngines(arr) {
        localStorage.setItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES, JSON.stringify(arr));
      }
      function getAllSearchEngines() {
        return { ...SEARCH_ENGINES, ...Object.fromEntries(getCustomSearchEngines().map((e, i) => ["custom_" + i, e])) };
      }
      function renderCustomSearchEngines() {
        const list = document.getElementById("custom-engine-list");
        if (!list) return;
        const engines = getCustomSearchEngines();
        if (engines.length === 0) {
          list.innerHTML =
            '<div style="color:var(--text-dim);font-size:13px;">No custom search engines added yet.</div>';
          return;
        }
        list.innerHTML = engines
          .map(
            (e, i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);">${e.name}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this custom search engine" onclick="removeCustomSearchEngine(${i})" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCustomSearchEngine() {
        const name = prompt("Search engine name:");
        if (!name) return;
        let url = prompt(
          "Search URL (use {search} as placeholder for query, e.g. https://example.com/search?q={search}):"
        );
        if (!url) return;
        if (!url.includes("{search}")) {
          alert("URL must contain {search} placeholder.");
          return;
        }
        const engines = getCustomSearchEngines();
        engines.push({ name, url: url.replace("{search}", "") });
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function removeCustomSearchEngine(idx) {
        const engines = getCustomSearchEngines();
        engines.splice(idx, 1);
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function renderDarkExclusions() {
        const list = document.getElementById("dark-exclusion-list");
        if (!list) return;
        const hosts = Object.keys(darkModeExclusions);
        if (hosts.length === 0) {
          list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">No sites excluded from dark mode.</div>';
          return;
        }
        list.innerHTML = hosts
          .map(
            (h) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);"><i class="fa-solid fa-globe" style="width:14px;color:var(--text-muted);"></i> ${h}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this site from dark mode exclusions" onclick="removeDarkExclusion('${h}')" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCurrentToDarkExclusion() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html") {
          alert("No active page to exclude.");
          return;
        }
        try {
          const host = new URL(tab.url).hostname;
          darkModeExclusions[host] = true;
          savePrefs();
          renderDarkExclusions();
          applyDarkModeToTab(tab);
        } catch {
          alert("Invalid URL.");
        }
      }
      function removeDarkExclusion(host) {
        delete darkModeExclusions[host];
        savePrefs();
        renderDarkExclusions();
        const tab = getActiveTab();
        if (tab) applyDarkModeToTab(tab);
      }

      function saveCustomWisp() {

        if (!url.startsWith("ws://") && !url.startsWith("wss://")) {
          alert("URL must start with wss:// or ws://");
          return;
        }

        const customWisps = getStoredWisps();
        if (customWisps.some((w) => w.url === url) || WISP_SERVERS.some((w) => w.url === url)) {
          alert("This server is already in the list.");
          return;
        }

        customWisps.push({ name: `Custom ${customWisps.length + 1}`, url });
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        input.value = "";

      window.deleteCustomWisp = function (urlToDelete) {
        if (!confirm("Remove this server?")) return;
        let customWisps = getStoredWisps().filter((w) => w.url !== urlToDelete);
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        if (localStorage.getItem("proxServer") === urlToDelete) setWisp(DEFAULT_WISP);
        else renderServerList();

      async function checkServerHealth(url, element) {
        const dot = element.querySelector(".status-indicator");
        const text = element.querySelector(".ping-text");
        const start = Date.now();

        try {
          const socket = new WebSocket(url);
          const timeout = setTimeout(() => {
            if (socket.readyState !== WebSocket.OPEN) {
              socket.close();
              markOffline();
            }
          }, 3000);

          socket.onopen = () => {
            clearTimeout(timeout);
            const latency = Date.now() - start;
            socket.close();
            dot.classList.add("status-success");
            text.textContent = `${latency}ms`;
          };

          socket.onerror = () => {
            clearTimeout(timeout);
            markOffline();
          };
        } catch {
          markOffline();
        }

        function markOffline() {
          dot.classList.add("status-error");
          text.textContent = "offline";
          const currentWisp = localStorage.getItem("proxServer") || DEFAULT_WISP;
          if (url === currentWisp && typeof Notify !== "undefined") {
            Notify.error("Connection Failed", "Current proxy server is offline. Try switching servers.");
          }
        }
      }

      function setWisp(url) {
        const oldUrl = localStorage.getItem("proxServer");
        localStorage.setItem("proxServer", url);

        if (typeof Notify !== "undefined" && oldUrl !== url) {
          const serverName = [...WISP_SERVERS, ...getStoredWisps()].find((s) => s.url === url)?.name || "Custom Server";
          Notify.success("Proxy Changed", `Switching to ${serverName}...`);
        }

        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: "config",
            wispurl: url
          });
        }

        setTimeout(() => location.reload(), 600);
      }

      function setupTooltips() {
        const tip = document.getElementById("tooltip");
        if (!tip) return;
        let tipTarget = null;
        let tipTimer = null;

        document.querySelectorAll("[title]").forEach(function (el) {
          if (!el.dataset.tooltip) el.dataset.tooltip = el.title;
          el.removeAttribute("title");
        });

        document.addEventListener(
          "mouseover",
          function (e) {
            const el = e.target.closest("[data-tooltip]");
            if (!el) {
              hide();
              return;
            }
            if (el === tipTarget) return;
            tipTarget = el;
            clearTimeout(tipTimer);
            tipTimer = setTimeout(function () {
              tip.textContent = el.dataset.tooltip;
              tip.classList.add("visible");
            }, 300);
          },
          true
        );

        document.addEventListener(
          "mouseout",
          function (e) {
            if (e.target.closest("[data-tooltip]")) hide();
          },
          true
        );

        document.addEventListener(
          "mousemove",
          function (e) {
            if (!tipTarget) return;
            var x = e.clientX + 14;
            var y = e.clientY + 14;
            var r = tip.getBoundingClientRect();
            if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
            if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
            tip.style.left = Math.max(4, x) + "px";
            tip.style.top = Math.max(4, y) + "px";
          },
          true
        );

        function hide() {
          tipTarget = null;
          clearTimeout(tipTimer);
          tip.classList.remove("visible");
        }
      }

      function applyZoomToTab(tab) {
        if (!tab || !tab.frame.frame) return;
        const transform = `scale(${zoomLevel})`;
        tab.frame.frame.style.transform = transform;
        tab.frame.frame.style.transformOrigin = "top left";
        const inverseScale = 1 / zoomLevel;
        tab.frame.frame.style.width = `${100 * inverseScale}%`;
        tab.frame.frame.style.height = `${100 * inverseScale}%`;

      function injectAutoplayBlocker(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const script = doc.createElement("script");
          script.textContent = `(function(){
            document.querySelectorAll('audio,video').forEach(function(m){
              if (!m.paused) m.pause();
              m.autoplay = false;
            });
            new MutationObserver(function(){
              document.querySelectorAll('audio,video').forEach(function(m){
                if (!m.paused) { m.pause(); m.autoplay = false; }
              });
            }).observe(document, {childList:true, subtree:true});
          })();`;
          (doc.head || doc.documentElement).appendChild(script);
        } catch (e) {}
      }

      function injectAudioDetector(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const script = doc.createElement("script");
          script.textContent = `(function(){
            function check() {
              var playing = Array.from(document.querySelectorAll('audio,video')).some(function(m){
                return !m.paused && !m.muted && m.volume > 0;
              });
              window.parent.postMessage({type:'browser-audio-playing',playing:playing},'*');
            }
            setInterval(check, 1500);
          })();`;
          (doc.head || doc.documentElement).appendChild(script);
        } catch (e) {}
      }

      function applyDarkModeToTab(tab) {
        if (!tab || !tab.frame.frame || !tab.frame.frame.contentDocument) return;

        let currentHost = "";

          if (styleEl) styleEl.remove();

        if (!styleEl) {

          styleEl.id = styleId;
          tab.frame.frame.contentDocument.head.appendChild(styleEl);

        styleEl.textContent = `

          ? `<input class="in-content-panel-search" id="icp-search" placeholder="Search ${type.toLowerCase()}..." spellcheck="false" data-tooltip="Filter items by keyword" />`

          : "";

        const doRender = (filter) => {
          bodyEl.innerHTML = bodyRenderer(filter);
          bodyEl.querySelectorAll("[data-url]").forEach((el) => {
            el.addEventListener("click", (e) => {
              if (e.target.dataset.remove !== undefined) return;

                handleSubmit(url);
                closeInContentPanel();

          bodyEl.querySelectorAll("[data-remove]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const idx = parseInt(btn.dataset.remove);
              if (type === "Bookmarks" && bookmarks[idx]) {
                bookmarks.splice(idx, 1);
                saveBookmarks();
                doRender(panel.querySelector("#icp-search")?.value || "");
              }
            });
          });
        };

        doRender("");

        if (options.searchable) {
          const searchInput = panel.querySelector("#icp-search");
          searchInput.addEventListener("input", () => doRender(searchInput.value));
        }

        if (options.clearable) {
          const clearBtn = panel.querySelector("#icp-clear");

                doRender("");

                doRender("");

      function openHistoryPanel() {
        openInContentPanel(
          "History",
          (filter) => {
            let items = [...history].reverse();
            if (filter) {
              const q = filter.toLowerCase();
              items = items.filter((h) => h.url.toLowerCase().includes(q) || (h.title || "").toLowerCase().includes(q));
            }
            if (items.length === 0)
              return `<div class="in-content-panel-empty">No history${filter ? " matching search" : ""}.</div>`;
            const groups = {};
            items.forEach((h) => {
              const d = new Date(h.time);
              const today = new Date();
              const isToday = d.toDateString() === today.toDateString();
              const yesterday = new Date(today);
              yesterday.setDate(yesterday.getDate() - 1);
              const isYesterday = d.toDateString() === yesterday.toDateString();
              let key;
              if (isToday) key = "Today";
              else if (isYesterday) key = "Yesterday";
              else key = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
              if (!groups[key]) groups[key] = [];
              groups[key].push(h);
            });
            let html = "";
            Object.entries(groups).forEach(([date, entries]) => {
              html += `<div class="history-date">${date}</div>`;
              entries.forEach((h) => {
                const d = new Date(h.time);
                const timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
                let domain = "";
                try {
                  domain = new URL(h.url).hostname;
                } catch (e) {
                  domain = h.url;
                }
                html += `
                <div class="history-entry" data-url="${h.url.replace(/"/g, "&quot;")}" data-tooltip="${h.title || h.url}">
                  <img class="he-favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" onerror="this.style.display='none'" />
                  <div class="he-body">
                    <div class="he-title">${h.title || h.url}</div>
                    <div class="he-meta"><span class="he-domain">${domain}</span> • ${h.url}</div>
                  </div>
                  <span class="he-time">${timeStr}</span>
                </div>
              `;
              });
            });
            return html;
          },
          { searchable: true, clearable: true, icon: "fa-clock-rotate-left" }
        );
      }

      function openDownloadsPanel() {
        openInContentPanel(
          "Downloads",
          (filter) => {
            if (downloads.length === 0) return `<div class="in-content-panel-empty">No downloads yet</div>`;
            let items = [...downloads].reverse();
            if (filter) {
              const q = filter.toLowerCase();
              items = items.filter(
                (d) => (d.filename || "").toLowerCase().includes(q) || (d.url || "").toLowerCase().includes(q)
              );
            }
            return items
              .map(
                (d) => `
            <div class="panel-item" data-url="${d.url}" data-tooltip="${d.filename || d.url}">
              <span class="panel-item-icon">${d.status === "done" ? "📄" : d.status === "failed" ? "⚠️" : "⬇"}</span>
              <div class="panel-item-content">
                <div class="panel-item-title">${d.filename || "Unknown"}</div>
                <div class="panel-item-sub">${d.url || ""}</div>
              </div>
              <span class="panel-item-action" title="Open URL" data-url="${d.url}">↗</span>
            </div>
          `
              )
              .join("");
          },
          { searchable: true, icon: "fa-download" }
        );
      }

      function closePanel() {
        const panel = document.querySelector(".browser-panel");
        if (panel) panel.remove();
        closeInContentPanel();
      }

      function setupKeyboardShortcuts() {
        const listener = (e) => {
          const activeElement = document.activeElement;
          const inInput =
            activeElement &&
            (activeElement.tagName === "INPUT" ||
              activeElement.tagName === "TEXTAREA" ||
              activeElement.isContentEditable);
          if (inInput) return;

          if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && /^[1-9]$/.test(e.key)) {
            e.preventDefault();
            const index = parseInt(e.key, 10) - 1;
            const tab = tabs[index];
            if (tab) switchTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.key === "l") {
            e.preventDefault();
            document.getElementById("address-bar").focus();
            document.getElementById("address-bar").select();
            return;
          }

          if (e.ctrlKey && e.key === "t") {
            e.preventDefault();
            createTab(true);
            return;
          }

          if (e.ctrlKey && e.key === "w") {
            e.preventDefault();
            const tab = getActiveTab();
            if (tab) closeTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.shiftKey && e.key === "T") {
            e.preventDefault();
            reopenLastClosedTab();
            return;
          }
        };

        document.addEventListener("keydown", listener);
      }

      let omniboxDropdown = null;
      let omniboxSelectedIndex = -1;

      function updateOmnibox(query) {
        if (!searchSuggestionsEnabled) {
          hideOmnibox();
          return;
        }
        if (!query || query.length < 1) {
          hideOmnibox();
          return;
        }
        const q = query.toLowerCase();
        const results = [];
        const seen = new Set();
        const addResult = (icon, title, url) => {
          if (seen.has(url) || results.length >= 8) return;
          seen.add(url);
          results.push({ icon, title, url });
        };
        [...history].reverse().forEach((h) => {
          if (h.url.toLowerCase().includes(q) || (h.title || "").toLowerCase().includes(q))
            addResult('<i class="fa-solid fa-clock"></i>', h.title || h.url, h.url);
        });
        bookmarks.forEach((b) => {
          if (b.url.toLowerCase().includes(q) || b.name.toLowerCase().includes(q))
            addResult('<i class="fa-solid fa-star"></i>', b.name, b.url);
        });
        if (results.length === 0) {
          hideOmnibox();
          return;
        }

        const wrap = document.querySelector(".address-wrapper");
        let dropdown = wrap.querySelector(".omnibox-dropdown");
        if (!dropdown) {
          dropdown = document.createElement("div");
          dropdown.className = "omnibox-dropdown";
          wrap.appendChild(dropdown);
          wrap.style.position = "relative";
        }
        omniboxDropdown = dropdown;
        omniboxSelectedIndex = -1;

        dropdown.innerHTML = results
          .map(
            (r, i) =>
              `<div class="omnibox-item" data-url="${r.url}" data-idx="${i}" data-tooltip="${r.url}">
            <span class="omnibox-item-icon">${r.icon}</span>
            <span class="omnibox-item-title">${r.title}</span>
            <span class="omnibox-item-url">${r.url}</span>
          </div>`
          )
          .join("");

        dropdown.querySelectorAll(".omnibox-item").forEach((item) => {
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const url = item.dataset.url;
            hideOmnibox();
            handleSubmit(url);
          });
        });
      }

      function navigateOmnibox(delta) {
        if (!omniboxDropdown) return;
        const items = omniboxDropdown.querySelectorAll(".omnibox-item");
        if (!items.length) return;
        omniboxSelectedIndex = (omniboxSelectedIndex + delta + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("selected", i === omniboxSelectedIndex));
        const selected = items[omniboxSelectedIndex];
        if (selected) document.getElementById("address-bar").value = selected.dataset.url;
      }

      function hideOmnibox() {
        if (omniboxDropdown) {
          omniboxDropdown.remove();
          omniboxDropdown = null;
        }
        omniboxSelectedIndex = -1;
      }

      function reopenLastClosedTab() {
        if (closedTabs.length === 0) return;
        const closed = closedTabs.pop();
        createTab(true);
        const tab = getActiveTab();
        if (tab) handleSubmit(closed.url);
        updateMenuBadges();
      }

      function closeOtherTabs(tabId) {
        const toClose = tabs.filter((t) => t.id !== tabId);
        toClose.forEach((t) => closeTab(t.id));
      }

      function closeTabsToRight(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1 || idx === tabs.length - 1) return;
        const toClose = tabs.slice(idx + 1);
        toClose.forEach((t) => closeTab(t.id));
      }

      function closeTabsToLeft(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx <= 0) return;
        const toClose = tabs.slice(0, idx);
        toClose.forEach((t) => closeTab(t.id));
      }

      function takeScreenshot() {
        const panel = document.getElementById("in-content-panel");
        if (panel) {
          html2canvas(panel, { backgroundColor: null }).then((canvas) => {
            canvas.toBlob((blob) => {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = (_currentPanelType || "panel") + ".png";
              a.click();
              URL.revokeObjectURL(a.href);
            });
          });
          return;
        }
        const tab = getActiveTab();
        if (!tab || !tab.frame || !tab.frame.frame) return;
        const iframe = tab.frame.frame;
        html2canvas(iframe, { useCORS: true, allowTaint: true, backgroundColor: null }).then((canvas) => {
          canvas.toBlob((blob) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = (tab.title || "screenshot").replace(/[^a-z0-9]/gi, "_") + ".png";
            a.click();
            URL.revokeObjectURL(a.href);
          });
        });
      }

      function openTabContextMenu(tab, e) {
        e.preventDefault();
        closePanel();
        const menu = document.createElement("div");
        menu.className = "ctx-menu";
        menu.style.cssText =
          "position:fixed;top:" +
          e.clientY +
          "px;left:" +
          e.clientX +
          "px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 0;min-width:180px;z-index:10000;box-shadow:var(--shadow-lg);";

        const tabIdx = tabs.findIndex((t) => t.id === tab.id);
        const hasOther = tabs.length > 1;
        const hasLeft = tabIdx > 0;
        const hasRight = tabIdx < tabs.length - 1;

        menu.innerHTML = `
          <div class="ctx-menu-item" data-action="new-tab" data-tooltip="Open a new blank tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-plus" style="width:16px;opacity:0.6;"></i> New Tab</div>
          <div class="ctx-menu-item" data-action="reload" data-tooltip="Reload the current tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-sync-alt" style="width:16px;opacity:0.6;"></i> Reload</div>
          <div class="ctx-menu-item" data-action="duplicate" data-tooltip="Create a copy of this tab with the same page" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-copy" style="width:16px;opacity:0.6;"></i> Duplicate Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          ${hasOther ? `<div class="ctx-menu-item" data-action="close-other" data-tooltip="Close all tabs except this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-times" style="width:16px;opacity:0.6;"></i> Close Other Tabs</div>` : ""}
          ${hasLeft ? `<div class="ctx-menu-item" data-action="close-left" data-tooltip="Close all tabs to the left of this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-arrow-left" style="width:16px;opacity:0.6;"></i> Close Tabs to Left</div>` : ""}
          ${hasRight ? `<div class="ctx-menu-item" data-action="close-right" data-tooltip="Close all tabs to the right of this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-arrow-right" style="width:16px;opacity:0.6;"></i> Close Tabs to Right</div>` : ""}
          <div class="ctx-menu-item" data-action="close-tab" data-tooltip="Close this tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-times-circle" style="width:16px;opacity:0.6;"></i> Close Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          <div class="ctx-menu-item" data-action="reopen-closed" data-tooltip="Reopen the most recently closed tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-undo" style="width:16px;opacity:0.6;"></i> Reopen Closed Tab${closedTabs.length ? ` (${closedTabs.length})` : ""}</div>
        `;

        menu.querySelectorAll(".ctx-menu-item").forEach((item) => {
          item.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const action = item.dataset.action;
            if (action === "new-tab") createTab(true);
            else if (action === "reload") tab.frame.reload();
            else if (action === "duplicate") {
              createTab(true);
              const newTab = getActiveTab();
              if (newTab && tab.url) handleSubmit(tab.url);
            } else if (action === "close-tab") closeTab(tab.id);
            else if (action === "close-other") closeOtherTabs(tab.id);
            else if (action === "close-left") closeTabsToLeft(tab.id);
            else if (action === "close-right") closeTabsToRight(tab.id);
            else if (action === "reopen-closed") reopenLastClosedTab();
            closePanel();
          });
          item.addEventListener("mouseenter", () => (item.style.background = "var(--surface-hover)"));
          item.addEventListener("mouseleave", () => (item.style.background = ""));
        });

        document.body.appendChild(menu);

        const close = (ev) => {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener("click", close);
          }
        };
        setTimeout(() => document.addEventListener("click", close), 0);
      }

      const originalCloseTab = closeTab;
      closeTab = function (tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        const tab = tabs[idx];
        closedTabs.push({ url: tab.url, title: tab.title });
        if (closedTabs.length > 20) closedTabs.shift();
        originalCloseTab(tabId);
      };

      setupKeyboardShortcuts();

      function toggleBookmark() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html" || tab.url === "") return;

        const existingIndex = bookmarks.findIndex((b) => b.url === tab.url);
        if (existingIndex !== -1) {
          bookmarks.splice(existingIndex, 1);
        } else {
          bookmarks.push({ name: tab.title || tab.url, url: tab.url });
        }
        saveBookmarks();
        updateStarButton();
      }

      function updateStarButton() {
        const starBtn = document.getElementById("star-btn");
        if (!starBtn) return;
        const tab = getActiveTab();
        if (!tab || !tab.url) {
          starBtn.style.color = "var(--text-muted)";
          return;
        }
        const isBookmarked = bookmarks.some((b) => b.url === tab.url);
        starBtn.style.color = isBookmarked ? "var(--accent)" : "var(--text-muted)";
      }

      const originalSwitchTab = switchTab;
      switchTab = function (tabId) {
        closeInContentPanel();
        originalSwitchTab(tabId);
        updateStarButton();
      };
    </script>
    <link rel="canonical" href="https://tickles.store/reactive" />
  </head>

  <body>
    <script>
      (function () {
        window.CLOAKS = {
          google: { title: "Google", icon: "/s/assets/google.ico" },
          classroom: {
            title: "Google Classroom",
            icon: "/s/assets/classroom.ico"
          },
          drive: {
            title: "My Drive - Google Drive",
            icon: "/s/assets/drive.png"
          },
          gmail: { title: "Gmail", icon: "/s/assets/gmail.ico" },
          ixl: { title: "IXL | Dashboard", icon: "/s/assets/ixl.png" },
          meet: { title: "Google Meet", icon: "/s/assets/meet.png" },
          docs: { title: "Document - Google Docs", icon: "/s/assets/docs.ico" },
          sheets: {
            title: "Spreadsheet - Google Sheets",
            icon: "/s/assets/sheets.ico"
          },
          slides: {
            title: "Presentation - Google Slides",
            icon: "/s/assets/slides.ico"
          }
        };

        window.DEFAULT_CLOAK = {
          title: "Markos's Classroom",
          icon: "/s/dogfavi.png"
        };

        function applyTabCloak() {
          try {
            var saved = localStorage.getItem("tabCloak");
            if (!saved) return;
            var data = JSON.parse(saved);
            if (!data || !data.title || !data.icon) return;
            document.title = data.title;
            var favicon = document.querySelector("link[rel='icon']");
            if (!favicon) {
              favicon = document.createElement("link");
              favicon.rel = "icon";
              document.head.appendChild(favicon);
            }
            favicon.href = data.icon;
          } catch (e) {}
        }

        applyTabCloak();

        window.applyCloakSelection = function (key) {
          var preset = window.CLOAKS[key] || window.DEFAULT_CLOAK;
          document.title = preset.title;
          var favicon = document.querySelector("link[rel='icon']");
          if (!favicon) {
            favicon = document.createElement("link");
            favicon.rel = "icon";
            document.head.appendChild(favicon);
          }
          favicon.href = preset.icon;
          localStorage.setItem(
            "tabCloak",
            JSON.stringify({
              key: key,
              title: preset.title,
              icon: preset.icon
            })
          );
          var status = document.getElementById("cloakStatus");
          if (status) status.textContent = "Current: " + preset.title;
        };
      })();
    </script>

    <div id="app"></div>
  </body>
</html>
