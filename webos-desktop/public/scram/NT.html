<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        /* Core colors */
        --bg: #0a0a0a;
        --surface: #0f0f0f;
        --surface-hover: #1a1a1a;
        --surface-active: #252525;
        --border: #1f1f1f;
        --border-light: #2a2a2a;

        /* Text */
        --text: #e4e4e7;
        --text-muted: #71717a;
        --text-dim: #52525b;

        /* Accent */
        --accent: #ffffff;
        --accent-dim: rgba(255, 255, 255, 0.8);
        --accent-glow: rgba(255, 255, 255, 0.1);

        /* Status colors */
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --info: #3b82f6;

        /* Shadows */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);

        /* Spacing */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-2xl: 48px;

        /* Border radius */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* Transitions */
        --transition-fast: 0.1s ease;
        --transition-normal: 0.2s ease;
        --transition-slow: 0.3s ease;

        /* Typography */
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;

        /* Background */
        --bg-image: none;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .clock {
        font-size: 4rem;
        font-weight: 600;
        letter-spacing: -2px;
        margin-bottom: 8px;
        color: var(--accent);
      }

      .date {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        width: 100%;
        max-width: 500px;
        margin-bottom: 40px;
      }

      .search-box i {
        color: var(--text-muted);
        font-size: 14px;
      }

      .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }

      .search-box input::placeholder {
        color: var(--text-dim);
      }

      .search-box select {
        background: var(--surface-hover);
        border: none;
        border-radius: 6px;
        color: var(--text-muted);
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        outline: none;
      }

      .shortcuts {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
        max-width: 500px;
        width: 100%;
      }

      .shortcut {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        cursor: pointer;
      }

      .shortcut-icon {
        width: 52px;
        height: 52px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }

      .shortcut:hover .shortcut-icon {
        background: var(--surface-hover);
        transform: translateY(-2px);
      }

      .shortcut-icon img {
        width: 22px;
        height: 22px;
        filter: brightness(0) invert(0.7);
      }

      .shortcut-icon i {
        font-size: 20px;
        color: var(--text-muted);
      }

      .shortcut-close {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--surface-active, #252525);
        border: 1px solid var(--border, #1f1f1f);
        color: var(--text-muted, #71717a);
        font-size: 10px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        line-height: 1;
        transition:
          background 0.1s,
          color 0.1s;
      }
      .shortcut-close:hover {
        background: #ef4444;
        color: #fff;
        border-color: #ef4444;
      }
      .shortcut:hover .shortcut-close {
        display: flex;
      }
      .shortcut {
        position: relative;
      }

      .shortcut-label {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        max-width: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .shortcut:hover .shortcut-label {
        color: var(--text);
      }

      .quote {
        position: fixed;
        bottom: 24px;
        font-size: 13px;
        color: var(--text-dim);
        max-width: 400px;
        text-align: center;
      }

      .loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .loader.show {
        display: flex;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .incognito-badge {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
        padding: 8px 18px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }

      .nt-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .nt-modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .nt-modal {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 24px;
        min-width: 320px;
        max-width: 420px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      }
      .nt-modal-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #e4e4e7;
      }
      .nt-modal-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #0f0f0f;
        color: #e4e4e7;
        font-size: 13px;
        outline: none;
        margin-bottom: 16px;
        box-sizing: border-box;
      }
      .nt-modal-input:focus {
        border-color: #666;
      }
      .nt-modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .nt-modal-btn {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
        transition: opacity 0.1s;
      }
      .nt-modal-btn:hover {
        opacity: 0.8;
      }
      .nt-modal-btn-primary {
        background: #e4e4e7;
        color: #0a0a0a;
      }
      .nt-modal-btn-secondary {
        background: #2a2a2a;
        color: #a1a1aa;
      }
      .nt-modal-message {
        font-size: 13px;
        color: #a1a1aa;
        margin-bottom: 16px;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <div class="loader" id="loader">
      <div class="spinner"></div>
    </div>

    <div class="incognito-badge" id="incognito-badge" style="display: none">
      <i class="fa-solid fa-user-secret"></i>
      <span>You're browsing privately</span>
    </div>

    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>

    <form class="search-box" id="searchForm">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off" />
      <select id="engine">
        <option value="https://search.brave.com/search?q=">Brave</option>
        <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
        <option value="https://www.google.com/search?q=">Google</option>
      </select>
    </form>

    <div class="shortcuts" id="shortcuts">
      <a class="shortcut preset-shortcut" data-url="https://youtube.com">
        <span class="shortcut-close" data-url="https://youtube.com">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" />
        </div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://github.com">
        <span class="shortcut-close" data-url="https://github.com">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" />
        </div>
        <span class="shortcut-label">GitHub</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://discord.com">
        <span class="shortcut-close" data-url="https://discord.com">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" />
        </div>
        <span class="shortcut-label">Discord</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://twitter.com">
        <span class="shortcut-close" data-url="https://twitter.com">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" />
        </div>
        <span class="shortcut-label">Twitter</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://play.geforcenow.com/mall/">
        <span class="shortcut-close" data-url="https://play.geforcenow.com/mall/">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/nvidia.svg" />
        </div>
        <span class="shortcut-label">Geforce Now</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://www.xbox.com/en-us/play">
        <span class="shortcut-close" data-url="https://www.xbox.com/en-us/play">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn-icons-png.flaticon.com/512/250/250562.png" />
        </div>
        <span class="shortcut-label">Xbox</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://netflix.com">
        <span class="shortcut-close" data-url="https://netflix.com">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netflix.svg" />
        </div>
        <span class="shortcut-label">Netflix</span>
      </a>
      <a class="shortcut preset-shortcut" data-url="https://twitch.tv">
        <span class="shortcut-close" data-url="https://twitch.tv">&times;</span>
        <div class="shortcut-icon">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg" />
        </div>
        <span class="shortcut-label">Twitch</span>
      </a>
      <div class="shortcut" id="addShortcut">
        <div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div>
        <span class="shortcut-label">Add</span>
      </div>
    </div>

    <div class="bookmarks-section" id="bookmarks-section" style="margin-top: 32px">
      <h3
        style="
          color: var(--text-muted);
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 0.07em;
          margin-bottom: 16px;
        "
      >
        Bookmarks
      </h3>
      <div
        class="shortcuts"
        id="bookmarks-container"
        style="grid-template-columns: repeat(auto-fill, minmax(100px, 1fr))"
      ></div>
    </div>

    <div class="quote" id="quote"></div>

    <div class="nt-modal-overlay" id="ntModal">
      <div class="nt-modal">
        <div class="nt-modal-title" id="ntModalTitle"></div>
        <div class="nt-modal-message" id="ntModalMessage"></div>
        <input class="nt-modal-input" id="ntModalInput" style="display: none" />
        <div class="nt-modal-actions">
          <button class="nt-modal-btn nt-modal-btn-secondary" id="ntModalCancel">Cancel</button>
          <button class="nt-modal-btn nt-modal-btn-primary" id="ntModalOk">OK</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);

      // Incognito detection
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("incognito") === "true") {
        document.getElementById("incognito-badge").style.display = "flex";
        document.title = "New Tab (Private)";
      }

      const nav = (url) => {
        $("#loader").classList.add("show");
        window.parent?.postMessage({ type: "navigate", url }, "*");
      };

      // DOM-based dialogs (sandbox-safe)
      function ntDialog(type, title, defaultValue) {
        return new Promise((resolve) => {
          const overlay = document.getElementById("ntModal");
          const titleEl = document.getElementById("ntModalTitle");
          const msgEl = document.getElementById("ntModalMessage");
          const inputEl = document.getElementById("ntModalInput");
          const okBtn = document.getElementById("ntModalOk");
          const cancelBtn = document.getElementById("ntModalCancel");

          titleEl.textContent = title;
          if (type === "prompt") {
            msgEl.style.display = "none";
            inputEl.style.display = "";
            inputEl.value = defaultValue || "";
            inputEl.focus();
            inputEl.onkeydown = (e) => {
              if (e.key === "Enter") okBtn.click();
            };
          } else if (type === "confirm") {
            msgEl.style.display = "";
            msgEl.textContent = defaultValue || "";
            inputEl.style.display = "none";
          } else {
            msgEl.style.display = "";
            msgEl.textContent = defaultValue || "";
            inputEl.style.display = "none";
            cancelBtn.style.display = "none";
          }

          const cleanup = () => {
            overlay.classList.remove("open");
            okBtn.onclick = null;
            cancelBtn.onclick = null;
            cancelBtn.style.display = "";
          };

          okBtn.onclick = () => {
            cleanup();
            resolve(type === "prompt" ? inputEl.value : true);
          };
          cancelBtn.onclick = () => {
            cleanup();
            resolve(type === "prompt" ? null : false);
          };

          overlay.classList.add("open");
        });
      }
      const ntPrompt = (msg, val) => ntDialog("prompt", msg, val);
      const ntConfirm = (msg) => ntDialog("confirm", msg);
      const ntAlert = (msg) => ntDialog("alert", msg);

      // Clock
      function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById("clock");
        const dateEl = document.getElementById("date");
        if (clockEl) {
          try {
            clockEl.textContent = now.toLocaleTimeString("en-US", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            });
          } catch {
            clockEl.textContent =
              String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
          }
        }
        if (dateEl) {
          try {
            dateEl.textContent = now.toLocaleDateString("en-US", {
              weekday: "long",
              month: "long",
              day: "numeric"
            });
          } catch {
            dateEl.textContent = now.toDateString();
          }
        }
      }
      updateClock();
      setInterval(updateClock, 1000);

      // Search
      $("#searchForm").onsubmit = (e) => {
        e.preventDefault();
        const q = $("#searchInput").value.trim();
        if (q) nav($("#engine").value + encodeURIComponent(q));
      };

      // Populate custom search engines from localStorage
      function populateCustomEngines() {
        try {
          const custom = JSON.parse(localStorage.getItem("scramjet_custom_engines") || "[]");
          const sel = $("#engine");
          custom.forEach(function (eng) {
            const opt = document.createElement("option");
            opt.value = eng.url;
            opt.textContent = eng.name;
            sel.appendChild(opt);
          });
        } catch (e) {}
      }
      populateCustomEngines();

      // Close button for preset shortcuts
      const REMOVED_PRESETS_KEY = "scramjet_removed_presets";
      function getRemovedPresets() {
        try {
          return JSON.parse(localStorage.getItem(REMOVED_PRESETS_KEY) || "[]");
        } catch {
          return [];
        }
      }
      function hidePresetShortcut(url) {
        const removed = getRemovedPresets();
        if (!removed.includes(url)) removed.push(url);
        localStorage.setItem(REMOVED_PRESETS_KEY, JSON.stringify(removed));
        const el = document.querySelector(`.preset-shortcut[data-url="${url}"]`);
        if (el) el.style.display = "none";
      }
      getRemovedPresets().forEach((url) => {
        const el = document.querySelector(`.preset-shortcut[data-url="${url}"]`);
        if (el) el.style.display = "none";
      });
      document.querySelectorAll(".shortcut-close").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          hidePresetShortcut(btn.dataset.url);
        });
      });

      // Shortcuts
      $("#shortcuts").onclick = async (e) => {
        if (e.target.closest(".shortcut-close")) return;
        const shortcut = e.target.closest(".shortcut[data-url]");
        const addBtn = e.target.closest("#addShortcut");

        if (shortcut) {
          e.preventDefault();
          nav(shortcut.dataset.url);
        } else if (addBtn) {
          const name = await ntPrompt("Shortcut name:");
          if (!name) return;
          let url = await ntPrompt("URL:");
          if (!url) return;
          if (!url.startsWith("http")) url = "https://" + url;

          const shortcuts = JSON.parse(localStorage.getItem("shortcuts") || "[]");
          shortcuts.push({ name, url });
          localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
          renderCustom();
        }
      };

      function renderCustom() {
        document.querySelectorAll(".custom-shortcut").forEach((e) => e.remove());
        const shortcuts = JSON.parse(localStorage.getItem("shortcuts") || "[]");
        const addBtn = $("#addShortcut");

        shortcuts.forEach((s) => {
          const div = document.createElement("div");
          div.className = "shortcut custom-shortcut";
          div.dataset.url = s.url;
          div.innerHTML = `
          <div class="shortcut-icon"><i class="fa-solid fa-link"></i></div>
          <span class="shortcut-label">${s.name}</span>
        `;
          addBtn.before(div);
        });
      }

      // Render bookmarks
      function renderBookmarks() {
        const container = document.getElementById("bookmarks-container");
        if (!container) return;

        const bookmarks = JSON.parse(localStorage.getItem("scramjet_bookmarks") || "[]");
        container.innerHTML = "";

        if (bookmarks.length === 0) {
          document.getElementById("bookmarks-section").style.display = "none";
          return;
        }

        document.getElementById("bookmarks-section").style.display = "block";

        bookmarks.forEach((b) => {
          const div = document.createElement("div");
          div.className = "shortcut bookmark-shortcut";
          div.dataset.url = b.url;
          div.innerHTML = `
          <div class="shortcut-icon"><i class="fa-solid fa-star" style="color:var(--accent);"></i></div>
          <span class="shortcut-label">${b.name}</span>
        `;
          container.appendChild(div);
        });
      }

      // Quote
      if (window.QUOTES?.length) {
        $("#quote").textContent = window.QUOTES[Math.floor(Math.random() * window.QUOTES.length)];
      }

      renderCustom();
      renderBookmarks();

      // Handle bookmark clicks
      document.getElementById("bookmarks-container").onclick = (e) => {
        const shortcut = e.target.closest(".shortcut[data-url]");
        if (shortcut) {
          e.preventDefault();
          nav(shortcut.dataset.url);
        }
      };
    </script>
  </body>
</html>
