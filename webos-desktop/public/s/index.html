      function initYukiSelect(root) {
        root.addEventListener("click", function (e) {
          var trigger = e.target.closest(".yuki-select-trigger");
          if (!trigger) return;
          var sel = trigger.closest(".yuki-select");
          if (!sel) return;
          e.stopPropagation();
          document.querySelectorAll(".yuki-select.open").forEach(function (s) { if (s !== sel) s.classList.remove("open"); });
          sel.classList.toggle("open");
        });
        root.addEventListener("click", function (e) {
          var opt = e.target.closest(".yuki-select-option");
          if (!opt) return;
          var sel = opt.closest(".yuki-select");
          if (!sel) return;
          var val = opt.dataset.value;
          sel.dataset.value = val;
          var label = sel.querySelector(".yuki-select-label");
          if (label) label.textContent = opt.textContent;
          sel.querySelectorAll(".yuki-select-option").forEach(function (o) { o.classList.toggle("selected", o.dataset.value === val); });
          sel.classList.remove("open");
          sel.dispatchEvent(new CustomEvent("change", { bubbles: true }));
        });
      }

      function renderYukiRange(id, min, max, value) {
        var pct = ((value - min) / (max - min)) * 100;
        return '<div class="yuki-range" id="' + id + '" data-min="' + min + '" data-max="' + max + '" data-value="' + value + '">' +
          '<div class="yuki-range-track">' +
            '<div class="yuki-range-fill" style="width:' + pct + '%"></div>' +
            '<div class="yuki-range-thumb" style="left:' + pct + '%"></div>' +
          '</div>' +
        '</div>';
      }

      function initYukiRange(id, onChange) {
        var el = document.getElementById(id);
        if (!el) return;
        var thumb = el.querySelector(".yuki-range-thumb");
        var track = el.querySelector(".yuki-range-track");
        var fill = el.querySelector(".yuki-range-fill");
        if (!thumb || !track) return;
        var dragging = false;
        function update(clientX) {
          var rect = track.getBoundingClientRect();
          var min = Number(el.dataset.min);
          var max = Number(el.dataset.max);
          var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          var val = Math.round(min + pct * (max - min));
          var newPct = ((val - min) / (max - min)) * 100;
          el.dataset.value = val;
          if (fill) fill.style.width = newPct + "%";
          thumb.style.left = newPct + "%";
          return val;
        }
        track.addEventListener("mousedown", function (e) {
          dragging = true;
          onChange(update(e.clientX));
        });
        document.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          update(e.clientX);
        });
        document.addEventListener("mouseup", function () {
          if (!dragging) return;
          dragging = false;
          onChange(Number(el.dataset.value));
        });
      }

      function renderYukiBookmarks() {
        var items = bookmarks.length === 0 ? '<div class="yuki-page-empty">No bookmarks yet.</div>' :
          bookmarks.map(function (b, i) {
            return '<div class="panel-item" data-url="' + b.url.replace(/"/g, "&quot;") + '" data-tooltip="' + b.url + '">' +
              '<span class="panel-item-icon">★</span>' +
              '<div class="panel-item-content">' +
                '<div class="panel-item-title">' + (b.name || b.url) + '</div>' +
                '<div class="panel-item-sub">' + b.url + '</div>' +
              '</div>' +
              '<button class="panel-item-action" data-remove="' + i + '">✕</button>' +
            '</div>';
          }).join("");
        return '<div style="display:flex;gap:6px;margin-bottom:10px;">' +
          '<button class="settings-action-btn" onclick="exportBookmarksHtml()" data-tooltip="Export bookmarks as an HTML file">Export</button>' +
          '<button class="settings-action-btn" onclick="importBookmarksHtml()" data-tooltip="Import bookmarks from an HTML file">Import</button>' +
        '</div>' + items;
      }

      function renderYukiHistory() {
        if (history.length === 0) return '<div class="yuki-page-empty">No history yet.</div>';
        var items = [].concat(history).reverse();
        var groups = {};
        items.forEach(function (h) {
          var d = new Date(h.time);
          var today = new Date();
          var isToday = d.toDateString() === today.toDateString();
          var yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
          var isYesterday = d.toDateString() === yesterday.toDateString();
          var key = isToday ? "Today" : isYesterday ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
          if (!groups[key]) groups[key] = [];
          groups[key].push(h);
        });
        var html = "";
        Object.keys(groups).forEach(function (date) {
          html += '<div class="history-date">' + date + '</div>';
          groups[date].forEach(function (h) {
            var d = new Date(h.time);
            var timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
            var domain = "";
            try { domain = new URL(h.url).hostname; } catch (e) { domain = h.url; }
            html += '<div class="history-entry" data-url="' + h.url.replace(/"/g, "&quot;") + '" data-tooltip="' + (h.title || h.url) + '">' +
              '<img class="he-favicon" src="' + getFaviconUrl(domain) + '" onerror="this.style.display=\'none\'" />' +
              '<div class="he-body"><div class="he-title">' + (h.title || h.url) + '</div><div class="he-meta">' + domain + " • " + h.url + '</div></div>' +
              '<span class="he-time">' + timeStr + '</span>' +
            '</div>';
          });
        });
        return html;
      }

      function renderYukiDownloads() {
        if (downloads.length === 0) return '<div class="yuki-page-empty">No downloads yet.</div>';
        return [].concat(downloads).reverse().map(function (d) {
          return '<div class="panel-item" data-url="' + (d.url || "").replace(/"/g, "&quot;") + '">' +
            '<span class="panel-item-icon">' + (d.status === "done" ? "📄" : d.status === "failed" ? "⚠️" : "⬇") + '</span>' +
            '<div class="panel-item-content">' +
              '<div class="panel-item-title">' + (d.filename || "Unknown") + '</div>' +
              '<div class="panel-item-sub">' + (d.url || "") + '</div>' +
            '</div>' +
          '</div>';
        }).join("");
      }

      function attachYukiHandlers(page) {
        if (page === "settings") initYukiSettings();
        else if (page === "bookmarks" || page === "history") initYukiListPage(page);
      }

      function initYukiListPage(page) {
        var body = document.getElementById("yuki-page-body");
        if (!body) return;
        body.querySelectorAll("[data-url]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            if (e.target.closest("[data-remove]")) return;
            var url = el.dataset.url;
            if (url) yukiNavigateAway(url);
          });
        });
        body.querySelectorAll("[data-remove]").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var idx = parseInt(btn.dataset.remove);
            if (page === "bookmarks" && !isNaN(idx) && bookmarks[idx]) {
              bookmarks.splice(idx, 1);
              saveBookmarks();
              renderBookmarkBar();
              renderYukiPage("bookmarks");
            }
          });
        });
      }

      function initYukiSettings() {
        var body = document.getElementById("yuki-page-body");
        if (!body) return;

        showYukiSettingsSection("nav");

        renderYukiServerList();
        renderTransportSection("yuki-transport-selector");
        renderYukiCustomSearchEngines();
        renderYukiDarkExclusions();

        document.getElementById("yuki-set-darkmode")?.addEventListener("change", function () {
          darkModeEnabled = this.checked;
          savePrefs();
          tabs.forEach(function (t) { applyDarkModeToTab(t); });
        });

        var hpInput = document.getElementById("yuki-set-homepage-input");
        var hpBtn = document.getElementById("yuki-set-homepage-btn");
        if (hpInput) hpInput.addEventListener("change", function () {
          homepageUrl = this.value.trim() || "NT.html";
          savePrefs();
        });
        if (hpBtn) hpBtn.addEventListener("click", function () {
          homepageUrl = "NT.html";
          if (hpInput) hpInput.value = "";
          savePrefs();
        });

        document.getElementById("yuki-set-search-suggestions")?.addEventListener("change", function () {
          searchSuggestionsEnabled = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-search-region")?.addEventListener("change", function () {
          searchRegion = this.dataset.value || "";
          savePrefs();
        });

        document.getElementById("yuki-set-bmbar")?.addEventListener("change", function () {
          bookmarkBarVisible = this.checked;
          savePrefs();
          renderBookmarkBar();
        });

        document.getElementById("yuki-set-restore-tabs")?.addEventListener("change", function () {
          restoreTabs = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-confirm-close")?.addEventListener("change", function () {
          confirmCloseTabs = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-tab-behavior")?.addEventListener("change", function () {
          tabBehaviorNext = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-autoplay-block")?.addEventListener("change", function () {
          autoplayBlock = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-clear-on-exit")?.addEventListener("change", function () {
          clearOnExit = this.checked;
          savePrefs();
        });
        document.getElementById("yuki-set-tor-enabled")?.addEventListener("change", function () {
          torEnabled = this.checked;
          savePrefs();
          sendToParent({ type: "scram:setTorMode", active: torEnabled });
          if (torEnabled) {
            var tab = getActiveTab();
            if (tab && tab.url && !tab.url.includes("NT.html")) {
              sendToParent({ type: "scram:navigate", url: tab.url });
            }
          }
        });
        document.getElementById("yuki-add-dark-exclusion")?.addEventListener("click", function () {
          var tab = getActiveTab();
          if (!tab || !tab.url || tab.url === "NT.html" || tab.url.startsWith("yuki://")) return;
          try {
            var host = new URL(tab.url).hostname;
            darkModeExclusions[host] = true;
            savePrefs();
            renderYukiDarkExclusions();
            applyDarkModeToTab(tab);
          } catch (e) {}
        });
        document.getElementById("yuki-add-custom-engine")?.addEventListener("click", async function () {
          var name = await yukiPrompt("Search engine name:");
          if (!name) return;
          var url = await yukiPrompt("Search URL (use {search} as placeholder):");
          if (!url || !url.includes("{search}")) return;
          var engines = getCustomSearchEngines();
          engines.push({ name: name, url: url.replace("{search}", "") });
          saveCustomSearchEngines(engines);
          renderYukiCustomSearchEngines();
        });

        document.getElementById("yuki-set-clear-history")?.addEventListener("click", async function () {
          if (await yukiConfirm("Clear all history?")) { history = []; saveHistory(); }
        });
        document.getElementById("yuki-set-clear-downloads")?.addEventListener("click", async function () {
          if (await yukiConfirm("Clear all downloads?")) { downloads = []; saveDownloads(); }
        });
        document.getElementById("yuki-set-clear-all")?.addEventListener("click", async function () {
          if (await yukiConfirm("Clear all browsing data (history, downloads, bookmarks)?")) {
            history = []; bookmarks = []; downloads = [];
            saveHistory(); saveBookmarks(); saveDownloads();
          }
        });
        document.getElementById("yuki-set-reset-all")?.addEventListener("click", async function () {
          if (await yukiConfirm("Reset all settings to defaults? This will reload the page.")) {
            Object.values(STORAGE_KEYS).forEach(function (k) { localStorage.removeItem(k); });
            location.reload();
          }
        });

        document.getElementById("yuki-save-custom-wisp")?.addEventListener("click", function () {
          var input = document.getElementById("yuki-custom-wisp-input");
          var url = input.value.trim();
          if (!url) return;
          if (!url.startsWith("ws://") && !url.startsWith("wss://")) return;
          var wisps = getStoredWisps();
          if (wisps.some(function (w) { return w.url === url; })) return;
          wisps.push({ name: "Custom " + (wisps.length + 1), url: url });
          localStorage.setItem("customWisps", JSON.stringify(wisps));
          input.value = "";
          renderYukiServerList();
        });

        body.querySelectorAll("[data-yuki-remove-wisp]").forEach(function (btn) {
          btn.addEventListener("click", async function (e) {
            e.stopPropagation();
            var urlToDelete = btn.dataset.yukiRemoveWisp;
            if (!(await yukiConfirm("Remove this server?"))) return;
            var wisps = getStoredWisps().filter(function (w) { return w.url !== urlToDelete; });
            localStorage.setItem("customWisps", JSON.stringify(wisps));
            if (localStorage.getItem("proxServer") === urlToDelete) {
              setWisp(DEFAULT_WISP);
            } else {
              renderYukiServerList();
            }
          });
        });

        body.querySelectorAll(".wisp-option").forEach(function (item) {
          item.addEventListener("click", function () {
            var url = item.dataset.wispUrl;
            if (url) setWisp(url);
          });
        });

        initYukiSelect(body);

        document.addEventListener("click", function () {
          document.querySelectorAll(".yuki-select.open").forEach(function (s) { s.classList.remove("open"); });
        });
      }

      function renderYukiServerList() {
        var list = document.getElementById("yuki-server-list");
        if (!list) return;
        var currentUrl = localStorage.getItem("proxServer") || DEFAULT_WISP;
        var allWisps = [].concat(WISP_SERVERS).concat(getStoredWisps());
        var html = "";
        allWisps.forEach(function (server, index) {
          var isActive = server.url === currentUrl;
          var isCustom = index >= WISP_SERVERS.length;
          html += '<div class="wisp-option' + (isActive ? " active" : "") + '" data-wisp-url="' + server.url + '" data-tooltip="' + server.name + ' — ' + server.url + '">' +

            '</div>' +
            '<div class="wisp-option-url">' + server.url + '</div>' +

        list.innerHTML = html;
        list.querySelectorAll(".wisp-option").forEach(function (item) {

          if (url) checkServerHealth(url, item);

      function saveCustomWisp() {
        const input = document.getElementById("custom-wisp-input");
        const url = input.value.trim();
        if (!url) return;
        if (!url.startsWith("ws://") && !url.startsWith("wss://")) {
          alert("URL must start with wss:// or ws://");
          return;
        }

        const customWisps = getStoredWisps();
        if (customWisps.some((w) => w.url === url) || WISP_SERVERS.some((w) => w.url === url)) {
          alert("This server is already in the list.");
          return;
        }

        customWisps.push({ name: `Custom ${customWisps.length + 1}`, url });
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        input.value = "";
        renderServerList();
      }

      window.deleteCustomWisp = function (urlToDelete) {
        if (!confirm("Remove this server?")) return;
        let customWisps = getStoredWisps().filter((w) => w.url !== urlToDelete);
        localStorage.setItem("customWisps", JSON.stringify(customWisps));
        if (localStorage.getItem("proxServer") === urlToDelete) setWisp(DEFAULT_WISP);
        else renderServerList();
      };

      async function checkServerHealth(url, element) {
        const dot = element.querySelector(".status-indicator");
        const text = element.querySelector(".ping-text");
        const start = Date.now();

        try {
          const socket = new WebSocket(url);
          const timeout = setTimeout(() => {
            if (socket.readyState !== WebSocket.OPEN) {
              socket.close();
              markOffline();
            }
          }, 3000);

          socket.onopen = () => {
            clearTimeout(timeout);
            const latency = Date.now() - start;
            socket.close();
            dot.classList.add("status-success");
            text.textContent = `${latency}ms`;
          };

          socket.onerror = () => {
            clearTimeout(timeout);
            markOffline();
          };
        } catch {
          markOffline();
        }

        function markOffline() {
          dot.classList.add("status-error");
          text.textContent = "offline";
          const currentWisp = localStorage.getItem("proxServer") || DEFAULT_WISP;
          if (url === currentWisp && typeof Notify !== "undefined") {
            Notify.error("Connection Failed", "Current proxy server is offline. Try switching servers.");
          }
        }
      }

      function setWisp(url) {
        const oldUrl = localStorage.getItem("proxServer");
        localStorage.setItem("proxServer", url);
        hostWispUrl = url;
        if (isEmbedded) sendToParent({ type: "scram:proxyConfigChange", wispUrl: url });

        if (typeof Notify !== "undefined" && oldUrl !== url) {
          const serverName = [...WISP_SERVERS, ...getStoredWisps()].find((s) => s.url === url)?.name || "Custom Server";
          Notify.success("Proxy Changed", `Switching to ${serverName}...`);
        }

        setTimeout(() => location.reload(), 600);
      }

      function setupTooltips() {
        const tip = document.getElementById("tooltip");
        if (!tip) return;
        let tipTarget = null;
        let tipTimer = null;

        document.querySelectorAll("[title]").forEach(function (el) {
          if (!el.dataset.tooltip) el.dataset.tooltip = el.title;
          el.removeAttribute("title");
        });

        document.addEventListener(
          "mouseover",
          function (e) {
            const el = e.target.closest("[data-tooltip]");
            if (!el) {
              hide();
              return;
            }
            if (el === tipTarget) return;
            tipTarget = el;
            clearTimeout(tipTimer);
            tipTimer = setTimeout(function () {
              tip.textContent = el.dataset.tooltip;
              tip.classList.add("visible");
            }, 300);
          },
          true
        );

        document.addEventListener(
          "mouseout",
          function (e) {
            if (e.target.closest("[data-tooltip]")) hide();
          },
          true
        );

        document.addEventListener(
          "mousemove",
          function (e) {
            if (!tipTarget) return;
            var x = e.clientX + 14;
            var y = e.clientY + 14;
            var r = tip.getBoundingClientRect();
            if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
            if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
            tip.style.left = Math.max(4, x) + "px";
            tip.style.top = Math.max(4, y) + "px";
          },
          true
        );

        function hide() {
          tipTarget = null;
          clearTimeout(tipTimer);
          tip.classList.remove("visible");
        }
      }

      function injectAutoplayBlocker(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const script = doc.createElement("script");
          script.textContent = `(function(){
            document.querySelectorAll('audio,video').forEach(function(m){
              if (!m.paused) m.pause();
              m.autoplay = false;
            });
            new MutationObserver(function(){
              document.querySelectorAll('audio,video').forEach(function(m){
                if (!m.paused) { m.pause(); m.autoplay = false; }
              });
            }).observe(document, {childList:true, subtree:true});
          })();`;
          (doc.head || doc.documentElement).appendChild(script);
        } catch (e) {}
      }

      function injectAudioDetector(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const script = doc.createElement("script");
          script.textContent = `(function(){
            var audioPlaying = false;
            var audioContextActive = false;
            
            function checkMedia() {
              var playing = Array.from(document.querySelectorAll('audio,video')).some(function(m){
                return !m.paused && !m.muted && m.volume > 0;
              });
              var wasPlaying = audioPlaying;
              audioPlaying = playing;
              if (wasPlaying !== audioPlaying || audioContextActive) {
                window.parent.postMessage({type:'browser-audio-playing',playing:audioPlaying || audioContextActive},'*');
              }
            }
            
            function patchAudioContext() {
              var OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
              if (!OriginalAudioContext || window.__scramAudioPatched) return;
              
              var PatchedAudioContext = function() {
                var instance = new OriginalAudioContext();
                audioContextActive = true;
                window.parent.postMessage({type:'browser-audio-playing',playing:true},'*');
                
                var originalResume = instance.resume;
                instance.resume = function() {
                  audioContextActive = true;
                  window.parent.postMessage({type:'browser-audio-playing',playing:true},'*');
                  return originalResume.apply(this, arguments);
                };
                
                var originalSuspend = instance.suspend;
                instance.suspend = function() {
                  audioContextActive = false;
                  checkMedia();
                  return originalSuspend.apply(this, arguments);
                };
                
                instance.addEventListener('statechange', function() {
                  audioContextActive = instance.state === 'running';
                  checkMedia();
                });
                
                return instance;
              };
              
              PatchedAudioContext.prototype = OriginalAudioContext.prototype;
              window.AudioContext = PatchedAudioContext;
              window.webkitAudioContext = PatchedAudioContext;
              window.__scramAudioPatched = true;
            }
            
            patchAudioContext();
            setInterval(checkMedia, 1000);
            checkMedia();
            
            window.addEventListener('message', function(e) {
              if (e.data && e.data.type === 'scram-mute-toggle') {
                var muted = e.data.muted;
                Array.from(document.querySelectorAll('audio,video')).forEach(function(m){
                  m.muted = muted;
                });
              }
            });
          })();`;
          (doc.head || doc.documentElement).appendChild(script);
        } catch (e) {}
      }

      function toggleTabMute(tab) {
        tab.isMuted = !tab.isMuted;
        try {

          var media = doc.querySelectorAll("audio, video");
          if (tab.isMuted) {
            media.forEach(function (el) { el.muted = true; });
          } else {
            media.forEach(function (el) { el.muted = false; });
          }
          tab.frame.element.contentWindow.postMessage({ type: "scram-mute-toggle", muted: tab.isMuted }, "*");
        } catch (e) {}
        updateTabsUI();
      }

      let pdfjsLibLoader = null;
      function loadPdfJs() {
        if (!pdfjsLibLoader) {
          pdfjsLibLoader = new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
            s.onload = () => resolve(window.pdfjsLib);
            s.onerror = () => reject(new Error("Failed to load pdf.js"));
            document.head.appendChild(s);
          });
        }
        return pdfjsLibLoader;
      }

      function openPdfViewer(url) {
        var overlay = document.getElementById("pdf-viewer");
        var body = document.getElementById("pdf-body");
        if (!overlay || !body) return;
        overlay.classList.add("active");
        body.innerHTML = '<div class="pdf-loading">Loading PDF…</div>';
        document.getElementById("pdf-title").textContent = url.split("/").pop() || "PDF Document";
        document.getElementById("pdf-page-info").textContent = "-";
        loadPdfJs().then(function () {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

          var fetchPromise;
          if (window.__scramjetTransport) {
            fetchPromise = (async () => {
              const res = await window.__scramjetTransport.request(url, "GET", null, {}, null);
              const headers = new Headers();
              if (Array.isArray(res.headers)) {
                res.headers.forEach(([k, v]) => headers.append(k, v));
              }
              const body = res.body instanceof ArrayBuffer ? res.body : new Uint8Array(res.body);
              return new Response(body, { status: res.status, statusText: res.statusText, headers });
            })();
          } else {
            fetchPromise = fetch(url);
          }

          fetchPromise.then(function (r) { return r.arrayBuffer(); }).then(function (buffer) {
            return pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
          }).then(function (doc) {
            body.innerHTML = "";
            var info = document.createElement("div");
            info.className = "pdf-loading";
            info.textContent = "PDF - " + doc.numPages + " page(s)";
            body.appendChild(info);
            var scale = 1.2;
            var seq = Promise.resolve();
            for (var num = 1; num <= doc.numPages; num++) {
              seq = seq.then((function (n) {
                return function () { return renderPdfPage(doc, body, n, scale); };
              })(num));
            }
            return seq.then(function () {
              document.getElementById("pdf-page-info").textContent = doc.numPages + " page(s)";
            });
          }).catch(function () {
            body.innerHTML = '<div class="pdf-loading" style="color:var(--error);">Failed to load PDF.</div>';
          });
        }).catch(function () {
          body.innerHTML = '<div class="pdf-loading" style="color:var(--error);">Failed to load PDF.</div>';
        });
      }

      function renderPdfPage(doc, container, num, scale) {
        return doc.getPage(num).then(function (page) {
          var vp = page.getViewport({ scale: scale });
          var pageDiv = document.createElement("div");
          pageDiv.className = "office-pdf-page";
          pageDiv.style.cssText = "width:" + vp.width + "px;height:" + vp.height + "px;margin:10px auto;position:relative;box-shadow:0 2px 12px rgba(0,0,0,0.4);";
          var canvas = document.createElement("canvas");
          canvas.width = vp.width;
          canvas.height = vp.height;
          pageDiv.appendChild(canvas);
          return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise.then(function () {
            return page.getTextContent().then(function (textContent) {
              var textLayer = document.createElement("div");
              textLayer.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;";
              var txArr = vp.transform;
              for (var i = 0; i < textContent.items.length; i++) {
                var item = textContent.items[i];
                if (!item.str) continue;
                var t = pdfjsLib.Util.transform(txArr, item.transform);
                var span = document.createElement("span");
                span.textContent = item.str;
                span.style.cssText = "position:absolute;left:" + t[4] + "px;top:" + t[5] + "px;font-size:" + Math.abs(t[0]) + "px;font-family:sans-serif;white-space:pre;color:transparent;user-select:text;pointer-events:auto;";
                textLayer.appendChild(span);
              }
              pageDiv.appendChild(textLayer);
              var label = document.createElement("div");
              label.style.cssText = "text-align:center;color:var(--text-muted);font-size:12px;padding:4px 0 12px;";
              label.textContent = "Page " + num + " of " + doc.numPages;
              container.appendChild(pageDiv);
              container.appendChild(label);
            });
          });
        });
      }

      function closePdfViewer() {
        document.getElementById("pdf-viewer").classList.remove("active");
        document.getElementById("pdf-body").innerHTML = "";
      }

      function applyDarkModeToTab(tab) {
        if (!tab || !tab.frame.element || !tab.frame.element.contentDocument) return;
        const styleId = "scramjet-darkmode-style";
        const doc = tab.frame.element.contentDocument;
        let styleEl = doc.getElementById(styleId);

        if (!darkModeEnabled) {
          if (styleEl) styleEl.remove();
          return;
        }

        let currentHost = "";
        try {
          currentHost = new URL(tab.frame.element.contentWindow.location.href).hostname;
        } catch (e) {}

        if (darkModeExclusions[currentHost]) {
          if (styleEl) styleEl.remove();
          return;
        }

        if (!styleEl) {
          styleEl = doc.createElement("style");
          styleEl.id = styleId;
          styleEl.textContent = `
            html {
              filter: invert(90%) hue-rotate(180deg);
            }
            html img, html video, html canvas, html svg {
              filter: invert(100%) hue-rotate(180deg);
            }
          `;
          doc.head.appendChild(styleEl);
        }
      }

      function savePage() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html" || tab.url === "") return;

        const existingIndex = bookmarks.findIndex((b) => b.url === tab.url);
        if (existingIndex === -1) {
          bookmarks.push({ name: tab.title || tab.url, url: tab.url });
          saveBookmarks();
          updateStarButton();
        }

        downloads.push({
          filename: tab.title || "Saved Page",
          url: tab.url,
          status: "done",
          time: Date.now()

        saveDownloads();
      }

        const container = document.getElementById("iframe-container");

        tabs.forEach((t) => t.frame.element.classList.add("hidden"));
        const loadingEl = document.getElementById("loading");
        const errorEl = document.getElementById("error");
        if (loadingEl) loadingEl.style.display = "none";
        if (errorEl) errorEl.style.display = "none";

        const panel = document.createElement("div");
        panel.className = "in-content-panel";
        panel.id = "in-content-panel";

        const searchHtml = options.searchable
          ? `<input class="in-content-panel-search" id="icp-search" placeholder="Search ${type.toLowerCase()}..." spellcheck="false" data-tooltip="Filter items by keyword" />`
          : "";
        const clearHtml = options.clearable
          ? `<button class="in-content-panel-clear" id="icp-clear" data-tooltip="Delete all items">Clear All</button>`
          : "";

        panel.innerHTML = `
          <div class="in-content-panel-header">
            <span class="in-content-panel-title"><i class="fa-solid ${options.icon || "fa-list"}"></i> ${type}</span>
            ${searchHtml}
            ${clearHtml}
            <button class="in-content-panel-close" data-tooltip="Close panel">✕</button>
          </div>
          <div class="in-content-panel-body" id="icp-body"></div>
        `;

        const bodyEl = panel.querySelector("#icp-body");
        const doRender = (filter) => {
          bodyEl.innerHTML = bodyRenderer(filter);
          bodyEl.querySelectorAll("[data-url]").forEach((el) => {
            el.addEventListener("click", (e) => {
              if (e.target.dataset.remove !== undefined) return;
              const url = e.target.dataset.url || el.dataset.url;
              if (url) {
                handleSubmit(url);
                closeInContentPanel();
              }
            });
          });
          bodyEl.querySelectorAll("[data-remove]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const idx = parseInt(btn.dataset.remove);
              if (type === "Bookmarks" && bookmarks[idx]) {
                bookmarks.splice(idx, 1);
                saveBookmarks();
                doRender(panel.querySelector("#icp-search")?.value || "");
              }
            });
          });
        };

        doRender("");

        if (options.searchable) {
          const searchInput = panel.querySelector("#icp-search");
          searchInput.addEventListener("input", () => doRender(searchInput.value));
        }

        if (options.clearable) {
          const clearBtn = panel.querySelector("#icp-clear");
          clearBtn.addEventListener("click", () => {
            if (confirm(`Clear all ${type.toLowerCase()}?`)) {
              if (type === "History") {
                history = [];
                saveHistory();
                doRender("");
              }
              if (type === "Downloads") {
                downloads = [];
                saveDownloads();
                doRender("");
              }
            }
          });
        }

        panel.querySelector(".in-content-panel-close").onclick = closeInContentPanel;

        container.appendChild(panel);
      }

      function closeInContentPanel() {
        _currentPanelType = null;

        if (panel) panel.remove();
        const activeTab = getActiveTab();

          activeTab.frame.element.classList.remove("hidden");

      function openHistoryPanel() {
        openInContentPanel(
          "History",
          (filter) => {
            let items = [...history].reverse();
            if (filter) {
              const q = filter.toLowerCase();
              items = items.filter((h) => h.url.toLowerCase().includes(q) || (h.title || "").toLowerCase().includes(q));
            }
            if (items.length === 0)
              return `<div class="in-content-panel-empty">No history${filter ? " matching search" : ""}.</div>`;
            const groups = {};
            items.forEach((h) => {
              const d = new Date(h.time);
              const today = new Date();
              const isToday = d.toDateString() === today.toDateString();
              const yesterday = new Date(today);
              yesterday.setDate(yesterday.getDate() - 1);
              const isYesterday = d.toDateString() === yesterday.toDateString();
              let key;
              if (isToday) key = "Today";
              else if (isYesterday) key = "Yesterday";
              else key = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
              if (!groups[key]) groups[key] = [];
              groups[key].push(h);
            });
            let html = "";
            Object.entries(groups).forEach(([date, entries]) => {
              html += `<div class="history-date">${date}</div>`;
              entries.forEach((h) => {
                const d = new Date(h.time);
                const timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
                let domain = "";
                try {
                  domain = new URL(h.url).hostname;
                } catch (e) {
                  domain = h.url;
                }
                html += `
                <div class="history-entry" data-url="${h.url.replace(/"/g, "&quot;")}" data-tooltip="${h.title || h.url}">
                  <img class="he-favicon" src="${getFaviconUrl(domain)}" onerror="this.style.display='none'" />
                  <div class="he-body">
                    <div class="he-title">${h.title || h.url}</div>
                    <div class="he-meta"><span class="he-domain">${domain}</span> • ${h.url}</div>
                  </div>
                  <span class="he-time">${timeStr}</span>
                </div>
              `;
              });
            });
            return html;
          },
          { searchable: true, clearable: true, icon: "fa-clock-rotate-left" }
        );
      }

      function closePanel() {
        const panel = document.querySelector(".browser-panel");

      var _findMatches = [];
      var _findCurrent = -1;

      function showFindBar() {
        var bar = document.getElementById("find-bar");
        if (!bar) return;
        bar.style.display = "flex";
        var input = document.getElementById("find-input");
        if (input) { input.value = ""; input.focus(); }
        document.getElementById("find-count").textContent = "0/0";
        _findMatches = [];
        _findCurrent = -1;
      }

      function hideFindBar() {
        document.getElementById("find-bar").style.display = "none";
        clearHighlights();
        _findMatches = [];
        _findCurrent = -1;
      }

      function clearHighlights() {
        var tab = getActiveTab();
        if (!tab) return;
        try {
          var doc = tab.frame.element.contentWindow.document;
          var marks = doc.querySelectorAll(".yuki-find-mark");
          marks.forEach(function (m) { m.replaceWith(m.textContent); });
          doc.body.normalize();
        } catch (e) {}
      }

      function doFind() {
        var tab = getActiveTab();
        if (!tab) return;
        var query = document.getElementById("find-input").value;
        clearHighlights();
        _findMatches = [];
        _findCurrent = -1;
        if (!query) { document.getElementById("find-count").textContent = "0/0"; return; }
        try {
          var doc = tab.frame.element.contentWindow.document;
          var lowerQ = query.toLowerCase();
          var textNodes = [];
          var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          textNodes.forEach(function (textNode) {
            var text = textNode.textContent;
            var lower = text.toLowerCase();
            var idx = 0;
            while ((idx = lower.indexOf(lowerQ, idx)) !== -1) {
              var after = textNode.splitText(idx);
              if (after.textContent.length > query.length) after.splitText(query.length);
              var mark = doc.createElement("mark");
              mark.className = "yuki-find-mark";
              mark.textContent = after.textContent;
              after.replaceWith(mark);
              _findMatches.push(mark);
              textNode = mark.nextSibling;
              if (!textNode || textNode.nodeType !== 3) break;
              lower = textNode.textContent.toLowerCase();
              idx = 0;
            }
          });
          if (_findMatches.length > 0) {
            _findCurrent = 0;
            _findMatches[0].classList.add("active");
            _findMatches[0].scrollIntoView({ behavior: "smooth", block: "center" });
          }
        } catch (e) {}
        document.getElementById("find-count").textContent = _findMatches.length + "/" + _findMatches.length;
        updateFindButtons();
      }

      function findNext() {
        if (_findMatches.length === 0) return;
        _findMatches[_findCurrent].classList.remove("active");
        _findCurrent = (_findCurrent + 1) % _findMatches.length;
        _findMatches[_findCurrent].classList.add("active");
        _findMatches[_findCurrent].scrollIntoView({ behavior: "smooth", block: "center" });
        updateFindButtons();
      }

      function findPrev() {
        if (_findMatches.length === 0) return;
        _findMatches[_findCurrent].classList.remove("active");
        _findCurrent = (_findCurrent - 1 + _findMatches.length) % _findMatches.length;
        _findMatches[_findCurrent].classList.add("active");
        _findMatches[_findCurrent].scrollIntoView({ behavior: "smooth", block: "center" });
        updateFindButtons();
      }

      function updateFindButtons() {
        document.getElementById("find-count").textContent = (_findMatches.length ? (_findCurrent + 1) : 0) + "/" + _findMatches.length;
      }

      function setupKeyboardShortcuts() {
        const listener = (e) => {
          if (e.key === "Escape") {
            var findBar = document.getElementById("find-bar");
            if (findBar && findBar.style.display !== "none") { hideFindBar(); return; }
            var dd = document.getElementById("browser-dropdown");
            if (dd && dd.classList.contains("open")) { dd.classList.remove("open"); return; }
            var omnibox = document.querySelector(".omnibox-dropdown");
            if (omnibox) { hideOmnibox(); return; }
          }

          const activeElement = document.activeElement;
          const inInput =
            activeElement &&
            (activeElement.tagName === "INPUT" ||
              activeElement.tagName === "TEXTAREA" ||
              activeElement.isContentEditable);
          if (inInput) return;

          if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && /^[1-9]$/.test(e.key)) {
            e.preventDefault();
            const index = parseInt(e.key, 10) - 1;
            const tab = tabs[index];
            if (tab) switchTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.key === "l") {
            e.preventDefault();
            document.getElementById("address-bar").focus();
            document.getElementById("address-bar").select();
            return;
          }

          if (e.ctrlKey && e.key === "f") {
            e.preventDefault();
            if (!_yukiActive) showFindBar();
            return;
          }

          if (e.ctrlKey && e.key === "t") {
            e.preventDefault();
            createTab(true);
            return;
          }

          if (e.ctrlKey && e.key === "w") {
            e.preventDefault();
            const tab = getActiveTab();
            if (tab) closeTab(tab.id);
            return;
          }

          if (e.ctrlKey && e.shiftKey && e.key === "T") {
            e.preventDefault();
            reopenLastClosedTab();
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.key === "h") {
            e.preventDefault();
            navigateToYukiPage("history");
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.key === "j") {
            e.preventDefault();
            navigateToYukiPage("downloads");
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "B") {
            e.preventDefault();
            bookmarkBarVisible = !bookmarkBarVisible;
            savePrefs();
            renderBookmarkBar();
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.key === "s") {
            e.preventDefault();
            var tab = getActiveTab();
            if (tab) savePage();
            return;
          }
        };

        document.addEventListener("keydown", listener, true);
      }

      let omniboxDropdown = null;
      let omniboxSelectedIndex = -1;

      function updateOmnibox(query) {
        if (!searchSuggestionsEnabled) {
          hideOmnibox();
          return;
        }
        if (!query || query.length < 1) {
          hideOmnibox();
          return;
        }
        const q = query.toLowerCase();
        const results = [];
        const seen = new Set();
        const addResult = (icon, title, url) => {
          if (seen.has(url) || results.length >= 8) return;
          seen.add(url);
          results.push({ icon, title, url });
        };
        [...history].reverse().forEach((h) => {
          if (h.url.toLowerCase().includes(q) || (h.title || "").toLowerCase().includes(q))
            addResult('<i class="fa-solid fa-clock"></i>', h.title || h.url, h.url);
        });
        bookmarks.forEach((b) => {
          if (b.url.toLowerCase().includes(q) || b.name.toLowerCase().includes(q))
            addResult('<i class="fa-solid fa-star"></i>', b.name, b.url);
        });
        if (results.length === 0) {
          hideOmnibox();
          return;
        }

        const wrap = document.querySelector(".address-wrapper");
        let dropdown = wrap.querySelector(".omnibox-dropdown");
        if (!dropdown) {
          dropdown = document.createElement("div");
          dropdown.className = "omnibox-dropdown";
          wrap.appendChild(dropdown);
          wrap.style.position = "relative";
        }
        omniboxDropdown = dropdown;
        omniboxSelectedIndex = -1;

        dropdown.innerHTML = results
          .map(
            (r, i) =>
              `<div class="omnibox-item" data-url="${r.url}" data-idx="${i}" data-tooltip="${r.url}">
            <span class="omnibox-item-icon">${r.icon}</span>
            <span class="omnibox-item-title">${r.title}</span>
            <span class="omnibox-item-url">${r.url}</span>
          </div>`
          )
          .join("");

        dropdown.querySelectorAll(".omnibox-item").forEach((item) => {
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const url = item.dataset.url;
            hideOmnibox();
            handleSubmit(url);
          });
        });
      }

      function navigateOmnibox(delta) {
        if (!omniboxDropdown) return;
        const items = omniboxDropdown.querySelectorAll(".omnibox-item");
        if (!items.length) return;
        omniboxSelectedIndex = (omniboxSelectedIndex + delta + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("selected", i === omniboxSelectedIndex));
        const selected = items[omniboxSelectedIndex];
        if (selected) document.getElementById("address-bar").value = selected.dataset.url;
      }

      function hideOmnibox() {
        if (omniboxDropdown) {
          omniboxDropdown.remove();
          omniboxDropdown = null;
        }
        omniboxSelectedIndex = -1;
      }

      function reopenLastClosedTab() {
        if (closedTabs.length === 0) return;
        const closed = closedTabs.pop();
        createTab(true);
        const tab = getActiveTab();
        if (tab) handleSubmit(closed.url);
        updateMenuBadges();
      }

      function closeOtherTabs(tabId) {
        const toClose = tabs.filter((t) => t.id !== tabId);
        toClose.forEach((t) => closeTab(t.id));
      }

      function closeTabsToRight(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1 || idx === tabs.length - 1) return;
        const toClose = tabs.slice(idx + 1);
        toClose.forEach((t) => closeTab(t.id));
      }

      function closeTabsToLeft(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx <= 0) return;
        const toClose = tabs.slice(0, idx);
        toClose.forEach((t) => closeTab(t.id));
      }

      let html2canvasLoader = null;
      function loadHtml2canvas() {
        if (!html2canvasLoader) {
          html2canvasLoader = new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
            s.onload = () => resolve(window.html2canvas);
            s.onerror = () => reject(new Error("Failed to load html2canvas"));
            document.head.appendChild(s);
          });
        }
        return html2canvasLoader;
      }

      function takeScreenshot() {
        loadHtml2canvas().then(() => {
          const panel = document.getElementById("in-content-panel");
          if (panel) {
            html2canvas(panel, { backgroundColor: null }).then((canvas) => {
              canvas.toBlob((blob) => {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = (_currentPanelType || "panel") + ".png";
                a.click();
                URL.revokeObjectURL(a.href);
              });
            });
            return;
          }
          const tab = getActiveTab();
          if (!tab || !tab.frame || !tab.frame.element) return;
          const iframe = tab.frame.element;
          html2canvas(iframe, { useCORS: true, allowTaint: true, backgroundColor: null }).then((canvas) => {
            canvas.toBlob((blob) => {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = (tab.title || "screenshot").replace(/[^a-z0-9]/gi, "_") + ".png";
              a.click();
              URL.revokeObjectURL(a.href);
            });
          });
        });
      }

      function openTabContextMenu(tab, e) {
        e.preventDefault();
        closePanel();
        const menu = document.createElement("div");
        menu.className = "ctx-menu";
        menu.style.cssText =
          "position:fixed;top:" +
          e.clientY +
          "px;left:" +
          e.clientX +
          "px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 0;min-width:180px;z-index:10000;box-shadow:var(--shadow-lg);";

        const tabIdx = tabs.findIndex((t) => t.id === tab.id);
        const hasOther = tabs.length > 1;
        const hasLeft = tabIdx > 0;
        const hasRight = tabIdx < tabs.length - 1;

        menu.innerHTML = `
          <div class="ctx-menu-item" data-action="new-tab" data-tooltip="Open a new blank tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-plus" style="width:16px;opacity:0.6;"></i> New Tab</div>
          <div class="ctx-menu-item" data-action="reload" data-tooltip="Reload the current tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-sync-alt" style="width:16px;opacity:0.6;"></i> Reload</div>
          <div class="ctx-menu-item" data-action="duplicate" data-tooltip="Create a copy of this tab with the same page" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-copy" style="width:16px;opacity:0.6;"></i> Duplicate Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          <div class="ctx-menu-item" data-action="mute-tab" data-tooltip="${tab.isMuted ? "Unmute this tab" : "Mute this tab"}" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid ${tab.isMuted ? "fa-volume-up" : "fa-volume-mute"}" style="width:16px;opacity:0.6;"></i> ${tab.isMuted ? "Unmute Tab" : "Mute Tab"}</div>
          <div class="ctx-menu-item" data-action="pin-tab" data-tooltip="${tab.isPinned ? "Unpin this tab" : "Pin this tab to keep it open"}" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-thumbtack" style="width:16px;opacity:0.6;"></i> ${tab.isPinned ? "Unpin Tab" : "Pin Tab"}</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          ${hasOther ? `<div class="ctx-menu-item" data-action="close-other" data-tooltip="Close all tabs except this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-times" style="width:16px;opacity:0.6;"></i> Close Other Tabs</div>` : ""}
          ${hasLeft ? `<div class="ctx-menu-item" data-action="close-left" data-tooltip="Close all tabs to the left of this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-arrow-left" style="width:16px;opacity:0.6;"></i> Close Tabs to Left</div>` : ""}
          ${hasRight ? `<div class="ctx-menu-item" data-action="close-right" data-tooltip="Close all tabs to the right of this one" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-arrow-right" style="width:16px;opacity:0.6;"></i> Close Tabs to Right</div>` : ""}
          <div class="ctx-menu-item" data-action="close-tab" data-tooltip="Close this tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-times-circle" style="width:16px;opacity:0.6;"></i> Close Tab</div>
          <div class="ctx-menu-sep" style="height:1px;background:var(--border);margin:4px 0;"></div>
          <div class="ctx-menu-item" data-action="reopen-closed" data-tooltip="Reopen the most recently closed tab" style="padding:8px 16px;cursor:pointer;color:var(--text);font-size:12px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-undo" style="width:16px;opacity:0.6;"></i> Reopen Closed Tab${closedTabs.length ? ` (${closedTabs.length})` : ""}</div>
        `;

        menu.querySelectorAll(".ctx-menu-item").forEach((item) => {
          item.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const action = item.dataset.action;
            if (action === "new-tab") createTab(true);
            else if (action === "reload") tab.frame.reload();
            else if (action === "duplicate") {
              createTab(true);
              const newTab = getActiveTab();
              if (newTab && tab.url) handleSubmit(tab.url);
            } else if (action === "mute-tab") {
              toggleTabMute(tab);
            } else if (action === "pin-tab") {
              tab.isPinned = !tab.isPinned;
              updateTabsUI();
            } else if (action === "close-tab") closeTab(tab.id);
            else if (action === "close-other") closeOtherTabs(tab.id);
            else if (action === "close-left") closeTabsToLeft(tab.id);
            else if (action === "close-right") closeTabsToRight(tab.id);
            else if (action === "reopen-closed") reopenLastClosedTab();
            closePanel();
          });
          item.addEventListener("mouseenter", () => (item.style.background = "var(--surface-hover)"));
          item.addEventListener("mouseleave", () => (item.style.background = ""));
        });

        document.body.appendChild(menu);

        const close = (ev) => {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener("click", close);
          }
        };
        setTimeout(() => document.addEventListener("click", close), 0);
      }

      const originalCloseTab = closeTab;
      closeTab = function (tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        const tab = tabs[idx];
        closedTabs.push({ url: tab.url, title: tab.title });
        if (closedTabs.length > 20) closedTabs.shift();
        originalCloseTab(tabId);
      };

      setupKeyboardShortcuts();

      function toggleBookmark() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html" || tab.url === "") return;

        const existingIndex = bookmarks.findIndex((b) => b.url === tab.url);
        if (existingIndex !== -1) {
          bookmarks.splice(existingIndex, 1);
        } else {
          bookmarks.push({ name: tab.title || tab.url, url: tab.url });
        }
        saveBookmarks();
        updateStarButton();
      }

      function updateStarButton() {
        const starBtn = document.getElementById("star-btn");
        if (!starBtn) return;
        const tab = getActiveTab();
        if (!tab || !tab.url) {
          starBtn.style.color = "var(--text-muted)";
          return;
        }
        const isBookmarked = bookmarks.some((b) => b.url === tab.url);
        starBtn.style.color = isBookmarked ? "var(--accent)" : "var(--text-muted)";
      }

      function exportBookmarksHtml() {
        if (bookmarks.length === 0) { alert("No bookmarks to export."); return; }
        var html = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
        bookmarks.forEach(function (b) {
          var name = (b.name || b.url).replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          html += '    <DT><A HREF="' + b.url.replace(/"/g, "&quot;") + '" ADD_DATE="' + Math.floor(Date.now() / 1000) + '">' + name + '</A>\n';
        });
        html += '</DL><p>\n';
        var blob = new Blob([html], { type: "text/html" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "bookmarks.html";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function importBookmarksHtml() {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = ".html,.htm";
        input.onchange = function (e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var text = ev.target.result;
            var count = 0;
            var regex = /<A\s+HREF="([^"]*)"[^>]*>([\s\S]*?)<\/A>/gi;
            var match;
            while ((match = regex.exec(text)) !== null) {
              var url = match[1].trim();
              var name = match[2].replace(/<[^>]+>/g, "").trim() || url;
              if (url && !bookmarks.some(function (b) { return b.url === url; })) {
                bookmarks.push({ name: name, url: url });
                count++;
              }
            }
            if (count > 0) {
              saveBookmarks();
              alert("Imported " + count + " bookmark(s).");
              var body = document.getElementById("yuki-page-body");
              if (body) body.innerHTML = renderYukiBookmarks();
              attachYukiHandlers("bookmarks");
            } else { alert("No new bookmarks found or all already exist."); }
          };
          reader.readAsText(file);
        };
        input.click();
      }

      const originalSwitchTab = switchTab;
      switchTab = function (tabId) {
        closeInContentPanel();
        originalSwitchTab(tabId);
        updateStarButton();
      };
    </script>

    <script>
      (function () {
        window.CLOAKS = {
          google: { title: "Google", icon: "/s/assets/google.ico" },
          classroom: {
            title: "Google Classroom",
            icon: "/s/assets/classroom.ico"
          },
          drive: {
            title: "My Drive - Google Drive",
            icon: "/s/assets/drive.png"
          },
          gmail: { title: "Gmail", icon: "/s/assets/gmail.ico" },
          ixl: { title: "IXL | Dashboard", icon: "/s/assets/ixl.png" },
          meet: { title: "Google Meet", icon: "/s/assets/meet.png" },
          docs: { title: "Document - Google Docs", icon: "/s/assets/docs.ico" },
          sheets: {
            title: "Spreadsheet - Google Sheets",
            icon: "/s/assets/sheets.ico"
          },
          slides: {
            title: "Presentation - Google Slides",
            icon: "/s/assets/slides.ico"
          }
        };

        window.DEFAULT_CLOAK = {
          title: "Markos's Classroom",
          icon: "/s/dogfavi.png"
        };

        function applyTabCloak() {
          try {
            var saved = localStorage.getItem("tabCloak");
            if (!saved) return;
            var data = JSON.parse(saved);
            if (!data || !data.title || !data.icon) return;
            document.title = data.title;
            var favicon = document.querySelector("link[rel='icon']");
            if (!favicon) {
              favicon = document.createElement("link");
              favicon.rel = "icon";
              document.head.appendChild(favicon);
            }
            favicon.href = data.icon;
          } catch (e) {}
        }

        applyTabCloak();

        window.applyCloakSelection = function (key) {
          var preset = window.CLOAKS[key] || window.DEFAULT_CLOAK;
          document.title = preset.title;
          var favicon = document.querySelector("link[rel='icon']");
          if (!favicon) {
            favicon = document.createElement("link");
            favicon.rel = "icon";
            document.head.appendChild(favicon);
          }
          favicon.href = preset.icon;
          localStorage.setItem(
            "tabCloak",
            JSON.stringify({
              key: key,
              title: preset.title,
              icon: preset.icon
            })
          );
          var status = document.getElementById("cloakStatus");
          if (status) status.textContent = "Current: " + preset.title;
        };
      })();
    </script>

    <div id="app"></div>
