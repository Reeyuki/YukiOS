<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser</title>
    <link rel="icon" href="/s/dogfavi.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="./scramjet.js"></script>
    <script src="./controller.api.js"></script>
    <script type="module">
      import { default as EpoxyTransport } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.mjs";
      import { default as LibcurlTransport } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/libcurl-transport@2.0.5/dist/index.mjs";
      window.EpoxyTransport = EpoxyTransport;
      window.LibcurlTransport = LibcurlTransport;
    </script>
    <style>
      :root {
        --bg: #080808;
        --surface: #101010;
        --surface-hover: #161616;
        --surface-active: #1e1e1e;
        --surface-glass: rgba(16, 16, 16, 0.85);
        --border: #1c1c1c;
        --border-light: #272727;
        --border-glow: rgba(255, 255, 255, 0.06);

        --text: #ececec;
        --text-muted: #5a5a5a;
        --text-dim: #3a3a3a;

        --accent: #e8e8e8;
        --accent-dim: rgba(232, 232, 232, 0.7);
        --accent-glow: rgba(255, 255, 255, 0.08);

        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --info: #3b82f6;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.7);

        --radius-sm: 5px;
        --radius-md: 9px;
        --radius-lg: 13px;
        --radius-full: 9999px;

        --transition-fast: 0.1s ease;
        --transition-normal: 0.18s ease;
        --transition-slow: 0.3s ease;

        --font-sans: "Geist", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "JetBrains Mono", monospace;

        --nav-height: 58px;
        --tabs-height: 48px;
        --chrome-height: calc(var(--nav-height) + var(--tabs-height) + 2px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }

      body,
      html,
      #app {
        font-family: var(--font-sans);
        width: 100vw;
        height: 100vh;
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .browser-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        padding: 10px 12px 0;
        gap: 4px;
        background: var(--bg);
        overflow: hidden;
        flex-shrink: 0;
        height: var(--tabs-height);
      }

      #tab-strip::-webkit-scrollbar {
        height: 6px;
      }
      #tab-strip::-webkit-scrollbar-track {
        background: transparent;
      }
      #tab-strip::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }
      #tab-strip::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        width: 200px;
        flex-shrink: 0;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        cursor: pointer;
        transition:
          background var(--transition-fast),
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
        position: relative;
      }

      .tab.tab-new {
        animation: tabPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tab.removing {
        animation: tabPopOut 0.2s ease forwards;
        pointer-events: none;
      }

      .tab:hover {
        background: var(--surface-hover);
      }

      .tab.active {
        background: var(--surface-hover);
        border-color: var(--border-light);
        box-shadow: inset 0 -3px 0 #3b82f6;
      }

      .tab.dragging {
        opacity: 0.5;
        border-style: dashed;
      }

      .tab.drag-over {
        border-left: 2px solid var(--brand, #888);
        margin-left: -1px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        flex-shrink: 0;
        opacity: 0.9;
      }

      .tab-title {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .tab-close {
        font-size: 15px;
        color: var(--text-muted);
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all var(--transition-fast);
        flex-shrink: 0;
        opacity: 0;
      }

      .tab:hover .tab-close {
        opacity: 1;
      }

      .tab-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        transform: scale(1.25) rotate(90deg);
      }

      .tab-close:active {
        transform: scale(0.85) rotate(90deg);
      }

      .new-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: 14px;
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .new-tab:hover {
        background: var(--surface);
        color: var(--text-muted);
        transform: rotate(90deg);
      }

      .new-tab:active {
        transform: rotate(90deg) scale(0.85);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        flex-shrink: 0;
      }

      .nav-btn-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 4px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-btn-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 14px;
      }

      .nav button:hover {
        background: var(--surface-hover);
        color: var(--text);
        transform: scale(1.06);
      }

      .nav button:active {
        animation: btnBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .address-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
      }

      .address-icon {
        position: absolute;
        left: 12px;
        color: var(--text-dim);
        font-size: 11px;
        pointer-events: none;
        z-index: 1;
      }

      input.bar {
        width: 100%;
        height: 42px;
        padding: 0 44px 0 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        color: var(--text);
        font-size: 13px;
        font-family: var(--font-sans);
        outline: none;
        transition: all var(--transition-normal);
        letter-spacing: -0.01em;
      }

      input.bar:focus {
        border-color: var(--border-light);
        background: var(--surface-hover);
        box-shadow: 0 0 0 3px var(--accent-glow);
        animation: pulseGlow 1.5s ease-in-out infinite;
      }

      input.bar::placeholder {
        color: var(--text-muted);
      }

      #star-btn {
        position: absolute;
        right: 42px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      #star-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      #home-btn-nav {
        position: absolute;
        right: 5px;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: all var(--transition-fast);
      }

      #home-btn-nav:hover {
        color: var(--text);
        background: var(--surface-active);
      }

      .omnibox-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        max-height: 320px;
        overflow-y: auto;
        margin-top: 2px;
        animation: slideDownBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .omnibox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        cursor: pointer;
        transition:
          background 0.1s,
          transform 0.12s;
      }

      .omnibox-item:active {
        transform: scale(0.97);
      }

      .omnibox-item:hover,
      .omnibox-item.selected {
        background: var(--surface-hover);
      }

      .omnibox-item-icon {
        width: 18px;
        text-align: center;
        flex-shrink: 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .omnibox-item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .omnibox-item-url {
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        flex-shrink: 1;
        margin-left: auto;
      }

      .nav-action-group {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 3px;
        position: relative;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .nav-action-group:hover {
        border-color: var(--border-light);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }

      .main-menu-wrapper {
        position: relative;
        display: flex;
      }

      .main-menu-wrapper .browser-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        min-width: 220px;
        z-index: 1000;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        margin-top: 4px;
        overflow: hidden;
        animation: menuDropIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes menuDropIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }

      .main-menu-wrapper .browser-dropdown.open {
        display: block;
      }

      .yuki-page-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: var(--bg);
        overflow-y: auto;
        z-index: 10;
      }
      .yuki-page-container .dino-page {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .yuki-page-container .dino-srcdoc {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .yuki-page-container .yuki-page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .yuki-page-container .yuki-back-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 16px;
        padding: 6px 8px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: all 0.15s;
        margin-right: 4px;
      }
      .yuki-page-container .yuki-back-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .yuki-page-container .yuki-page-header i {
        font-size: 18px;
        color: var(--text-muted);
        width: 24px;
        text-align: center;
      }
      .yuki-page-container .yuki-page-header h1 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        flex: 1;
      }
      .yuki-page-container .yuki-page-body {
        padding: 12px 16px;
      }
      .yuki-page-container .yuki-page-empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-dim);
        font-size: 14px;
      }
      .yuki-page-container .history-date {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        padding: 12px 8px 6px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .local-page-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: var(--bg);
        overflow: hidden;
        z-index: 5;
      }
      .local-page-frame {
        width: 100%;
        height: 100%;
        border: none;
        background: var(--bg);
      }
      .local-file-view {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .local-file-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .local-file-toolbar .local-file-name {
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .local-file-toolbar .local-file-mime {
        font-size: 11px;
        font-family: var(--font-mono);
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .local-file-body {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        min-height: 0;
      }
      .local-file-body.local-html-body {
        display: block;
        padding: 0;
      }
      .local-file-body img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .local-file-body video,
      .local-file-body audio {
        max-width: 100%;
        max-height: 100%;
      }
      .local-pdf-embed {
        width: 100%;
        height: 100%;
        border: none;
      }
      .local-text-body {
        align-items: stretch;
        padding: 0;
      }
      .local-text-view {
        width: 100%;
        margin: 0;
        padding: 14px 18px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--text);
        white-space: pre;
        overflow: auto;
        background: var(--surface);
      }
      .local-text-view .tok-key { color: #c4b5fd; }
      .local-text-view .tok-str { color: #a78bfa; }
      .local-text-view .tok-num { color: #ddd6fe; }
      .local-text-view .tok-bool { color: #ddd6fe; }
      .local-text-view .tok-cmt { color: #71707e; font-style: italic; }
      .local-text-view .tok-kw { color: #c4b5fd; }
      .local-text-view .tok-tag { color: #c4b5fd; }
      .local-text-view .tok-ent { color: #8b8a99; }
      .local-text-view .tok-at { color: #c4b5fd; }
      .local-text-view .tok-prop { color: #ddd6fe; }
      .local-text-view .tok-sel { color: #a78bfa; }
      .local-text-view .tok-md-head { color: #c4b5fd; font-weight: 700; }
      .local-text-view .tok-md-code { color: #a78bfa; }
      .local-text-view .tok-md-bold { color: #fff; font-weight: 700; }
      .local-text-view .tok-md-em { color: #ddd6fe; font-style: italic; }
      .local-error-view {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px;
        text-align: center;
      }
      .local-error-view .local-error-code {
        font-size: 40px;
        color: var(--text-dim);
      }
      .local-error-view .local-error-msg {
        font-size: 15px;
        color: var(--text);
      }
      .local-error-view .local-error-url {
        font-size: 12px;
        color: var(--text-dim);
        word-break: break-all;
      }
      .local-download-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        cursor: pointer;
      }
      .local-download-link:hover {
        color: var(--brand);
        border-color: var(--brand);
      }
      .yuki-page-container .panel-item,
      .yuki-page-container .history-entry {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.1s;
      }
      .yuki-page-container .panel-item:hover,
      .yuki-page-container .history-entry:hover {
        background: var(--surface-hover);
      }
      .yuki-page-container .panel-item-icon {
        font-size: 16px;
        width: 24px;
        text-align: center;
        flex-shrink: 0;
      }
      .yuki-page-container .panel-item-content {
        flex: 1;
        min-width: 0;
      }
      .yuki-page-container .panel-item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .panel-item-sub {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .panel-item-action {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 14px;
        padding: 4px 6px;
        border-radius: 4px;
      }
      .yuki-page-container .panel-item-action:hover {
        background: var(--surface-active);
        color: var(--error);
      }
      .yuki-page-container .he-favicon {
        width: 18px;
        height: 18px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .yuki-page-container .he-body { flex: 1; min-width: 0; }
      .yuki-page-container .he-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .he-meta {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yuki-page-container .he-time {
        font-size: 11px;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .yuki-page-container .yuki-search-bar {
        width: 100%;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 13px;
        margin-bottom: 8px;
        outline: none;
      }
      .yuki-page-container .yuki-search-bar:focus {
        border-color: var(--border-light);
      }

      .yuki-dialog-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.55);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .yuki-dialog-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
        min-width: 340px;
        max-width: 440px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.65);
      }
      .yuki-dialog-title {

      .yuki-settings-content {

        padding: 16px 20px;

        display: none;

      .yuki-settings-section.active {

        border: none;

        color: var(--text-muted);

        font-size: 12px;
        transition: all 0.15s;

      .pdf-viewer-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--surface-glass);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .pdf-viewer-toolbar .pdf-title {
        flex: 1;
        font-size: 13px;

        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

        justify-content: center;

        height: 30px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;

      .pdf-viewer-toolbar button:hover {
        background: var(--surface-hover);

      .pdf-viewer-toolbar .pdf-page-info {

        height: auto !important;
      }
      .pdf-viewer-body .office-pdf-page {
        margin: 10px auto;
        position: relative;
        box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        background: #fff;
      }
      .pdf-viewer-body .office-pdf-page canvas {
        display: block;
      }
      .pdf-viewer-body .pdf-loading {
        color: var(--text-muted);
        font-size: 14px;
        padding: 40px;
      }

      .browser-ad-bar {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px 12px;
        flex-shrink: 0;
        background: var(--surface-glass);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        z-index: 5;
      }
      .browser-ad-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-family: var(--font-mono);
      }
      .browser-ad-slot {
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 728px;
      }

      .iframe-container {
        flex: 1;
        position: relative;
        background: var(--bg);
        overflow: hidden;
      }

      .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        position: absolute;
        top: 0;
        left: 0;
      }

      .iframe-container iframe.hidden {
        display: none;
      }

      .iframe-container iframe.loading {
        filter: blur(12px) brightness(0.7);
        transition: filter 0.4s ease;
      }

      .message-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        color: var(--text);
        text-align: center;
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(8, 8, 8, 0.75);
        backdrop-filter: blur(20px) saturate(0.5);
        -webkit-backdrop-filter: blur(20px) saturate(0.5);
        z-index: 10;
        animation: fadeIn 0.25s ease;
      }

      .message-content {
        max-width: 360px;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
      }

      .message-content h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .message-content p {
        color: var(--text-muted);
        font-size: 12px;
        word-break: break-all;
        font-family: var(--font-mono);
        line-height: 1.6;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 20px;
      }

      #skip-btn {
        margin-top: 20px;
        padding: 7px 18px;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-full);
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font-sans);
        transition: all var(--transition-normal);
        display: none;
        letter-spacing: -0.01em;
      }

      #skip-btn.show {
        display: inline-block;
        animation: bounceIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #skip-btn:hover {
        border-color: var(--accent-dim);
        color: var(--text);
        background: var(--surface-hover);
      }

      .tab-spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bounceIn {
        0% {
          transform: scale(0.92);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes tabPopIn {
        0% {
          transform: scale(0.95) translateX(-8px);
          opacity: 0;
        }
        100% {
          transform: scale(1) translateX(0);
          opacity: 1;
        }
      }

      @keyframes tabPopOut {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.85) translateX(16px);
          opacity: 0;
        }
      }

      @keyframes slideInRight {
        0% {
          transform: translateX(28px);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fadeSlideUp {
        0% {
          transform: translateY(12px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes ripple {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.15);
        }
        100% {
          box-shadow: 0 0 0 16px rgba(255, 255, 255, 0);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--accent-glow);
        }
        50% {
          box-shadow: 0 0 0 6px var(--accent-glow);
        }
      }

      @keyframes bookmarkDrop {
        0% {
          transform: translateY(-100%);
          opacity: 0;
          max-height: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
          max-height: 40px;
        }
      }

      @keyframes btnBounce {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.92);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes slideDownBounce {
        0% {
          transform: translateY(-8px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      function sendToParent(msg) {
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage(msg, "*");
          } catch (e) {}
        }
      }

      function applyTheme(vars) {
        if (!vars) return;
        const root = document.documentElement;
        const m = {
          "--brand": "--accent",
          "--text-primary": "--text",
          "--text-secondary": "--text-muted",
          "--text-muted": "--text-dim",
          "--bg-primary": "--bg",
          "--bg-secondary": "--bg",
          "--surface-1": "--surface",
          "--surface-hover": "--surface-hover",
          "--surface-2": "--surface-active",
          "--glass-border": "--border",
          "--error": "--error",
          "--success": "--success",
          "--warning": "--warning",
          "--font-ui": "--font-sans",
          "--font-mono": "--font-mono"
        };
        Object.entries(m).forEach(([src, dst]) => {
          if (vars[src]) root.style.setProperty(dst, vars[src]);
        });
        if (vars["--bg-primary"]) {
          root.style.setProperty("--border-light", vars["--bg-primary"]);
          root.style.setProperty("--accent-dim", adjustAlpha(vars["--text-primary"] || "#ececec", 0.7));
          root.style.setProperty("--accent-glow", adjustAlpha(vars["--brand"] || "#e8e8e8", 0.08));
        }
      }

      function adjustAlpha(color, alpha) {
        if (color.startsWith("rgba")) return color.replace(/[\d.]+\)$/, alpha + ")");
        if (color.startsWith("rgb")) return color.replace("rgb", "rgba").replace(")", "," + alpha + ")");
        return color;
      }

      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || !data.type) return;
        if (data.type === "scram:init") {
          isEmbedded = true;
          if (data.vars) applyTheme(data.vars);
          if (data.adsEnabled) enableBrowserAds();
          else disableBrowserAds();
          if (isIncognito) return;
          if (Array.isArray(data.bookmarks)) {
            bookmarks = data.bookmarks;
            saveBookmarks();
            renderBookmarkBar();
            updateStarButton();
          }
          if (Array.isArray(data.history)) {
            history = data.history;
          }
          if (data.wispUrl) {
            hostWispUrl = data.wispUrl;
            localStorage.setItem("proxServer", data.wispUrl);
          }
          if (data.transport) {
            hostTransport = data.transport;
            localStorage.setItem("proxTransport", data.transport);
          }
          if (data.dinoGameHtml) {
            yukiDinoGameHtml = data.dinoGameHtml;
          }
        }
        if (data.type === "scram:torMode") {
          torEnabled = data.active;
          const toggle = document.getElementById("set-tor-enabled");
          if (toggle) toggle.checked = torEnabled;
        }
        if (data.type === "browser-audio-playing") {
          const tab = getActiveTab();
          if (tab) {
            tab.isPlayingAudio = data.playing;
            updateTabsUI();
          }
        }
      });

      function enableBrowserAds() {
        var bar = document.getElementById("browser-ad-bar");
        var slot = document.getElementById("browser-ad-slot");
        if (!bar || !slot) return;
        if (slot.getAttribute("data-ads-loaded") === "1") {
          bar.style.display = "flex";
          return;
        }
        slot.setAttribute("data-ads-loaded", "1");
        var cfg = document.createElement("script");
        cfg.text = "atOptions = { 'key': '28c33f91ee21bcf1063e489aae3024f8', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };";
        slot.appendChild(cfg);
        var inv = document.createElement("script");
        inv.async = true;
        inv.src = "https://www.highperformanceformat.com/28c33f91ee21bcf1063e489aae3024f8/invoke.js";
        slot.appendChild(inv);
        bar.style.display = "flex";
      }

      function disableBrowserAds() {
        var bar = document.getElementById("browser-ad-bar");
        var slot = document.getElementById("browser-ad-slot");
        if (bar) bar.style.display = "none";
        if (slot) {
          slot.removeAttribute("data-ads-loaded");
          slot.innerHTML = "";
        }
      }

      function loadPrefs() {
        isIncognito = new URLSearchParams(window.location.search).get("incognito") === "true";
        isEmbedded = window.parent && window.parent !== window;

        if (!isIncognito && !isEmbedded) {
          try {
            bookmarks = JSON.parse(localStorage.getItem(STORAGE_KEYS.BOOKMARKS) || "[]");
            history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || "[]");
            downloads = JSON.parse(localStorage.getItem(STORAGE_KEYS.DOWNLOADS) || "[]");
            zoomLevel = parseFloat(localStorage.getItem(STORAGE_KEYS.ZOOM)) || 1.0;
            darkModeEnabled = localStorage.getItem(STORAGE_KEYS.DARKMODE) === "true";
            darkModeExclusions = JSON.parse(localStorage.getItem(STORAGE_KEYS.DARK_EXCLUSIONS) || "{}");
            searchEngineKey = localStorage.getItem(STORAGE_KEYS.SEARCH_ENGINE) || "brave";
            homepageUrl = localStorage.getItem(STORAGE_KEYS.HOMEPAGE) || "NT.html";
            restoreTabs = localStorage.getItem(STORAGE_KEYS.RESTORE_TABS) === "true";
            bookmarkBarVisible = localStorage.getItem(STORAGE_KEYS.BOOKMARKBAR_VISIBLE) !== "false";
            confirmCloseTabs = localStorage.getItem(STORAGE_KEYS.CONFIRM_CLOSE_TABS) === "true";
            searchSuggestionsEnabled = localStorage.getItem(STORAGE_KEYS.SEARCH_SUGGESTIONS) !== "false";
            clearOnExit = localStorage.getItem(STORAGE_KEYS.CLEAR_ON_EXIT) === "true";
            defaultZoom = parseFloat(localStorage.getItem(STORAGE_KEYS.DEFAULT_ZOOM)) || 1.0;
            tabBehaviorNext = localStorage.getItem(STORAGE_KEYS.TAB_BEHAVIOR) !== "false";
            autoplayBlock = localStorage.getItem(STORAGE_KEYS.AUTOPLAY_BLOCK) === "true";
            searchRegion = localStorage.getItem(STORAGE_KEYS.SEARCH_REGION) || "";
            torEnabled = localStorage.getItem(STORAGE_KEYS.TOR_ENABLED) === "true";
          } catch (e) {
            console.error("Failed to load prefs:", e);
          }
        }
      }

      function saveBookmarks() {
        if (isIncognito) return;
        if (isEmbedded) {
          sendToParent({ type: "scram:setBookmarks", bookmarks: bookmarks.slice() });
        } else {
          try {
            localStorage.setItem(STORAGE_KEYS.BOOKMARKS, JSON.stringify(bookmarks));
          } catch (e) {}
        }
        renderBookmarkBar();
        updateStarButton();
      }

      function saveHistory() {
        if (isIncognito) return;
        if (isEmbedded) {
          sendToParent({ type: "scram:setHistory", history: history.slice(-500) });
        } else {
          try {
            localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history.slice(-500)));
          } catch (e) {}
        }
      }
      function updateMenuBadges() {
        const dlBadge = document.getElementById("menu-dl-badge");
        if (dlBadge) {
          if (downloads.length > 0) {
            dlBadge.textContent = downloads.length;
            dlBadge.style.display = "";
          } else {
            dlBadge.style.display = "none";
          }
        }
        const rtBadge = document.getElementById("menu-rt-badge");
        if (rtBadge) {
          if (closedTabs.length > 0) {
            rtBadge.textContent = closedTabs.length;
            rtBadge.style.display = "";
          } else {
            rtBadge.style.display = "none";
          }
        }
      }
      function saveDownloads() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.DOWNLOADS, JSON.stringify(downloads));
        } catch (e) {}
        updateMenuBadges();
      }

      function savePrefs() {
        if (isIncognito) return;
        try {
          localStorage.setItem(STORAGE_KEYS.ZOOM, String(zoomLevel));
          localStorage.setItem(STORAGE_KEYS.DARKMODE, String(darkModeEnabled));
          localStorage.setItem(STORAGE_KEYS.DARK_EXCLUSIONS, JSON.stringify(darkModeExclusions));
          localStorage.setItem(STORAGE_KEYS.SEARCH_ENGINE, searchEngineKey);
          localStorage.setItem(STORAGE_KEYS.HOMEPAGE, homepageUrl);
          localStorage.setItem(STORAGE_KEYS.RESTORE_TABS, String(restoreTabs));
          localStorage.setItem(STORAGE_KEYS.BOOKMARKBAR_VISIBLE, String(bookmarkBarVisible));
          localStorage.setItem(STORAGE_KEYS.CONFIRM_CLOSE_TABS, String(confirmCloseTabs));
          localStorage.setItem(STORAGE_KEYS.SEARCH_SUGGESTIONS, String(searchSuggestionsEnabled));
          localStorage.setItem(STORAGE_KEYS.CLEAR_ON_EXIT, String(clearOnExit));
          localStorage.setItem(STORAGE_KEYS.DEFAULT_ZOOM, String(defaultZoom));
          localStorage.setItem(STORAGE_KEYS.TAB_BEHAVIOR, String(tabBehaviorNext));
          localStorage.setItem(STORAGE_KEYS.AUTOPLAY_BLOCK, String(autoplayBlock));
          localStorage.setItem(STORAGE_KEYS.SEARCH_REGION, searchRegion);
          localStorage.setItem(STORAGE_KEYS.TOR_ENABLED, String(torEnabled));
        } catch (e) {}
      }

      function saveTabState() {
        if (isIncognito || isEmbedded || tabs.length === 0) return;
        try {
          const state = tabs.map((t) => ({ url: t.url, title: t.title }));
          localStorage.setItem(STORAGE_KEYS.TAB_STATE, JSON.stringify(state));
        } catch (e) {}
      }

      function restoreTabState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.TAB_STATE) || "[]");
          if (saved.length > 0) {
            saved.forEach((s, i) => {
              const tab = createTab(i === 0);
              if (s.url && s.url !== "NT.html" && !s.url.startsWith("yuki://")) {
                if (isLocalNavigation(s.url)) loadLocalPage(s.url);
                else tab.frame.go(s.url);
              }
            });
            return true;
          }
        } catch (e) {}
        return false;
      }

      function addToHistory(url, title) {
        if (isIncognito) return;
        history.push({ url, title: title || url, time: Date.now() });
        if (isEmbedded) {
          sendToParent({ type: "scram:addHistory", url, title: title || url });
        }
        saveHistory();
      }

      document.addEventListener("DOMContentLoaded", async function () {
        let basePath = location.pathname.replace(/[^/]*$/, "");
        if (!basePath.endsWith("/")) basePath += "/";

        if ("serviceWorker" in navigator) {
          const reg = await navigator.serviceWorker.register(basePath + "sw.js", { scope: basePath });
          await navigator.serviceWorker.ready;
          const sw = reg.active || navigator.serviceWorker.controller;

          const wispUrl = hostWispUrl || localStorage.getItem("proxServer") || DEFAULT_WISP;
          const transportType = hostTransport || localStorage.getItem("proxTransport") || DEFAULT_TRANSPORT;

          let TransportClass;
          if (transportType === "libcurl" && typeof LibcurlTransport !== "undefined") {
            TransportClass = LibcurlTransport;
          } else if (typeof EpoxyTransport !== "undefined") {
            TransportClass = EpoxyTransport;
          }

          if (TransportClass) {
            const rawTransport = new TransportClass({ wisp: wispUrl });
            const transport = {
              get ready() { return rawTransport.ready; },
              async init() { return rawTransport.init(); },
              async request(remote, method, body, headers, signal) {
                const headersArr = Array.isArray(headers)
                  ? headers
                  : headers && typeof headers === "object"
                    ? Object.entries(headers)
                    : [];
                const res = await rawTransport.request(remote, method, body, headersArr, signal);
                const headersOut = Array.isArray(res.headers)
                  ? res.headers
                  : res.headers && typeof res.headers === "object"
                    ? Object.entries(res.headers)
                    : [];
                return { ...res, headers: headersOut };
              },
              connect(url, protocols, requestHeaders, onopen, onmessage, onclose, onerror) {
                const headersArr = Array.isArray(requestHeaders)
                  ? requestHeaders
                  : requestHeaders && typeof requestHeaders === "object"
                    ? Object.entries(requestHeaders)
                    : [];
                return rawTransport.connect(url, protocols, headersArr, onopen, onmessage, onclose, onerror);
              }
            };
            window.__scramjetTransport = transport;

            const { Controller } = $scramjetController;
            scramjet = new Controller({
              config: {
                prefix: basePath + "scramjet/",
                wasmPath: basePath + "scramjet.wasm",
                scramjetPath: basePath + "scramjet.js",
                injectPath: basePath + "controller.inject.js"
              },
              transport,
              serviceworker: sw
            });

            await scramjet.wait();
          }

            if (els.length) {
              els.forEach((el) => el.remove());
              observer.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      });

      function createTab(makeActive = true) {
        const frame = scramjet.createFrame();
        const requiredPerms = [
          "allow-scripts",
          "allow-same-origin",
          "allow-forms",
          "allow-popups",
          "allow-top-navigation-by-user-activation",
          "allow-modals",
          "allow-fullscreen"
        ];
        const existing = (frame.element.getAttribute("sandbox") || "").split(/\s+/).filter(Boolean);
        const combined = [...new Set([...existing, ...requiredPerms])].join(" ");
        frame.element.setAttribute("sandbox", combined);
        const tab = {
          id: nextTabId++,
          title: "Home",
          url: "yuki://home",
          frame: frame,
          loading: false,
          favicon: null,
          skipTimeout: null,
          isPlayingAudio: false,
          isPinned: false,
          isMuted: false,
          localStack: [],
          localIndex: -1,
        };
        _newTabId = tab.id;

        const wrapFrameGo = (f, t) => {
          const orig = f.go.bind(f);
          f.go = (url) => {
            t.loading = true;
            if (url && url.includes("NT.html")) {
              t.title = "Home";
              t.url = "yuki://home";
              t.favicon = null;
              renderNewTab(f.element, url.indexOf("incognito") >= 0);
              if (t.id === activeTabId) showIframeLoading(false);
              updateTabsUI();
              updateAddressBar();
              updateLoadingBar(t, 100);
              if (t.skipTimeout) clearTimeout(t.skipTimeout);
              return;
            }
            if (!url.includes("NT.html")) {
              t.url = url;
              try {
                const urlObj = new URL(url);
                t.title = urlObj.hostname;
                t.favicon = getFaviconUrl(urlObj.hostname);
                addToHistory(url, t.title);
              } catch {
                t.title = url.split("/").pop() || url;
                t.favicon = null;
              }
            }
            if (t.id === activeTabId) showIframeLoading(true, t.url);
            updateTabsUI();
            updateAddressBar();
            updateLoadingBar(t, 10);
            if (t.skipTimeout) clearTimeout(t.skipTimeout);
            t.skipTimeout = setTimeout(() => {
              if (t.loading && t.id === activeTabId) {
                const skipBtn = document.getElementById("skip-btn");
                if (skipBtn) skipBtn.classList.add("show");
              }
            }, 1000);
            orig(url);
          };
        };
        wrapFrameGo(frame, tab);

        if (isIncognito) renderNewTab(frame.element, true);
        else renderNewTab(frame.element, false);

        frame.element.addEventListener("load", () => {
          tab.loading = false;
          if (tab.skipTimeout) clearTimeout(tab.skipTimeout);
          if (tab.id === activeTabId) showIframeLoading(false);

          injectAudioDetector(frame.element);
          if (autoplayBlock) injectAutoplayBlocker(frame.element);
          if (darkModeEnabled) applyDarkModeToTab(tab);
          if (zoomLevel !== 1) applyZoomToTab(tab);

          try {
            const title = frame.element.contentWindow.document.title;
            if (title) tab.title = title;
          } catch {}

          try {
            if (tab.url === "yuki://home") {
              tab.title = "Home";
              tab.favicon = null;
            }
          } catch {}

          try {
            const doc = frame.element.contentWindow.document;
            const bodyText = (doc.body ? doc.body.textContent || "" : "").trim();
            if (tab.url && !tab.url.includes("NT.html") && bodyText.indexOf("Internal Service Worker Error") === 0) {
              frame.element.srcdoc = buildProxyOfflineHtml(tab.url);
              tab.title = "This site can't be reached";
              tab.loading = false;
              if (tab.id === activeTabId) showIframeLoading(false);
              updateTabsUI();
              updateAddressBar();
              updateLoadingBar(tab, 100);
              return;
            }
          } catch {}

          updateTabsUI();
          updateAddressBar();
          updateLoadingBar(tab, 100);
        });

        if (tabBehaviorNext && makeActive && activeTabId) {
          const activeIdx = tabs.findIndex((t) => t.id === activeTabId);
          if (activeIdx >= 0) tabs.splice(activeIdx + 1, 0, tab);
          else tabs.push(tab);
        } else {
          tabs.push(tab);
        }
        document.getElementById("iframe-container").appendChild(frame.element);
        if (defaultZoom !== 1.0) applyZoomToTab(tab);
        if (makeActive) switchTab(tab.id);
        saveTabState();
        return tab;
      }

      function showIframeLoading(show, url = "") {
        const loader = document.getElementById("loading");
        const title = document.getElementById("loading-title");
        const urlText = document.getElementById("loading-url");
        const skipBtn = document.getElementById("skip-btn");

        if (loader) {
          loader.style.display = show ? "flex" : "none";
          const tab = getActiveTab();
          if (tab) tab.frame.element.classList.toggle("loading", show);
          if (show) {
            title.textContent = "Connecting";
            urlText.textContent = url || "Loading content...";
            skipBtn.classList.remove("show");
          }
        }
      }

      function switchTab(tabId) {
        if (_yukiActive) closeYukiPage();
        if (_localActive) closeLocalPage();
        activeTabId = tabId;
        const tab = getActiveTab();
        tabs.forEach((t) => t.frame.element.classList.toggle("hidden", t.id !== tabId));
        if (tab) showIframeLoading(tab.loading, tab.url);
        updateTabsUI();
        updateAddressBar();
      }

      function closeTab(tabId) {
        const idx = tabs.findIndex((t) => t.id === tabId);
        if (idx === -1) return;
        if (confirmCloseTabs && tabs.length > 1) {
          if (!confirm(`Close "${tabs[idx].title}"?`)) return;
        }
        const closed = tabs[idx];
        if (closed.url && closed.url !== "NT.html") {
          closedTabs.push({ url: closed.url, title: closed.title });
          if (closedTabs.length > 20) closedTabs.shift();
        }
        if (closed.skipTimeout) clearTimeout(closed.skipTimeout);

        const tabEl = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tabEl) {
          tabEl.classList.add("removing");
          setTimeout(() => {
            closed.frame.element.remove();
            tabs.splice(idx, 1);
            if (activeTabId === tabId) {
              if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
              else createTab(true);
            } else {
              updateTabsUI();
            }
            saveTabState();
            updateMenuBadges();
          }, 200);
        } else {
          closed.frame.element.remove();
          tabs.splice(idx, 1);
          if (activeTabId === tabId) {
            if (tabs.length > 0) switchTab(tabs[Math.max(0, idx - 1)].id);
            else createTab(true);
          } else {
            updateTabsUI();
          }
          saveTabState();
          updateMenuBadges();
        }
      }

      function getFaviconUrl(hostname) {
        if (faviconCache.has(hostname)) return faviconCache.get(hostname);
        const url = `https://www.google.com/s2/favicons?domain=${hostname}&sz=32`;
        faviconCache.set(hostname, url);
        return url;
      }

      function renderNewTab(frameElement, incognito) {
        frameElement.removeAttribute("src");
        frameElement.srcdoc = incognito
          ? "<!doctype html><script>window.ntIncognito = true;</scr" + "ipt>" + bundledNewTabHtml
          : bundledNewTabHtml;
      }

      let dragSrcIdx = -1;

      function tabSignature(tab) {
        return [tab.isPinned, tab.loading, tab.favicon, tab.title, tab.isPlayingAudio, tab.isMuted].join("|");
      }

      function buildTabElement(tab, idx) {
        const container = document.getElementById("tab-strip");
        const el = document.createElement("div");
        el.className = `tab ${tab.id === activeTabId ? "active" : ""}`;
        el.draggable = true;
        el.dataset.tooltip = tab.title;
        el.dataset.tabId = tab.id;

        let iconHtml = "";
        if (tab.isPinned) {
          iconHtml = tab.favicon ? `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">` : `<i class="fa-solid fa-thumbtack" style="font-size:12px;opacity:0.6;"></i>`;
        } else if (tab.loading) {
          iconHtml = `<div class="tab-spinner"></div>`;
        } else if (tab.favicon) {
          iconHtml = `<img src="${tab.favicon}" class="tab-favicon" onerror="this.style.display='none'">`;
        }

        const audioIcon = tab.isPlayingAudio
          ? `<span class="tab-audio-icon" data-tab-id="${tab.id}" data-action="toggle-mute" style="font-size:10px;margin-left:4px;cursor:pointer;">${tab.isMuted ? "🔇" : "🔊"}</span>`
          : "";

        var innerHtml = tab.isPinned ? iconHtml : (
          iconHtml +
          '<span class="tab-title">' + tab.title + '</span>' +
          audioIcon +
          '<span class="tab-close">&times;</span>'
        );
        el.innerHTML = innerHtml;

        el.onclick = () => switchTab(tab.id);
        if (!tab.isPinned) {
          el.querySelector(".tab-close").onclick = (e) => {
            e.stopPropagation();
            if (!tab.isPinned) closeTab(tab.id);
          };
        }
        var ai = el.querySelector(".tab-audio-icon");
        if (ai) ai.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleTabMute(tab);
        });
        el.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          openTabContextMenu(tab, e);
        });

        el.addEventListener("dragstart", (e) => {
          dragSrcIdx = idx;
          e.dataTransfer.effectAllowed = "move";
          el.classList.add("dragging");
        });
        el.addEventListener("dragend", () => {
          el.classList.remove("dragging");
          container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
        });
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
          el.classList.add("drag-over");
        });
        el.addEventListener("dragleave", () => {
          el.classList.remove("drag-over");
        });
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          container.querySelectorAll(".tab").forEach((t) => t.classList.remove("drag-over"));
          if (dragSrcIdx === -1 || dragSrcIdx === idx) return;
          const [movedTab] = tabs.splice(dragSrcIdx, 1);
          tabs.splice(idx, 0, movedTab);
          if (activeTabId === movedTab.id) {
            updateTabsUI();
          } else {
            const containerEls = container.querySelectorAll(".tab");
            if (containerEls[dragSrcIdx]) containerEls[dragSrcIdx].classList.remove("dragging");
            updateTabsUI();
            switchTab(movedTab.id);
          }
          saveTabState();
          dragSrcIdx = -1;
        });

        el.addEventListener("mousedown", (e) => {
          if (e.button === 1) {
            e.preventDefault();
            e.stopPropagation();
            closeTab(tab.id);
          }
        });

        el.__sig = tabSignature(tab);
        return el;
      }

      function updateTabsUI() {
        const container = document.getElementById("tab-strip");
        const els = new Map();
        container.querySelectorAll(".tab").forEach((el) => els.set(Number(el.dataset.tabId), el));

        tabs.forEach((tab, idx) => {
          let el = els.get(tab.id);
          const ref = Array.from(container.children).filter((c) => !c.classList.contains("new-tab"))[idx];
          if (!el) {
            el = buildTabElement(tab, idx);
            container.insertBefore(el, ref);
          } else if (el.__sig !== tabSignature(tab) || ref !== el) {
            const fresh = buildTabElement(tab, idx);
            el.replaceWith(fresh);
            if (ref !== el) container.insertBefore(fresh, ref);
            el = fresh;
          } else {
            el.classList.toggle("active", tab.id === activeTabId);
            el.dataset.tooltip = tab.title;
          }
          els.delete(tab.id);
        });

        els.forEach((el) => el.remove());

        if (_newTabId !== null) {
          const newEl = container.querySelector(`.tab[data-tab-id="${_newTabId}"]`);
          if (newEl) {
            newEl.classList.add("tab-new");
            newEl.addEventListener("animationend", () => newEl.classList.remove("tab-new"), { once: true });
          }
          _newTabId = null;
        }

        let newBtn = container.querySelector("button.new-tab");
        if (!newBtn) {
          newBtn = document.createElement("button");
          newBtn.className = "new-tab";
          newBtn.dataset.tooltip = "Open a new blank tab";
          newBtn.innerHTML = "<i class='fa-solid fa-plus'></i>";
          newBtn.onclick = () => createTab(true);
        }
        container.appendChild(newBtn);
      }

      function updateAddressBar() {
        const bar = document.getElementById("address-bar");
        const tab = getActiveTab();
        if (bar && tab) {
          var displayUrl = tab.url;
          if (displayUrl === "NT.html") displayUrl = "yuki://home";
          bar.value = displayUrl && displayUrl !== "NT.html" ? displayUrl : "";
        }
      }

      function getActiveTab() {
        return tabs.find((t) => t.id === activeTabId);
      }

      function resolveSearchEngine(key) {
        if (SEARCH_ENGINES[key]) return SEARCH_ENGINES[key];
        const custom = getCustomSearchEngines();
        const idx = key.startsWith("custom_") ? parseInt(key.slice(7)) : -1;
        if (idx >= 0 && custom[idx]) return custom[idx];
        return SEARCH_ENGINES.brave;
      }

      function handleSubmit(url) {
        closeInContentPanel();
        const tab = getActiveTab();
        let input = url || document.getElementById("address-bar").value.trim();
        if (!input) return;
        input = normalizeLocalInput(input);
        if (isLocalNavigation(input)) {
          loadLocalPage(input);
          saveTabState();
          return;
        }
        if (input.startsWith("yuki://")) {
          var page = input.replace("yuki://", "");
          navigateToYukiPage(page);
          return;
        }
        if (!input.startsWith("http")) {
          if (input.includes(".") && !input.includes(" ")) input = "https://" + input;
          else {
            let engine = resolveSearchEngine(searchEngineKey);
            let engineUrl = engine.url;
            if (searchRegion && engine.regionParam) {
              const sep = engineUrl.includes("?") ? "&" : "?";
              engineUrl += sep + engine.regionParam + "=" + encodeURIComponent(searchRegion);
            }
            input = engineUrl + encodeURIComponent(input);
          }
        }
        if (_yukiActive) closeYukiPage();
        if (torEnabled && isEmbedded) {
          sendToParent({ type: "scram:navigate", url: input });
          saveTabState();
          return;
        }

        if (/\.pdf($|\?)/i.test(input)) {
          tab.url = input;
          tab.title = "PDF Document";
          updateTabsUI();
          updateAddressBar();
          openPdfViewer(input);
          return;
        }

        tab.frame.go(input);
        saveTabState();
      }

      function updateLoadingBar(tab, percent) {
        if (tab.id !== activeTabId) return;
        const bar = document.getElementById("loading-bar");
        bar.style.width = percent + "%";
        bar.style.opacity = percent === 100 ? "0" : "1";
        if (percent === 100)
          setTimeout(() => {
            bar.style.width = "0%";
          }, 200);
      }

      function getCustomSearchEngines() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES) || "[]");
        } catch {
          return [];
        }
      }
      function saveCustomSearchEngines(arr) {
        localStorage.setItem(STORAGE_KEYS.CUSTOM_SEARCH_ENGINES, JSON.stringify(arr));
      }
      function getAllSearchEngines() {
        return { ...SEARCH_ENGINES, ...Object.fromEntries(getCustomSearchEngines().map((e, i) => ["custom_" + i, e])) };
      }
      function renderCustomSearchEngines() {
        const list = document.getElementById("custom-engine-list");
        if (!list) return;
        const engines = getCustomSearchEngines();
        if (engines.length === 0) {
          list.innerHTML =
            '<div style="color:var(--text-dim);font-size:13px;">No custom search engines added yet.</div>';
          return;
        }
        list.innerHTML = engines
          .map(
            (e, i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);">${e.name}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this custom search engine" onclick="removeCustomSearchEngine(${i})" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCustomSearchEngine() {
        const name = prompt("Search engine name:");
        if (!name) return;
        let url = prompt(
          "Search URL (use {search} as placeholder for query, e.g. https://example.com/search?q={search}):"
        );
        if (!url) return;
        if (!url.includes("{search}")) {
          alert("URL must contain {search} placeholder.");
          return;
        }
        const engines = getCustomSearchEngines();
        engines.push({ name, url: url.replace("{search}", "") });
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function removeCustomSearchEngine(idx) {
        const engines = getCustomSearchEngines();
        engines.splice(idx, 1);
        saveCustomSearchEngines(engines);
        renderCustomSearchEngines();
      }
      function renderDarkExclusions() {
        const list = document.getElementById("dark-exclusion-list");
        if (!list) return;
        const hosts = Object.keys(darkModeExclusions);
        if (hosts.length === 0) {
          list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">No sites excluded from dark mode.</div>';
          return;
        }
        list.innerHTML = hosts
          .map(
            (h) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:13px;color:var(--text);"><i class="fa-solid fa-globe" style="width:14px;color:var(--text-muted);"></i> ${h}</span>
            <button class="settings-icon-btn" data-tooltip="Remove this site from dark mode exclusions" onclick="removeDarkExclusion('${h}')" style="color:var(--error);font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `
          )
          .join("");
      }
      function addCurrentToDarkExclusion() {
        const tab = getActiveTab();
        if (!tab || !tab.url || tab.url === "NT.html") {
          alert("No active page to exclude.");
          return;
        }
        try {
          const host = new URL(tab.url).hostname;
          darkModeExclusions[host] = true;
          savePrefs();
          renderDarkExclusions();
          applyDarkModeToTab(tab);
        } catch {
          alert("Invalid URL.");
        }
      }
      function removeDarkExclusion(host) {
        delete darkModeExclusions[host];
        savePrefs();
        renderDarkExclusions();
        const tab = getActiveTab();
        if (tab) applyDarkModeToTab(tab);
      }

      var _yukiActive = false;

      function normalizeLocalInput(input) {
        var t = String(input || "").trim();
        if (!t || /^https?:\/\//i.test(t)) return t;
        if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(\/|$)/i.test(t)) return "http://" + t;
        return t;
      }

      function isLocalNavigation(input) {
        var t = String(input || "").trim();
        if (!t) return false;
        if (t.indexOf("fs://") === 0 || t.indexOf("file://") === 0) return true;
        if (t.indexOf("/") === 0) return true;
        if (/^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(\/|$)/i.test(t)) return true;
        if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0):\d+(\/|$)/i.test(t)) return true;
        return false;
      }

      function localTargetLabel(url) {
        var parts = String(url).split(/[\\/?#]/).filter(Boolean);
        return parts.length ? parts[parts.length - 1] : url;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/'/g, "&#39;");
      }

      function loadLocalPage(url, opts) {
        opts = opts || {};
        var tab = getActiveTab();
        if (!tab) return;
        if (_yukiActive) closeYukiPage();
        if (_localActive && !opts.force && tab.url === url) return;
        if (!opts.fromHistory && !opts.reload) {
          tab.localStack = tab.localStack.slice(0, (tab.localIndex != null ? tab.localIndex : -1) + 1);
          tab.localStack.push({ url: url, title: localTargetLabel(url) });
          tab.localIndex = tab.localStack.length - 1;
        } else if (opts.fromHistory) {
          tab.localStack[tab.localIndex] = { url: url, title: localTargetLabel(url) };
        }
        tab._localPrevUrl = tab.url;
        tab._localPrevTitle = tab.title;
        tab.url = url;
        tab.title = localTargetLabel(url);
        tab.loading = false;
        _localActive = true;
        tabs.forEach(function (t) {
          t.frame.element.classList.add("hidden");
        });
        var cont = document.getElementById("local-page-container");
        if (cont) {
          cont.style.display = "block";
          cont.innerHTML = "";
        }
        addToHistory(url, tab.title);
        updateAddressBar();
        updateTabsUI();
        showIframeLoading(true, url);
        saveTabState();
        requestLocalContent(url)
          .then(function (res) {
            var current = getActiveTab();
            if (!current || current.url !== url) return;
            showIframeLoading(false);
            renderLocalContent(url, res);
          })
          .catch(function (err) {
            var current = getActiveTab();
            if (!current || current.url !== url) return;
            showIframeLoading(false);
            renderLocalError(url, "Could not load " + url + ": " + (err && err.message ? err.message : err));
          });
      }

      function requestLocalContent(url) {
        return new Promise(function (resolve, reject) {
          var id = ++_localReqId;
          _localPending[id] = { resolve: resolve, reject: reject };
          sendToParent({ type: "scram:localRequest", url: url, id: id });
          setTimeout(function () {
            if (_localPending[id]) {
              delete _localPending[id];
              reject(new Error("Request timed out"));
            }
          }, 20000);
        });
      }

      function closeLocalPage() {
        _localActive = false;
        var cont = document.getElementById("local-page-container");
        if (cont) {
          cont.style.display = "none";
          cont.innerHTML = "";
        }
        var tab = getActiveTab();
        if (tab) {
          if (tab._localPrevUrl) {
            tab.url = tab._localPrevUrl;
            tab.title = tab._localPrevTitle || tab._localPrevUrl;
            delete tab._localPrevUrl;
            delete tab._localPrevTitle;
          }
          tab.frame.element.classList.remove("hidden");
          tab.loading = false;
          showIframeLoading(false);
          updateAddressBar();
          updateTabsUI();
        }
      }

      function goLocalBack() {
        var tab = getActiveTab();
        if (!tab || !tab.localStack || tab.localStack.length < 2) return false;
        tab.localIndex = Math.max(0, (tab.localIndex || 0) - 1);
        var entry = tab.localStack[tab.localIndex];
        loadLocalPage(entry.url, { fromHistory: true, force: true });
        return true;
      }

      function goLocalForward() {
        var tab = getActiveTab();
        if (!tab || !tab.localStack || tab.localIndex == null || tab.localIndex >= tab.localStack.length - 1)
          return false;
        tab.localIndex++;
        var entry = tab.localStack[tab.localIndex];
        loadLocalPage(entry.url, { fromHistory: true, force: true });
        return true;
      }

      function renderLocalContent(url, res) {
        var cont = document.getElementById("local-page-container");
        if (!cont) return;
        var ct = res.contentType || "";
        if (res.html != null) {
          renderLocalHtml(cont, url, res.html);
          return;
        }
        if (res.status && res.status >= 400) {
          renderLocalError(url, res.error || res.text || "Error " + res.status);
          return;
        }
        if (res.error) {
          renderLocalError(url, res.error);
          return;
        }
        if (res.html != null) {
          renderLocalHtml(cont, url, res.html);
          return;
        }
        if (res.blobUrl) {
          if (ct.indexOf("image/") === 0) {
            renderLocalMediaFile(cont, url, res.blobUrl, "image", ct);
            return;
          }
          if (ct.indexOf("video/") === 0) {
            renderLocalMediaFile(cont, url, res.blobUrl, "video", ct);
            return;
          }
          if (ct.indexOf("audio/") === 0) {
            renderLocalMediaFile(cont, url, res.blobUrl, "audio", ct);
            return;
          }
          if (ct === "application/pdf") {
            renderLocalMediaFile(cont, url, res.blobUrl, "pdf", ct);
            return;
          }
          renderLocalDownload(cont, url, res.blobUrl, ct);
          return;
        }
        renderLocalText(cont, url, res.text != null ? res.text : "");
      }

      function renderLocalHtml(cont, url, html) {
        cont.innerHTML =
          '<iframe class="local-page-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" srcdoc="' +
          escapeAttr(html) +
          '"></iframe>';
      }

      function renderLocalMediaFile(cont, url, blobUrl, kind, ct) {
        var name = localTargetLabel(url);
        var inner = "";
        if (kind === "image") inner = '<img src="' + blobUrl + '" alt="' + escapeAttr(name) + '">';
        else if (kind === "video") inner = '<video src="' + blobUrl + '" controls autoplay></video>';
        else if (kind === "audio") inner = '<audio src="' + blobUrl + '" controls autoplay></audio>';
        else if (kind === "pdf")
          inner = '<object data="' + blobUrl + '" type="application/pdf" class="local-pdf-embed"></object>';
        cont.innerHTML =
          '<div class="local-file-view">' +
          '<div class="local-file-toolbar"><span class="local-file-name">' +
          escapeHtml(name) +
          '</span><span class="local-file-mime">' +
          escapeHtml(ct) +
          "</span></div>" +
          '<div class="local-file-body">' +
          inner +
          "</div></div>";
      }

      function renderLocalText(cont, url, text) {
        var name = localTargetLabel(url);
        var ext = name.split(".").pop().toLowerCase();
        var highlighted = highlightCode(text, ext);
        cont.innerHTML =
          '<div class="local-file-view">' +
          '<div class="local-file-toolbar"><span class="local-file-name">' +
          escapeHtml(name) +
          '</span><span class="local-file-mime">text/plain</span></div>' +
          '<div class="local-file-body local-text-body"><pre class="local-text-view">' +
          highlighted +
          "</pre></div></div>";
      }

      function renderLocalDownload(cont, url, blobUrl, ct) {
        var name = localTargetLabel(url);
        var view = document.createElement("div");
        view.className = "local-file-view";
        var toolbar = document.createElement("div");
        toolbar.className = "local-file-toolbar";
        var nameSpan = document.createElement("span");
        nameSpan.className = "local-file-name";
        nameSpan.textContent = name;
        var mimeSpan = document.createElement("span");
        mimeSpan.className = "local-file-mime";
        mimeSpan.textContent = ct;
        toolbar.appendChild(nameSpan);
        toolbar.appendChild(mimeSpan);
        var body = document.createElement("div");
        body.className = "local-file-body";
        var btn = document.createElement("button");
        btn.className = "local-download-link";
        var icon = document.createElement("i");
        icon.className = "fa-solid fa-download";
        btn.appendChild(icon);
        btn.appendChild(document.createTextNode(" Download " + name));
        btn.addEventListener("click", function () {
          sendToParent({ type: "scram:localDownload", url: url });
        });
        body.appendChild(btn);
        view.appendChild(toolbar);
        view.appendChild(body);
        cont.innerHTML = "";
        cont.appendChild(view);
      }

      function renderLocalError(url, msg) {
        var cont = document.getElementById("local-page-container");
        if (!cont) return;
        cont.innerHTML =
          '<div class="local-error-view">' +
          '<div class="local-error-code"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
          '<div class="local-error-msg">' +
          escapeHtml(msg) +
          '</div><div class="local-error-url">' +
          escapeHtml(url) +
          "</div></div>";
      }

      function buildProxyOfflineHtml(url) {
        var t = "var(--text)";
        var tm = "var(--text-muted)";
        var br = "var(--border)";
        var sg = "var(--surface-glass)";
        var dinoFrameHtml = yukiDinoGameHtml
          ? "<iframe class='dino-frame' srcdoc='" + escapeAttr(yukiDinoGameHtml) + "' title='T-Rex Runner' loading='lazy'></iframe>"
          : "<iframe class='dino-frame' src='https://wayou.github.io/t-rex-runner/' title='T-Rex Runner' loading='lazy'></iframe>";
        return (
          '<!DOCTYPE html><html><head><meta charset="utf-8"><title>This site can\'t be reached</title><style>' +
          "body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:" +
          t +
          ";font-family:system-ui,-apple-system,sans-serif}.offline{width:100%;max-width:640px;padding:20px;text-align:center}.dino{border:1px solid " +
          br +

      function highlightCode(code, ext) {
        var mode = "text";
        if (ext === "js" || ext === "mjs" || ext === "cjs" || ext === "ts") mode = "js";
        else if (ext === "html" || ext === "htm") mode = "html";
        else if (ext === "css") mode = "css";
        else if (ext === "json") mode = "json";
        else if (ext === "md" || ext === "markdown") mode = "markdown";
        if (mode === "text") return escapeHtml(code);
        var pattern = null;
        if (mode === "json") {
          pattern = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(\b(?:true|false|null)\b)/g;
        } else if (mode === "js") {
          pattern =
            /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(?:const|let|var|function|return|if|else|for|while|do|class|new|import|export|from|async|await|try|catch|finally|throw|typeof|instanceof|in|of|this|super|null|undefined|true|false|switch|case|break|continue|default|delete|void|yield|extends|static|get|set)\b|\b\d+(?:\.\d+)?\b/g;
        } else if (mode === "html") {
          pattern = /(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][^>]*>)|(&[a-zA-Z#0-9]+;)/g;
        } else if (mode === "css") {
          pattern =
            /(\/\*[\s\S]*?\*\/)|("[^"]*"|'[^']*')|(@[a-zA-Z-]+)|(-?[a-zA-Z-]+(?=\s*:))|(\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?\b)|([.#][a-zA-Z-]+)/g;
        } else if (mode === "markdown") {
          pattern = /(^#{1,6}[^\n]*$)|(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*]+\*)/gm;
        }
        if (!pattern) return escapeHtml(code);
        return code.replace(pattern, function (match, a, b, c, d, e, f) {
          var cls = null;
          if (mode === "json") {
            if (a && b) cls = "tok-key";
            else if (a) cls = "tok-str";
            else if (c) cls = "tok-num";
            else cls = "tok-bool";
          } else if (mode === "js") {
            if (a) cls = "tok-cmt";
            else if (b) cls = "tok-str";
            else if (c) cls = "tok-kw";
            else cls = "tok-num";
          } else if (mode === "html") {
            if (a) cls = "tok-cmt";
            else if (b) cls = "tok-tag";
            else cls = "tok-ent";
          } else if (mode === "css") {
            if (a) cls = "tok-cmt";
            else if (b) cls = "tok-str";
            else if (c) cls = "tok-at";
            else if (d) cls = "tok-prop";
            else if (e) cls = "tok-num";
            else cls = "tok-sel";
          } else if (mode === "markdown") {
            if (a) cls = "tok-md-head";
            else if (b) cls = "tok-md-code";
            else if (c) cls = "tok-md-bold";
            else cls = "tok-md-em";
          }
          if (!cls) return escapeHtml(match);
          return '<span class="' + cls + '">' + escapeHtml(match) + "</span>";
        });
      }

      function navigateToYukiPage(page, tabOverride) {
        if (_localActive) closeLocalPage();
        var tab = tabOverride || getActiveTab();
        if (!tab) return;
        var url = "yuki://" + page;
        tab._prevUrl = tab.url;
        tab._prevTitle = tab.title;
        tab.url = url;
        tab.title = page.charAt(0).toUpperCase() + page.slice(1).replace(/-/g, " ");
        tab.loading = false;
        _yukiActive = true;
        tabs.forEach(function (t) { t.frame.element.classList.add("hidden"); });
        var loadingEl = document.getElementById("loading");
        var errorEl = document.getElementById("error");
        if (loadingEl) loadingEl.style.display = "none";
        if (errorEl) errorEl.style.display = "none";
        var cont = document.getElementById("yuki-page-container");
        cont.style.display = "block";
        renderYukiPage(page);
        updateAddressBar();
        updateTabsUI();
        showIframeLoading(false);
        saveTabState();
      }

      function closeYukiPage() {
        _yukiActive = false;
        var cont = document.getElementById("yuki-page-container");
        if (cont) { cont.style.display = "none"; cont.innerHTML = ""; }
        var tab = getActiveTab();
        if (tab) {
          if (tab._prevUrl) {
            tab.url = tab._prevUrl;
            tab.title = tab._prevTitle || tab._prevUrl;
            delete tab._prevUrl;
            delete tab._prevTitle;
          }
          tab.frame.element.classList.remove("hidden");
          tab.loading = false;
          showIframeLoading(false);
          updateAddressBar();
          updateTabsUI();
        }
      }
