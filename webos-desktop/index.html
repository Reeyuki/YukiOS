    <link

      as="style"
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap"

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <script>
      (function () {
        const CDN_TEMPLATES = {
          jsdelivr: "https://cdn.jsdelivr.net/gh/Reeyuki/yukios@main/",
          quantil: "https://quantil.jsdelivr.net/gh/Reeyuki/yukios@main/",
          originfastly: "https://originfastly.jsdelivr.net/gh/Reeyuki/yukios@main/",
          gcore: "https://gcore.jsdelivr.net/gh/Reeyuki/yukios@main/",
          esmsh: "https://esm.sh/gh/Reeyuki/yukios@main/",
          statically: "https://cdn.statically.io/gh/Reeyuki/yukios@main/",
          staticdelivr: "https://cdn.staticdelivr.com/gh/Reeyuki/yukios/main/"
        };

        const savedMirror = localStorage.getItem("yukiOS_cdnMirror") || "jsdelivr";
        const baseUrl = CDN_TEMPLATES[savedMirror] || CDN_TEMPLATES.jsdelivr;
        const baseTag = document.querySelector("base");
        if (baseTag && baseTag.href !== baseUrl) {
          baseTag.href = baseUrl;
        }

        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll("img[src]").forEach((img) => {
            const src = img.getAttribute("src");
            if (src && !src.startsWith("http") && !src.startsWith("blob:") && !src.startsWith("data:")) {
              img.setAttribute("src", baseUrl + (src.startsWith("/") ? src.slice(1) : src));
            }
          });
        });
      })();
    </script>
    <base href="https://cdn.jsdelivr.net/gh/Reeyuki/yukios@main/" />

    <script>
      (function () {
        try {
          var href = new URL("manifest.webmanifest", window.location.href).toString();
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
