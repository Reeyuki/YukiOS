  <body>
    <h1
      style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap"
    >
      YukiOS - Free Browser-Based Desktop Environment
    </h1>
    <div id="selection-box"></div>

    <div id="desktop" class="desktop" role="presentation">
      <div id="start-menu" class="start-menu">
        <div class="start-sidebar">
          <div class="start-user">
            <img src="static/icons/guest.webp" alt="User avatar" />
            <span></span>
          </div>

          <div class="start-cat-list">
            <div class="start-cat" data-cat="favorites"><i class="fas fa-star"></i> Favorites</div>

            <div class="start-cat" data-cat="recent"><i class="fas fa-clock"></i> Recent</div>

            <div class="start-cat active" data-cat="all"><i class="fas fa-th"></i> All Applications</div>

            <div class="start-cat" data-cat="internet"><i class="fas fa-globe"></i> Internet</div>

            <div class="start-cat" data-cat="media"><i class="fas fa-music"></i> Media</div>

            <div class="start-cat" data-cat="office"><i class="fas fa-file-word"></i> Office</div>

            <div class="start-cat" data-cat="graphics"><i class="fas fa-paint-brush"></i> Graphics</div>

            <div class="start-cat" data-cat="games"><i class="fas fa-gamepad"></i> Games</div>

            <div class="start-cat" data-cat="development"><i class="fas fa-code"></i> Development</div>

            <div class="start-cat" data-cat="system"><i class="fas fa-screwdriver-wrench"></i> System</div>

            <div class="start-cat" data-cat="help"><i class="fas fa-question-circle"></i> Help</div>

            <div class="start-cat" data-cat="places"><i class="fas fa-folder"></i> Places</div>
          </div>

          <div class="start-cat" data-cat="settingsApp"><i class="fas fa-cog"></i> Settings</div>

          <div class="start-footer-actions">
            <button class="start-lock-btn" id="start-lock-btn" title="Lock System">
              <i class="fas fa-lock"></i>
            </button>
            <button class="start-signout-btn" id="start-signout-btn" title="Sign Out">
              <i class="fas fa-sign-out-alt"></i>
            </button>
            <button class="start-shutdown-btn" id="start-shutdown-btn" title="Shutdown">
              <i class="fas fa-power-off"></i>
            </button>
          </div>
        </div>

        <div class="start-content">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input id="start-menu-search" placeholder="Search..." autocomplete="off" />
          </div>

          <div class="start-page active" data-page="all">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="favorites"></div>

          <div class="start-page" data-page="recent"><div class="app-grid"></div></div>

          <div class="start-page" data-page="development">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="games">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="graphics">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="help">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="internet">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="media">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="office">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="system">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="places">
            <div class="places-section"></div>
          </div>
        </div>
      </div>

      <div id="taskbar">
        <div id="mac-menu-bar">
          <span class="mac-menu-item mac-menu-apple" data-start="true"><i class="fab fa-apple"></i></span>
          <span class="mac-menu-item">File</span>
          <span class="mac-menu-item">Edit</span>
          <span class="mac-menu-item">View</span>
          <span class="mac-menu-item">Go</span>
          <span class="mac-menu-item">Window</span>
          <span class="mac-menu-item">Help</span>
        </div>
        <div id="start-button"></div>
        <div id="taskbar-windows" style="display: flex"></div>
        <div id="system-tray">
          <div id="time-container">
            <div id="clock">12:00 PM</div>
            <div id="date">01/01/2026</div>
          </div>
          <div id="social-bar-container"></div>
        </div>
      </div>
    </div>
    <div id="context-menu"></div>
  </body>
