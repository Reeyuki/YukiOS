<!doctype html>
<html lang="en" style="background: #1e1e1e">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <base href="./" />

    <title>YukiOS</title>

    <meta
      name="description"
      content="YukiOS is a browser-based desktop environment with 80+ built-in apps, a virtual filesystem, windowed multitasking, a command palette, and persistent storage — all running directly in your browser."
    />

    <meta property="og:title" content="YukiOS – Browser-Based Desktop Environment with Apps & Productivity Tools" />

    <meta
      property="og:description"
      content="Experience a complete browser desktop environment with windowed apps, file management, notifications, settings, a command palette, and persistent storage powered entirely by web technologies."
    />

    <meta name="twitter:title" content="YukiOS – Browser-Based Desktop Environment with Apps & Productivity Tools" />

    <meta
      name="twitter:description"
      content="YukiOS transforms your browser into a full desktop environment with windowed multitasking, virtual storage, 80+ built-in apps, customization, productivity tools, and persistent storage."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/Reeyuki/YukiOS/main/.github/mac.png" />
    <meta property="og:site_name" content="YukiOS" />
    <meta property="og:url" content="https://yukios.netlify.app" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:description"
      content="YukiOS is a browser desktop environment with windowed multitasking, 80+ apps, a virtual filesystem, terminal, code editor, and persistent storage — no downloads required."
    />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/Reeyuki/YukiOS/main/.github/mac.png" />

    <meta name="application-name" content="YukiOS" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="canonical" href="https://yukios.netlify.app/" />
    <link rel="icon" href="favicon.ico" />
    <script>
      (function () {
        try {
          var href = new URL("manifest.webmanifest", window.location.href).toString();
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "YukiOS",
        "applicationCategory": "WebApplication",
        "operatingSystem": "Web Browser",
        "url": "https://yukios.netlify.app",
        "description": "YukiOS is a browser-based desktop operating system with windowed multitasking, a virtual filesystem, 80+ built-in applications, and persistent storage.",
        "featureList": [
          "Windowed desktop environment",
          "Virtual filesystem with persistent storage",
          "80+ built-in applications",
          "Browser-based code editor",
          "Integrated terminal",
          "Desktop notifications",
          "Command palette",
          "PWA support",
          "Custom wallpapers and themes",
          "User profiles and session management"
        ],
        "publisher": {
          "@type": "Organization",
          "name": "YukiOS"
        }
      }
    </script>
    <link href="src/styles/achievements.css" rel="stylesheet" />
    <link href="src/styles/converter.css" rel="stylesheet" />
    <link href="src/styles/desktop.css" rel="stylesheet" />
    <link href="src/styles/gamesAndApps.css" rel="stylesheet" />
    <link href="src/styles/notification.css" rel="stylesheet" />
    <link href="src/styles/session.css" rel="stylesheet" />
    <link href="src/styles/settings.css" rel="stylesheet" />
    <link href="src/styles/startMenu.css" rel="stylesheet" />
    <link href="src/styles/steam.css" rel="stylesheet" />
    <link href="src/styles/style.css" rel="stylesheet" />
    <link href="src/styles/systemUI.css" rel="stylesheet" />
    <link href="src/styles/taskbar.css" rel="stylesheet" />
    <link href="src/styles/widgets.css" rel="stylesheet" />
    <link href="src/styles/themes.css" rel="stylesheet" />
    <link href="src/styles/cursorEffect.css" rel="stylesheet" />
    <link href="src/styles/mobile.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script type="module" src="src/main.js"></script>
  </head>

  <body>
    <div id="selection-box"></div>

    <div id="desktop" class="desktop">
      <div id="start-menu" class="start-menu">
        <div class="start-sidebar">
          <div class="start-user">
            <img src="static/icons/guest.webp" alt="User avatar" />
            <span></span>
          </div>

          <div class="start-cat-list">
            <div class="start-cat" data-cat="favorites"><i class="fas fa-star"></i> Favorites</div>

            <div class="start-cat" data-cat="recent"><i class="fas fa-clock"></i> Recent</div>

            <div class="start-cat active" data-cat="all"><i class="fas fa-th"></i> All Applications</div>

            <div class="start-cat" data-cat="internet"><i class="fas fa-globe"></i> Internet</div>

            <div class="start-cat" data-cat="media"><i class="fas fa-music"></i> Media</div>

            <div class="start-cat" data-cat="office"><i class="fas fa-file-word"></i> Office</div>

            <div class="start-cat" data-cat="graphics"><i class="fas fa-paint-brush"></i> Graphics</div>

            <div class="start-cat" data-cat="games"><i class="fas fa-gamepad"></i> Games</div>

            <div class="start-cat" data-cat="development"><i class="fas fa-code"></i> Development</div>

            <div class="start-cat" data-cat="system"><i class="fas fa-screwdriver-wrench"></i> System</div>

            <div class="start-cat" data-cat="help"><i class="fas fa-question-circle"></i> Help</div>

            <div class="start-cat" data-cat="places"><i class="fas fa-folder"></i> Places</div>
          </div>

          <div class="start-cat" data-cat="settingsApp"><i class="fas fa-cog"></i> Settings</div>

          <div class="start-footer-actions">
            <button class="start-lock-btn" id="start-lock-btn" title="Lock System">
              <i class="fas fa-lock"></i>
            </button>
            <button class="start-signout-btn" id="start-signout-btn" title="Sign Out">
              <i class="fas fa-sign-out-alt"></i>
            </button>
            <button class="start-shutdown-btn" id="start-shutdown-btn" title="Shutdown">
              <i class="fas fa-power-off"></i>
            </button>
          </div>
        </div>

        <div class="start-content">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input id="start-menu-search" placeholder="Search..." autocomplete="off" />
          </div>

          <div class="start-page active" data-page="all">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="favorites"></div>

          <div class="start-page" data-page="recent"><div class="app-grid"></div></div>

          <div class="start-page" data-page="development">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="games">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="graphics">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="help">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="internet">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="media">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="office">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="system">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="places">
            <div class="places-section"></div>
          </div>
        </div>
      </div>

      <div id="taskbar">
        <div id="mac-menu-bar">
          <span class="mac-menu-item mac-menu-apple" data-start="true"><i class="fab fa-apple"></i></span>
          <span class="mac-menu-item">File</span>
          <span class="mac-menu-item">Edit</span>
          <span class="mac-menu-item">View</span>
          <span class="mac-menu-item">Go</span>
          <span class="mac-menu-item">Window</span>
          <span class="mac-menu-item">Help</span>
        </div>
        <div id="start-button"></div>
        <div id="taskbar-windows" style="display: flex"></div>
        <div id="system-tray">
          <div id="time-container">
            <div id="clock">12:00 PM</div>
            <div id="date">01/01/2026</div>
          </div>
          <div id="social-bar-container"></div>
        </div>
      </div>
    </div>
    <div id="context-menu"></div>
  </body>
</html>
