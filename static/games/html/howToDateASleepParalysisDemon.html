  <script>
    (function() {
      var CDN_BASE = "https://cdn.jsdelivr.net/gh/Reeyuki/how-to-date-a-sleep-paralysis-demon-webport@24ff346c96f0101870dbc33125e459e0650ebf65/";
      if (CDN_BASE[CDN_BASE.length - 1] !== "/") CDN_BASE += "/";
      var origFetch = window.fetch;
      function isAbsolute(u) {
        return /^(?:[a-z][a-z0-9+.-]*:|\/\/|data:|blob:)/i.test(u);
      }
      function resolve(u) {
        if (isAbsolute(u)) return u;
        var clean = u.replace(/^\/+/, "");
        try { return new URL(clean, CDN_BASE).href; } catch (e) { return CDN_BASE + clean; }
      }
      // --- wasm split handling ---
      var WASM_PARTS = ["renpy.wasm.a", "renpy.wasm.b"];
      var wasmCombinedPromise = null;
      function getWasmCombined() {
        if (wasmCombinedPromise) return wasmCombinedPromise;
        wasmCombinedPromise = Promise.all(WASM_PARTS.map(function(p) {
          var partUrl = new URL(p, CDN_BASE).href;
          return origFetch.call(window, partUrl).then(function(r) {
            if (!r.ok) throw new Error("Failed to fetch wasm part " + p + ": " + r.status);
            return r.arrayBuffer();
          });
        })).then(function(buffers) {
          var total = 0;
          for (var i = 0; i < buffers.length; i++) total += buffers[i].byteLength;
          var out = new Uint8Array(total);
          var off = 0;
          for (var i = 0; i < buffers.length; i++) {
            out.set(new Uint8Array(buffers[i]), off);
            off += buffers[i].byteLength;
          }
          return out;
        });
        return wasmCombinedPromise;
      }
      function isWasmRequest(urlStr) {
        try {
          var u = new URL(urlStr, CDN_BASE);
          // pathname ends with /renpy.wasm exactly, not .a/.b, allow query/hash stripped
          return u.pathname.endsWith("/renpy.wasm") || u.pathname.endsWith("renpy.wasm");
        } catch (e) { return false; }
      }
      // Prevent double-matching for part files: only exact renpy.wasm
      function shouldInterceptWasm(urlStr) {
        if (!isWasmRequest(urlStr)) return false;
        // exclude part requests like renpy.wasm.a / renpy.wasm.b
        if (/renpy\.wasm\.[ab](?:$|[?#])/.test(urlStr)) return false;
        if (/renpy\.wasm\.aa/.test(urlStr) || /renpy\.wasm\.ab/.test(urlStr)) return false;
        // Ensure last segment is exactly renpy.wasm (strip query/hash)
        var pathOnly = urlStr.split("?")[0].split("#")[0];
        return pathOnly.endsWith("renpy.wasm");
      }
      window.fetch = function(input, init) {
        var urlStr = null;
        if (typeof input === "string") urlStr = input;
        else if (input instanceof Request) urlStr = input.url;
        else if (input instanceof URL) urlStr = input.href;
        var resolved = urlStr != null ? resolve(urlStr) : null;
        if (resolved && shouldInterceptWasm(resolved)) {
          // Synthesize Response from concatenated parts; handles both fetch(string) and fetch(Request)
          // Must support WebAssembly.instantiateStreaming which consumes Response.stream
          return getWasmCombined().then(function(combined) {
            var headers = new Headers();
            headers.set("Content-Type", "application/wasm");
            headers.set("Content-Length", String(combined.byteLength));
            // Use Blob to allow streaming-like response
            var blob = new Blob([combined], { type: "application/wasm" });
            return new Response(blob, { status: 200, statusText: "OK", headers: headers });
          });
        }
        // normal CDN resolution
        if (typeof input === "string") {
          input = resolved;
        } else if (input instanceof Request) {
          if (resolved !== urlStr) {
            input = new Request(resolved, input);
          }
        } else if (input instanceof URL) {
          input = new URL(resolved);
        }
        return origFetch.call(this, input, init);
      };
    })();
  </script>

    html {

    body, html {

    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

      background: rgba(0, 0, 0, 0.5);

    }

      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
